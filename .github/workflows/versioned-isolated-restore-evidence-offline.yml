name: Offline versioned isolated restore evidence
on:
  pull_request:
    paths:
      - scripts/assess-versioned-isolated-restore-evidence-offline.mjs
      - tests/assess-versioned-isolated-restore-evidence-offline.test.mjs
      - .github/workflows/versioned-isolated-restore-evidence-offline.yml
permissions:
  contents: read
jobs:
  offline:
    name: Offline isolated restore evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --test tests/assess-versioned-isolated-restore-evidence-offline.test.mjs
