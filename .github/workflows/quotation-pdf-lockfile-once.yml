name: One-shot quotation PDF dependency lock generation
on:
  push:
    branches:
      - review/quotation-pin-pdf-lockfile-2542
    paths:
      - .github/workflows/quotation-pdf-lockfile-once.yml
permissions:
  contents: write
jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/review/quotation-pin-pdf-lockfile-2542'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: review/quotation-pin-pdf-lockfile-2542
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact pinned dependency and resolved transitive lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact pdf-lib@1.17.1
      - name: Verify lockfile and commit only two manifest files to this review branch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
            if(p.dependencies["pdf-lib"]!=="1.17.1"||lock.packages[""].dependencies["pdf-lib"]!=="1.17.1"||
               lock.packages["node_modules/pdf-lib"]?.version!=="1.17.1")
              process.exit(1);
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(quotation): lock pdf-lib 1.17.1 and resolved dependencies"
          git push origin HEAD:refs/heads/review/quotation-pin-pdf-lockfile-2542
