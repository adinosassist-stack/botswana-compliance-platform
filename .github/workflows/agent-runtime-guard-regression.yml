name: Agent runtime guard regression

on:
  pull_request:
    paths:
      - 'cloudflare/src/agent-policy.js'
      - 'cloudflare/src/agent-runtime-guard.js'
      - 'cloudflare/src/delegated-authority.js'
      - 'cloudflare/src/agent-cost-admission.js'
      - 'cloudflare/src/agentic-task-execution.js'
      - 'cloudflare/preflight-production.sh'
      - 'cloudflare/wrangler.toml'
      - 'public/js/owner-command-centre.js'
      - 'tests/agent-runtime-guard-regression-20261009.mjs'
      - 'tests/v100-platform-admin-task-canary.mjs'
      - 'docs/AGENT_RUNTIME_GOVERNANCE.md'
      - 'docs/LAUNCH.md'
      - 'docs/LAUNCH_STATUS.md'
      - '.github/workflows/agent-runtime-guard-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Syntax and authorization regression
        run: |
          node --check tests/agent-runtime-guard-regression-20261009.mjs
          node --check tests/v100-platform-admin-task-canary.mjs
          node tests/agent-runtime-guard-regression-20261009.mjs
          node tests/v100-platform-admin-task-canary.mjs
