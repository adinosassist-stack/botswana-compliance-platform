name: Manual bank checkout and resubmission acceptance (offline)
on:
  pull_request:
    paths:
      - 'cloudflare/src/worker.js'
      - 'tests/manual-bank-checkout-resubmission.test.mjs'
      - 'tests/manual-bank-owner-approval-flow.test.mjs'
      - 'docs/owner-payment-release-qualification.md'
      - '.github/workflows/manual-bank-checkout-acceptance.yml'
permissions:
  contents: read
jobs:
  test-manual-bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR merge ref without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Syntax check actual Worker route and harness
        run: |
          node --check cloudflare/src/worker.js
          node --check tests/manual-bank-checkout-resubmission.test.mjs
          node --check tests/manual-bank-owner-approval-flow.test.mjs
      - name: Exercise checkout, submission, rejection/retry, owner approval and entitlement fences
        run: |
          node --test \
            tests/manual-bank-checkout-resubmission.test.mjs \
            tests/manual-bank-owner-approval-flow.test.mjs
