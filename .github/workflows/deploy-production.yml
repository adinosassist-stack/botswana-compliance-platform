name: Thebe Desk Production Deploy
run-name: Production deploy ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

on:
  workflow_run:
    workflows: ["BF-07 Supply-Chain Seal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character main commit SHA to deploy; it must already have successful Main Governance Guard, Recovery CI and BF-07 runs'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: thebe-desk-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact qualified SHA to Cloudflare
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
      CI: 'true'
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      PUBLIC_APP_URL: https://thebedesk.com
      PUBLIC_ORIGIN: https://thebedesk.com
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
      PLATFORM_REGULATORY_REVIEWERS: ${{ vars.PLATFORM_REGULATORY_REVIEWERS }}
      EVIDENCE_SCAN_API_URL: ''
      PAYMENT_PROVIDER_OVERRIDE: none
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_REDIRECT_URI: https://thebedesk.com/api/auth/oauth/google/callback
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      FACEBOOK_OAUTH_REDIRECT_URI: https://thebedesk.com/api/auth/oauth/facebook/callback
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      THEBE_BANK_NAME: ${{ vars.THEBE_BANK_NAME }}
      THEBE_BANK_ACCOUNT_NAME: ${{ vars.THEBE_BANK_ACCOUNT_NAME }}
      THEBE_BANK_ACCOUNT_NUMBER: ${{ vars.THEBE_BANK_ACCOUNT_NUMBER }}
      THEBE_BANK_ACCOUNT_TYPE: ${{ vars.THEBE_BANK_ACCOUNT_TYPE }}
      THEBE_BANK_BRANCH_NAME: ${{ vars.THEBE_BANK_BRANCH_NAME }}
      THEBE_BANK_BRANCH_CODE: ${{ vars.THEBE_BANK_BRANCH_CODE }}
      THEBE_BANK_SWIFT_CODE: ${{ vars.THEBE_BANK_SWIFT_CODE }}

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'TARGET_SHA must be a full lowercase 40-character commit SHA' >&2; exit 1; }
          head_sha="$(git rev-parse HEAD)"
          local_main_sha="$(git rev-parse origin/main)"
          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$head_sha" == "$TARGET_SHA" ]] || { echo "checkout mismatch expected=$TARGET_SHA actual=$head_sha" >&2; exit 1; }
          [[ "$local_main_sha" == "$TARGET_SHA" ]] || { echo "checkout main snapshot mismatch target=$TARGET_SHA snapshot=$local_main_sha" >&2; exit 1; }
          [[ "$main_sha" == "$TARGET_SHA" ]] || { echo "refusing stale/non-main deploy target=$TARGET_SHA current-main=$main_sha" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean before deployment qualification' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify pinned npm
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "String(require('./package.json').packageManager).replace(/^npm@/,'')")"
          actual="$(npm --version)"
          [[ "$actual" == "$expected" ]] || { echo "npm mismatch expected=$expected actual=$actual" >&2; exit 1; }

      - name: Require successful Main Governance Guard, Recovery CI and BF-07 for exact SHA
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {appendFileSync, readFileSync} = await import('node:fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const sha = process.env.TARGET_SHA;
          const token = process.env.GH_TOKEN;
          const eventName = process.env.GITHUB_EVENT_NAME;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${token}`,
            'x-github-api-version': '2022-11-28'
          };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function successful(workflow, label, {wait = false, requiredEvent = null} = {}) {
            const attempts = wait ? 37 : 1;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow}/runs?branch=main&per_page=100`;
              const response = await fetch(url, {headers});
              if (!response.ok) throw new Error(`${label} lookup failed: HTTP ${response.status}`);
              const body = await response.json();
              const exactRuns = (body.workflow_runs || []).filter(r =>
                r.head_sha === sha &&
                r.head_branch === 'main' &&
                (!requiredEvent || r.event === requiredEvent)
              );
              const passed = exactRuns.find(r => r.status === 'completed' && r.conclusion === 'success');
              if (passed) {
                console.log(`${label} qualified exact SHA ${sha} with run ${passed.id}`);
                return passed;
              }
              const failed = exactRuns.find(r => r.status === 'completed' && r.conclusion && r.conclusion !== 'success');
              if (failed) throw new Error(`${label} completed as ${failed.conclusion} for exact SHA ${sha} (run ${failed.id})`);
              if (!wait || attempt === attempts) break;
              console.log(`${label} for exact SHA ${sha} is not complete yet; bounded wait ${attempt}/${attempts - 1}`);
              await sleep(10_000);
            }
            throw new Error(`${label} has no successful completed run for exact SHA ${sha}`);
          }
          await successful('main-governance-guard.yml', 'Main Governance Guard', {
            wait: eventName === 'workflow_run',
            requiredEvent: 'push'
          });
          await successful('recovery-ci.yml', 'Recovery CI', {wait: eventName === 'workflow_run'});
          let bf07Run;
          if (eventName === 'workflow_dispatch') {
            bf07Run = await successful('bf07-seal.yml', 'BF-07 Supply-Chain Seal');
          } else {
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const run = event.workflow_run || {};
            if (run.head_sha !== sha || run.head_branch !== 'main' || run.conclusion !== 'success') {
              throw new Error('triggering BF-07 run does not bind to the exact current main SHA');
            }
            bf07Run = run;
            console.log(`Triggering BF-07 run ${bf07Run.id} qualified exact SHA ${sha}`);
          }
          if (!/^\d+$/.test(String(bf07Run?.id || '')) || !/^\d+$/.test(String(bf07Run?.run_attempt || ''))) {
            throw new Error('BF-07 qualification did not resolve a valid workflow run identity');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `bf07_run_id=${bf07Run.id}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `bf07_run_attempt=${bf07Run.run_attempt}\n`);
          NODE

      - name: Restore exact BF-07 seal evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bf07-sealed-${{ env.TARGET_SHA }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.qualification.outputs.bf07_run_id }}

      - name: Clean install from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Recheck deployment closure at candidate boundary
        env:
          BF07_EXPECTED_REPOSITORY: ${{ github.repository }}
          BF07_EXPECTED_SHA: ${{ env.TARGET_SHA }}
          BF07_EXPECTED_REF: refs/heads/main
          BF07_EXPECTED_RUN_ID: ${{ steps.qualification.outputs.bf07_run_id }}
          BF07_EXPECTED_RUN_ATTEMPT: ${{ steps.qualification.outputs.bf07_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          npm run check:bf07-toolchain
          npm run test:thebe-desk-deployment
          npm run launch:gate
          npm audit --omit=dev --audit-level=high

      - name: Validate non-secret production environment inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            D1_DATABASE_ID TURNSTILE_SITE_KEY PLATFORM_ADMIN_EMAILS PLATFORM_REGULATORY_REVIEWERS
            GOOGLE_OAUTH_REDIRECT_URI FACEBOOK_OAUTH_REDIRECT_URI
            THEBE_BANK_NAME THEBE_BANK_ACCOUNT_NAME THEBE_BANK_ACCOUNT_NUMBER THEBE_BANK_BRANCH_NAME THEBE_BANK_BRANCH_CODE THEBE_BANK_SWIFT_CODE
          )
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Missing GitHub production environment value: $key" >&2; exit 1; }
          done
          [[ "$D1_DATABASE_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || { echo 'D1_DATABASE_ID must be a provisioned D1 UUID' >&2; exit 1; }
          [[ "$GOOGLE_OAUTH_REDIRECT_URI" == 'https://thebedesk.com/api/auth/oauth/google/callback' ]] || { echo 'GOOGLE_OAUTH_REDIRECT_URI must use the exact production callback' >&2; exit 1; }
          [[ "$FACEBOOK_OAUTH_REDIRECT_URI" == 'https://thebedesk.com/api/auth/oauth/facebook/callback' ]] || { echo 'FACEBOOK_OAUTH_REDIRECT_URI must use the exact production callback' >&2; exit 1; }

      - name: Diagnose Cloudflare authorization boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'CLOUDFLARE_API_TOKEN is empty' >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'CLOUDFLARE_ACCOUNT_ID must be a 32-character account identifier' >&2; exit 1; }

          probe_json() {
            local label="$1" path="$2" allow_worker_missing="${3:-false}"
            local tmp status
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Accept: application/json' \
              --output "$tmp" --write-out '%{http_code}' "$API$path" || true)"
            LABEL="$label" STATUS="$status" ALLOW_WORKER_MISSING="$allow_worker_missing" python3 - "$tmp" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          label = os.environ['LABEL']
          raw_status = os.environ.get('STATUS', '')
          allow_missing = os.environ.get('ALLOW_WORKER_MISSING') == 'true'
          try:
              status = int(raw_status)
          except ValueError:
              raise SystemExit(f'{label}: invalid HTTP status {raw_status!r}')
          try:
              with open(path, encoding='utf-8') as handle:
                  body = json.load(handle)
          except Exception as exc:
              raise SystemExit(f'{label}: invalid JSON response: {exc}')
          errors = body.get('errors') if isinstance(body, dict) else []
          errors = errors if isinstance(errors, list) else []
          worker_missing = allow_missing and status == 404 and any(
              isinstance(error, dict) and error.get('code') == 10090 for error in errors
          )
          ok = (200 <= status < 300 and body.get('success') is not False) or worker_missing
          if not ok:
              summary = ' | '.join(
                  f"{error.get('code', 'unknown')}:{str(error.get('message', 'unknown'))[:180]}"
                  for error in errors if isinstance(error, dict)
              ) or 'none'
              raise SystemExit(f'{label}: HTTP {status}; errors={summary}')
          print(f'{label}: HTTP {status}; authorized=true' + ('; allowed_first_deploy_absence=true' if worker_missing else ''))
          PY
            rm -f "$tmp"
          }

          if [[ "$CLOUDFLARE_API_TOKEN" == cfat_* ]]; then
            VERIFY_PATH="/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          else
            VERIFY_PATH='/user/tokens/verify'
          fi
          probe_json 'token verification' "$VERIFY_PATH"
          probe_json 'account scope' "/accounts/$CLOUDFLARE_ACCOUNT_ID"
          probe_json 'Worker service metadata' "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/bw-compliance-os" true
          probe_json 'Workers scripts scope' "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          probe_json 'D1 binding' "/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID"
          probe_json 'R2 binding' "/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/bw-compliance-evidence"
          probe_json 'Workers AI binding' "/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/models/search?per_page=1"
          probe_json 'Workers custom-domain visibility' "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
          echo 'Cloudflare token, account, Worker, D1, R2, AI and custom-domain authorization boundaries verified.'

          for edge_path in /api/live /api/ready /api/auth/anti-bot-config; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --max-time 12 --output "$tmp" --write-out '%{http_code}' "https://thebedesk.com$edge_path" || true)"
            body="$(tr '\n' ' ' < "$tmp" | cut -c1-300)"
            rm -f "$tmp"
            echo "Public edge $edge_path fingerprint: HTTP ${status:-curl_error}; body=${body:-<empty>}"
          done

      - name: Prepare pinned Wrangler CLI outside candidate workspace
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER_ROOT="$RUNNER_TEMP/wrangler-cli"
          NPM_HOME="$RUNNER_TEMP/npm-home"
          rm -rf "$WRANGLER_ROOT" "$NPM_HOME"
          mkdir -p "$WRANGLER_ROOT" "$NPM_HOME"
          (
            cd "$RUNNER_TEMP"
            HOME="$NPM_HOME" \
            NPM_CONFIG_USERCONFIG=/dev/null \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            NPM_CONFIG_IGNORE_SCRIPTS=true \
            npm install --prefix "$WRANGLER_ROOT" --no-audit --no-fund --no-save --package-lock=false wrangler@4.135.0
          )
          WRANGLER_JS="$WRANGLER_ROOT/node_modules/wrangler/bin/wrangler.js"
          test -f "$WRANGLER_JS"
          version="$(node "$WRANGLER_JS" --version)"
          [[ "$version" == *'4.135.0'* ]] || { echo "unexpected Wrangler version: $version" >&2; exit 1; }

      - name: Render, preflight and dry-run Cloudflare production candidate without real secrets
        id: candidate_config
        shell: bash
        run: |
          set -euo pipefail
          PROD_CONFIG="$RUNNER_TEMP/thebe-wrangler-production.toml"
          DRYRUN_SECRETS="$RUNNER_TEMP/thebe-worker-secrets-dry-run.json"
          WRANGLER_JS="$RUNNER_TEMP/wrangler-cli/node_modules/wrangler/bin/wrangler.js"
          cleanup(){ rm -f "$DRYRUN_SECRETS"; }
          trap cleanup EXIT

          sh cloudflare/render-production-config.sh cloudflare/wrangler.toml > "$PROD_CONFIG"
          chmod 600 "$PROD_CONFIG"
          sh cloudflare/preflight-production.sh "$PROD_CONFIG"
          if grep -Eq '^[[:space:]]*\[build\]|^[[:space:]]*command[[:space:]]*=' "$PROD_CONFIG"; then
            echo 'Production Wrangler config must not contain candidate-controlled build commands.' >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const names = [
            'SESSION_SECRET','AUDIT_INTEGRITY_SECRET','OPERATIONS_SECRET','AUTOMATION_SECRET',
            'TURNSTILE_SECRET_KEY','PAYMENT_WEBHOOK_SECRET','BILLING_WEBHOOK_SECRET',
            'GOOGLE_OAUTH_CLIENT_SECRET','FACEBOOK_APP_SECRET','RESEND_API_KEY','OPENAI_API_KEY'
          ];
          const out = Object.fromEntries(names.map(name => [name, `dry-run-placeholder-${name.toLowerCase()}`]));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/thebe-worker-secrets-dry-run.json', JSON.stringify(out), {mode: 0o600});
          NODE
          test -s "$DRYRUN_SECRETS"
          node "$WRANGLER_JS" deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run" --secrets-file "$DRYRUN_SECRETS" --config "$PROD_CONFIG"
          config_sha256="$(sha256sum "$PROD_CONFIG" | awk '{print $1}')"
          [[ "$config_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo 'invalid rendered production config digest' >&2; exit 1; }
          printf 'config_sha256=%s\n' "$config_sha256" >> "$GITHUB_OUTPUT"
          cleanup
          trap - EXIT

      - name: Reconfirm exact current main at deployment boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo 'deployment checkout moved after qualification' >&2; exit 1; }
          live_main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$live_main_sha" == "$TARGET_SHA" ]] || { echo "refusing stale deployment at mutation boundary: target=$TARGET_SHA current-main=$live_main_sha" >&2; exit 1; }
          actual_config_sha256="$(sha256sum "$RUNNER_TEMP/thebe-wrangler-production.toml" | awk '{print $1}')"
          [[ "$actual_config_sha256" == '${{ steps.candidate_config.outputs.config_sha256 }}' ]] || { echo 'rendered production config changed after dry-run qualification' >&2; exit 1; }

      - name: Deploy exact candidate to Cloudflare
        id: deploy_mutation
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
          OPERATIONS_SECRET: ${{ secrets.OPERATIONS_SECRET }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PROD_CONFIG="$RUNNER_TEMP/thebe-wrangler-production.toml"
          SECRETS_FILE="$RUNNER_TEMP/thebe-worker-secrets.json"
          WRANGLER_JS="$RUNNER_TEMP/wrangler-cli/node_modules/wrangler/bin/wrangler.js"
          cleanup(){ rm -f "$SECRETS_FILE" "$PROD_CONFIG"; }
          trap cleanup EXIT

          required_secrets=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SESSION_SECRET AUDIT_INTEGRITY_SECRET
            OPERATIONS_SECRET AUTOMATION_SECRET TURNSTILE_SECRET_KEY PAYMENT_WEBHOOK_SECRET BILLING_WEBHOOK_SECRET
            OPENAI_API_KEY
          )
          missing_secrets=()
          for key in "${required_secrets[@]}"; do
            [[ -n "${!key:-}" ]] || missing_secrets+=("$key")
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            printf 'Missing required production secret(s): %s\n' "${missing_secrets[*]}" >&2
            exit 1
          fi
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'CLOUDFLARE_ACCOUNT_ID must be a 32-character account identifier' >&2; exit 1; }

          google_enabled=false
          facebook_enabled=false
          email_enabled=false
          if [[ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" || -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]]; then
            [[ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" && -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]] || { echo 'Google OAuth must be configured with both client ID and client secret, or deferred completely' >&2; exit 1; }
            google_enabled=true
          fi
          if [[ -n "${FACEBOOK_APP_ID:-}" || -n "${FACEBOOK_APP_SECRET:-}" ]]; then
            [[ -n "${FACEBOOK_APP_ID:-}" && -n "${FACEBOOK_APP_SECRET:-}" ]] || { echo 'Facebook OAuth must be configured with both app ID and app secret, or deferred completely' >&2; exit 1; }
            facebook_enabled=true
          fi
          if [[ -n "${EMAIL_FROM:-}" || -n "${RESEND_API_KEY:-}" ]]; then
            [[ -n "${EMAIL_FROM:-}" && -n "${RESEND_API_KEY:-}" ]] || { echo 'Transactional email must be configured with both EMAIL_FROM and RESEND_API_KEY, or deferred completely' >&2; exit 1; }
            email_enabled=true
          fi

          test -f "$WRANGLER_JS"
          actual_config_sha256="$(sha256sum "$PROD_CONFIG" | awk '{print $1}')"
          [[ "$actual_config_sha256" == '${{ steps.candidate_config.outputs.config_sha256 }}' ]] || { echo 'rendered production config changed before mutation' >&2; exit 1; }
          if grep -Eq '^[[:space:]]*\[build\]|^[[:space:]]*command[[:space:]]*=' "$PROD_CONFIG"; then
            echo 'Refusing secret-bearing deploy with candidate-controlled build commands.' >&2
            exit 1
          fi

          live_main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$live_main_sha" == "$TARGET_SHA" ]] || { echo "refusing stale deployment at secret-bearing mutation boundary: target=$TARGET_SHA current-main=$live_main_sha" >&2; exit 1; }

          node <<'NODE'
          const fs = require('node:fs');
          const coreNames = [
            'SESSION_SECRET','AUDIT_INTEGRITY_SECRET','OPERATIONS_SECRET','AUTOMATION_SECRET',
            'TURNSTILE_SECRET_KEY','PAYMENT_WEBHOOK_SECRET','BILLING_WEBHOOK_SECRET','OPENAI_API_KEY'
          ];
          const optionalNames = ['GOOGLE_OAUTH_CLIENT_SECRET','FACEBOOK_APP_SECRET','RESEND_API_KEY'];
          const out = {};
          for (const name of coreNames) {
            const value = process.env[name] || '';
            if (!value) throw new Error(`Missing required runtime secret ${name}`);
            out[name] = value;
          }
          for (const name of optionalNames) {
            const value = process.env[name] || '';
            if (value) out[name] = value;
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/thebe-worker-secrets.json', JSON.stringify(out), {mode: 0o600});
          NODE
          test -s "$SECRETS_FILE"

          live_main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$live_main_sha" == "$TARGET_SHA" ]] || { echo "main advanced after runtime secret preparation; refusing deploy target=$TARGET_SHA current-main=$live_main_sha" >&2; exit 1; }
          node "$WRANGLER_JS" deploy --secrets-file "$SECRETS_FILE" --config "$PROD_CONFIG"
          printf 'google_enabled=%s\nfacebook_enabled=%s\nemail_enabled=%s\n' "$google_enabled" "$facebook_enabled" "$email_enabled" >> "$GITHUB_OUTPUT"
          cleanup
          trap - EXIT

      - name: Verify live production readiness
        env:
          GOOGLE_ENABLED: ${{ steps.deploy_mutation.outputs.google_enabled }}
          FACEBOOK_ENABLED: ${{ steps.deploy_mutation.outputs.facebook_enabled }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_200_json() {
            local label="$1" url="$2" attempts="$3" method="${4:-GET}"
            local tmp status body compact
            for ((attempt=1; attempt<=attempts; attempt++)); do
              tmp="$(mktemp)"
              if [[ "$method" == "POST" ]]; then
                status="$(curl --silent --show-error --max-time 12 --request POST \
                  --header 'content-type: application/json' --header 'origin: https://thebedesk.com' \
                  --data '{}' --output "$tmp" --write-out '%{http_code}' "$url" || true)"
              else
                status="$(curl --silent --show-error --max-time 12 --output "$tmp" --write-out '%{http_code}' "$url" || true)"
              fi
              body="$(cat "$tmp")"
              rm -f "$tmp"
              if [[ "$status" == "200" ]]; then
                printf '%s' "$body"
                return 0
              fi
              compact="$(printf '%s' "$body" | tr '\n' ' ' | cut -c1-500)"
              echo "$label stabilization attempt $attempt/$attempts status=${status:-curl_error} body=${compact:-<empty>}" >&2
              if (( attempt < attempts )); then sleep 5; fi
            done
            echo "$label did not stabilize with HTTP 200 after $attempts bounded attempts" >&2
            return 1
          }

          live="$(wait_for_200_json 'api/live' 'https://thebedesk.com/api/live' 36 GET)"
          ready="$(wait_for_200_json 'api/ready' 'https://thebedesk.com/api/ready' 18 GET)"
          proof="$(wait_for_200_json 'registration-proof' 'https://thebedesk.com/api/auth/registration-proof/challenge' 12 POST)"

          google_enabled="${GOOGLE_ENABLED:-false}"
          facebook_enabled="${FACEBOOK_ENABLED:-false}"
          google_location=""
          facebook_location=""
          if [[ "$google_enabled" == 'true' ]]; then
            google_location="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --max-time 20 --output /dev/null --write-out '%{redirect_url}' 'https://thebedesk.com/api/auth/oauth/google/start')"
          fi
          if [[ "$facebook_enabled" == 'true' ]]; then
            facebook_location="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --max-time 20 --output /dev/null --write-out '%{redirect_url}' 'https://thebedesk.com/api/auth/oauth/facebook/start')"
          fi
          LIVE_JSON="$live" READY_JSON="$ready" PROOF_JSON="$proof" GOOGLE_ENABLED="$google_enabled" FACEBOOK_ENABLED="$facebook_enabled" GOOGLE_LOCATION="$google_location" FACEBOOK_LOCATION="$facebook_location" node <<'NODE'
          const live = JSON.parse(process.env.LIVE_JSON);
          const ready = JSON.parse(process.env.READY_JSON);
          const proof = JSON.parse(process.env.PROOF_JSON);
          if (live.ok !== true) throw new Error('/api/live did not return ok=true');
          if (ready.ok !== true || ready.schemaReady !== true || ready.requiredConfigReady !== true) {
            throw new Error('/api/ready did not prove schemaReady=true and requiredConfigReady=true');
          }
          if (proof.provider !== 'thebe_proof' || proof.required !== true || proof.action !== 'register') {
            throw new Error('first-party registration proof contract is not active');
          }
          if (typeof proof.token !== 'string' || proof.token.length < 80 || !proof.token.includes('.')) {
            throw new Error('first-party registration proof token is missing or malformed');
          }
          if (!Number.isInteger(proof.difficulty) || proof.difficulty < 8 || proof.difficulty > 16) {
            throw new Error('first-party registration proof difficulty is outside the hardened range');
          }
          if (!Number.isInteger(proof.expiresInSeconds) || proof.expiresInSeconds < 60 || proof.expiresInSeconds > 600) {
            throw new Error('first-party registration proof TTL is outside the hardened range');
          }
          const enabled = value => String(value).toLowerCase() === 'true';
          if (enabled(process.env.GOOGLE_ENABLED)) {
            const google = new URL(process.env.GOOGLE_LOCATION);
            if (google.protocol !== 'https:' || google.hostname !== 'accounts.google.com') throw new Error('Google OAuth start did not redirect to accounts.google.com');
          } else if (process.env.GOOGLE_LOCATION) {
            throw new Error('Google OAuth produced a redirect while integration is deferred');
          }
          if (enabled(process.env.FACEBOOK_ENABLED)) {
            const facebook = new URL(process.env.FACEBOOK_LOCATION);
            if (facebook.protocol !== 'https:' || facebook.hostname !== 'www.facebook.com') throw new Error('Facebook OAuth start did not redirect to www.facebook.com');
          } else if (process.env.FACEBOOK_LOCATION) {
            throw new Error('Facebook OAuth produced a redirect while integration is deferred');
          }
          const integrations = [
            enabled(process.env.GOOGLE_ENABLED) ? 'google' : 'google-deferred',
            enabled(process.env.FACEBOOK_ENABLED) ? 'facebook' : 'facebook-deferred'
          ].join('+');
          console.log(`Production ready: version=${ready.version || 'unknown'} schema=${ready.expectedSchemaDelta || 'unknown'} registrationProof=thebe_proof oauth=${integrations}`);
          NODE

      - name: Record deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          printf 'Thebe Desk production deployment succeeded\nSHA: %s\nOrigin: https://thebedesk.com\n' "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
