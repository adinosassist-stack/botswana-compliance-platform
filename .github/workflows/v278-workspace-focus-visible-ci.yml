name: V278 Workspace focus-visible CI

on:
  pull_request:
    paths:
      - "public/js/workspace-focus-visible-v278.js"
      - "cloudflare/src/asset-release-identity.js"
      - "tests/v278-workspace-focus-visible.mjs"
      - "tests/v278-workspace-focus-visible-browser.mjs"
      - ".github/workflows/client-runtime-identity-ci.yml"
      - ".github/workflows/v278-workspace-focus-visible-ci.yml"
  push:
    branches:
      - main
    paths:
      - "public/js/workspace-focus-visible-v278.js"
      - "cloudflare/src/asset-release-identity.js"
      - "tests/v278-workspace-focus-visible.mjs"
      - "tests/v278-workspace-focus-visible-browser.mjs"
      - ".github/workflows/client-runtime-identity-ci.yml"
      - ".github/workflows/v278-workspace-focus-visible-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-focus-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Syntax and delivery contract
        run: |
          node --check public/js/workspace-focus-visible-v278.js
          node --check cloudflare/src/asset-release-identity.js
          node --check tests/v278-workspace-focus-visible.mjs
          node --check tests/v278-workspace-focus-visible-browser.mjs
          node tests/v278-workspace-focus-visible.mjs

      - name: Verify keyboard and mouse focus modality in Chromium
        run: node tests/v278-workspace-focus-visible-browser.mjs

      - name: Preserve surrounding workspace navigation regressions
        run: |
          node tests/v272-property-navigation-browser.mjs
          node tests/v256-workspace-ui-defects-browser.mjs
          node tests/people-workspace-browser-20261003.mjs
