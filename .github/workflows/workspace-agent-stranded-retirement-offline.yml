name: Workspace Agent stranded-version retirement offline contract
on:
  pull_request:
    paths:
      - 'scripts/workspace-agent-stranded-retirement-eligibility.mjs'
      - 'tests/workspace-agent-stranded-retirement-eligibility.test.mjs'
      - '.github/workflows/workspace-agent-stranded-retirement-eligibility.yml'
      - '.github/workflows/workspace-agent-stranded-retirement-offline.yml'
  push:
    paths:
      - 'scripts/workspace-agent-stranded-retirement-eligibility.mjs'
      - 'tests/workspace-agent-stranded-retirement-eligibility.test.mjs'
      - '.github/workflows/workspace-agent-stranded-retirement-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unsafe undeployed version retirement decision is fail-closed
        run: node --test tests/workspace-agent-stranded-retirement-eligibility.test.mjs
