name: Essentials offline qualification
on:
  pull_request:
    paths:
      - 'server/essentials-*.mjs'
      - 'server/quotation-model.mjs'
      - 'server/project-job-costing-preview.js'
      - 'public/js/essentials-*.mjs'
      - 'tests/essentials-*.test.mjs'
      - 'tests/essentials_d1_schema_sqlite.py'
      - 'tests/essentials_accepted_quotation_sqlite.py'
      - 'tests/essentials_private_consent_authority_sqlite.py'
      - 'tests/essentials_private_frozen_evidence_sqlite.py'
      - 'tests/essentials_private_one_time_consent_sqlite.py'
      - 'cloudflare/migrations/essentials_private_one_time_consent_STAGING_CANDIDATE.sql'
      - 'cloudflare/migrations/essentials_private_consent_authority_STAGING_CANDIDATE.sql'
      - 'tests/essentials_guarded_replay_sqlite.py'
      - 'cloudflare/migrations/essentials_accepted_quotation_snapshots_STAGING_CANDIDATE.sql'
      - 'tests/fixtures/essentials_d1_synthetic_dependencies_STAGING_ONLY.sql'
      - 'cloudflare/migrations/essentials_invoice_drafts_STAGING_ONLY.sql'
      - '.github/workflows/essentials-offline.yml'
permissions:
  contents: read
jobs:
  essentials-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check Essentials source syntax
        run: |
          for file in server/essentials-*.mjs public/js/essentials-*.mjs; do node --check "$file"; done
      - name: Run Essentials unit tests and existing job-cost regression
        run: |
          node --test tests/essentials-*.test.mjs tests/project-job-costing-preview.test.mjs
      - name: Qualify additive draft D1 schema using SQLite
        run: |
          python3 tests/essentials_d1_schema_sqlite.py
          python3 tests/essentials_accepted_quotation_sqlite.py
          python3 tests/essentials_private_consent_authority_sqlite.py
          python3 tests/essentials_private_frozen_evidence_sqlite.py
          python3 tests/essentials_private_one_time_consent_sqlite.py
          python3 tests/essentials_guarded_replay_sqlite.py
