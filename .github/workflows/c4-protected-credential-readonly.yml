name: C4 protected credential preflight - GET only
on:
  pull_request:
    paths:
      - 'scripts/c4-credential-readonly-preflight.mjs'
      - 'tests/c4-credential-readonly-preflight.test.mjs'
      - '.github/workflows/c4-protected-credential-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: |
          node --check scripts/c4-credential-readonly-preflight.mjs
          node --test tests/c4-credential-readonly-preflight.test.mjs
  protected-readonly:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'adinosassist-stack' }}
    runs-on: ubuntu-24.04
    environment: c4-quotation-staging-protected
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify exact source and protected credential via GET-only D1 metadata
        env:
          C4_STAGING_D1_CLOUDFLARE_TOKEN: ${{ secrets.C4_STAGING_D1_CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/c4-credential-readonly-preflight.mjs --protected-readonly
