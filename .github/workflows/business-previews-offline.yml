name: Business preview offline qualification
on:
  pull_request:
    paths:
      - 'server/crm-pipeline-preview.js'
      - 'server/project-job-costing-preview.js'
      - 'server/inventory-valuation-preview.js'
      - 'tests/crm-pipeline-preview.test.mjs'
      - 'tests/project-job-costing-preview.test.mjs'
      - 'tests/inventory-valuation-preview.test.mjs'
      - '.github/workflows/business-previews-offline.yml'
permissions:
  contents: read
jobs:
  preview-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate preview syntax
        run: |
          node --check server/crm-pipeline-preview.js
          node --check server/project-job-costing-preview.js
          node --check server/inventory-valuation-preview.js
      - name: Run tenant isolation and arithmetic regressions
        run: |
          node --test tests/crm-pipeline-preview.test.mjs tests/project-job-costing-preview.test.mjs tests/inventory-valuation-preview.test.mjs
