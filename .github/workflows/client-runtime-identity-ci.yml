name: Thebe Desk Client Runtime Identity CI
run-name: Client runtime identity ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify API client runtime identity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD_SHA" ]] || { echo "PR head mismatch actual=$actual expected=$EXPECTED_HEAD_SHA" >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify runtime identity and transport fallback
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/client-runtime-identity.js
          node --check cloudflare/src/agentic-entry.js
          node --check cloudflare/src/agentic-live-voice-v270.js
          node --check public/js/thebe-dock-recovery-geometry-v269.js
          node --check scripts/production-client-runtime-proof.mjs
          node tests/v270-gpt-live-migration-foundation.mjs
          node tests/v269-live-dock-geometry.mjs
          node tests/v269-emergency-dock-geometry.mjs
          node tests/v267-release-bound-assets.mjs
          node tests/v266-dock-recovery-handoff.mjs
          node tests/v82-client-runtime-identity.mjs
          node tests/v82-idempotent-transport-fallback-runtime.mjs
          node tests/unified-goal-flow-runtime.mjs

      - name: Verify unified goal flow and spatial dock geometry in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          node tests/unified-goal-flow-browser.mjs
          node tests/v246-spatial-dock-browser.mjs
          node tests/v269-emergency-dock-browser.mjs
          node tests/v272-property-navigation-browser.mjs
          node tests/v255-pricing-selector-browser.mjs
          node tests/v256-workspace-ui-defects-browser.mjs
          node tests/v257-market-ui-regression.mjs
          node tests/v258-employee-removal-browser.mjs
          node tests/v259-market-lazy-fragment-integrity.mjs
          node tests/v260-redteam-live-session-binding.mjs
