name: Protected production user token policy metadata audit
on:
  pull_request:
    paths:
      - scripts/audit-protected-user-token-policy.mjs
      - tests/audit-protected-user-token-policy.test.mjs
      - docs/protected-user-token-policy-audit.md
      - .github/workflows/protected-user-token-policy-audit.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently reviewed current main SHA
        required: true
        type: string
      confirmation:
        description: Explicit metadata-only inspection; no token changes
        required: true
        type: choice
        default: DO_NOT_RUN
        options: [DO_NOT_RUN, AUDIT_USER_TOKEN_POLICY_READONLY]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('user-token-policy-tests-{0}',github.event.pull_request.number) || 'user-token-policy-readonly' }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: |
          node --check scripts/audit-protected-user-token-policy.mjs
          node --test tests/audit-protected-user-token-policy.test.mjs
  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'AUDIT_USER_TOKEN_POLICY_READONLY'
    needs: qualify
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Inspect only verified production user token policy metadata
        env:
          PROTECTED_ENVIRONMENT_NAME: production
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ddd23cab31928a4bb3d4998df9b26d1d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/audit-protected-user-token-policy.mjs
