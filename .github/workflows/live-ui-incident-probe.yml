name: Live UI incident probe
run-name: Live UI probe ${{ github.sha }}

on:
  push:
    branches: ['recovery/ui-navigation-hotfix-20260913']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install transient browser harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/thebe-live-probe
          mkdir -p /tmp/thebe-live-probe
          cd /tmp/thebe-live-probe
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnose production guest controls
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/thebe-live-probe
          cat > probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const origin='https://thebedesk.com';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const consoleErrors=[]; const pageErrors=[]; const failed=[]; const scripts=[];
          page.on('console',msg=>{ if(msg.type()==='error') consoleErrors.push(msg.text()) });
          page.on('pageerror',err=>pageErrors.push(String(err)));
          page.on('requestfailed',req=>failed.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText||'failed'}`));
          page.on('response',res=>{ if(/event-delegation|api-client|state-store|components/.test(res.url())) scripts.push({url:res.url(),status:res.status()}) });
          const visible=async sel=>page.locator(sel).evaluate(el=>{
            const s=getComputedStyle(el); return !el.hidden&&!el.classList.contains('hidden')&&s.display!=='none'&&s.visibility!=='hidden';
          }).catch(()=>false);
          await page.goto(origin+'/',{waitUntil:'networkidle',timeout:45000});
          const start=page.getByRole('button',{name:/^Start free$/i}).first();
          assert.equal(await start.count()>0,true,'header Start free button missing');
          const before=await page.evaluate(()=>{
            const b=[...document.querySelectorAll('button')].find(x=>x.textContent?.trim()==='Start free');
            return {
              startAttr:b?.getAttribute('data-bw-onclick')||null,
              startFn:typeof window.startFreeFromMarketing,
              openAuthFn:typeof window.openAuthFromMarketing,
              delegation:!!window.BW?.events,
              startAllowed:!!window.BW?.events?.allowedActions?.includes?.('startFreeFromMarketing'),
              authGate:document.getElementById('authGate')?.className||null,
              marketingGate:document.getElementById('marketingGate')?.className||null,
              readyState:document.readyState
            };
          });
          await start.click();
          await page.waitForTimeout(500);
          const afterClick={authVisible:await visible('#authGate'),state:await page.evaluate(()=>({
            authGate:document.getElementById('authGate')?.className||null,
            marketingGate:document.getElementById('marketingGate')?.className||null,
            authMode:typeof window.authMode==='undefined'?null:window.authMode
          }))};
          let directResult=null,directError=null;
          try{directResult=await page.evaluate(()=>window.startFreeFromMarketing?.())}catch(e){directError=String(e)}
          await page.waitForTimeout(250);
          const afterDirect={authVisible:await visible('#authGate'),state:await page.evaluate(()=>({
            authGate:document.getElementById('authGate')?.className||null,
            marketingGate:document.getElementById('marketingGate')?.className||null
          }))};
          console.log('DIAGNOSTIC '+JSON.stringify({before,afterClick,directResult,directError,afterDirect,consoleErrors,pageErrors,failedRequests:failed,scripts},null,2));
          await browser.close();
          if(!afterClick.authVisible)process.exitCode=2;
          NODE
          node probe.mjs
