name: Live UI incident probe
run-name: Live UI probe ${{ github.sha }}

on:
  push:
    branches: ['recovery/ui-navigation-hotfix-20260913']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install transient browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/thebe-live-probe
          cd /tmp/thebe-live-probe
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise production as a guest user
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/thebe-live-probe
          cat > probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const origin='https://thebedesk.com';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const consoleErrors=[]; const pageErrors=[]; const failed=[];
          page.on('console',msg=>{ if(msg.type()==='error') consoleErrors.push(msg.text()) });
          page.on('pageerror',err=>pageErrors.push(String(err)));
          page.on('requestfailed',req=>failed.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText||'failed'}`));
          const visible=async sel=>page.locator(sel).evaluate(el=>{
            const s=getComputedStyle(el); return !el.hidden&&!el.classList.contains('hidden')&&s.display!=='none'&&s.visibility!=='hidden';
          }).catch(()=>false);
          await page.goto(origin+'/',{waitUntil:'networkidle',timeout:45000});
          assert.equal(await page.title().then(Boolean),true,'homepage title missing');
          const start=page.getByRole('button',{name:/^Start free$/i}).first();
          assert.equal(await start.count()>0,true,'header Start free button missing');
          await start.click();
          await page.waitForTimeout(350);
          assert.equal(await visible('#authGate'),true,'Start free did not open registration UI');
          assert.equal(await page.locator('#companyNameField').evaluate(el=>getComputedStyle(el).display!=='none').catch(()=>false),true,'registration company field did not appear');

          await page.goto(origin+'/',{waitUntil:'networkidle',timeout:45000});
          const signIn=page.getByRole('button',{name:/^Sign in$/i}).first();
          assert.equal(await signIn.count()>0,true,'Sign in button missing');
          await signIn.click();
          await page.waitForTimeout(350);
          assert.equal(await visible('#authGate'),true,'Sign in did not open auth UI');
          assert.equal(await page.locator('#companyNameField').evaluate(el=>getComputedStyle(el).display==='none').catch(()=>false),true,'login mode did not stay in login state');

          await page.goto(origin+'/',{waitUntil:'networkidle',timeout:45000});
          const trial=page.getByRole('button',{name:/Start free for 14 days/i}).first();
          assert.equal(await trial.count()>0,true,'hero trial CTA missing');
          await trial.click();
          await page.waitForTimeout(350);
          assert.equal(await visible('#authGate'),true,'hero Start free did not open registration UI');

          await page.goto(origin+'/register-direct.html',{waitUntil:'networkidle',timeout:45000});
          assert.equal(await page.locator('#registerForm').count(),1,'direct registration form missing');
          await page.locator('#submitBtn').click();
          await page.waitForTimeout(150);
          assert.match(await page.locator('#status').textContent(),/business name/i,'direct registration form handler did not run');
          const proof=await page.evaluate(async()=>{
            const r=await fetch('/api/auth/registration-proof/challenge',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
            return {status:r.status,body:await r.json().catch(()=>({}))};
          });
          assert.equal(proof.status,200,'registration proof challenge unavailable');
          assert.equal(proof.body?.provider,'thebe_proof','wrong registration proof provider');

          console.log(JSON.stringify({
            ok:true,
            consoleErrors,
            pageErrors,
            failedRequests:failed,
            proofStatus:proof.status
          },null,2));
          if(pageErrors.length)throw new Error(`Production page errors: ${pageErrors.join(' | ')}`);
          await browser.close();
          NODE
          node probe.mjs
