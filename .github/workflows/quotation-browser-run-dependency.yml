name: Quotation Browser Run Locked Dependency Qualification
on:
  pull_request:
    paths:
      - 'deploy/quotation-final-html-private/**'
      - '.github/workflows/quotation-browser-run-dependency.yml'
      - 'server/quotation-final-html-browser-run.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-browser-client:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static manifest must remain entirely private
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const text=readFileSync("deploy/quotation-final-html-private/wrangler.jsonc","utf8");
          for(const expected of [
            '"workers_dev": false','"preview_urls": false','"routes": []',
            '"browser": {"binding": "QUOTATION_BROWSER"}',
            '"compatibility_flags": ["nodejs_compat"]',
            '"compatibility_date": "2026-11-17"'
          ])if(!text.includes(expected))throw Error("quotation_browser_private_manifest_invalid");
          const worker=readFileSync("server/quotation-final-html-private-worker-entry.mjs","utf8");
          if(!worker.includes('new Response("Not Found",{status:404'))throw Error("quotation_worker_must_remain_opaque");
          NODE
      - name: Generate isolated exact-version npm lock and reproducibly install client
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/quotation-browser-client"
          cd "$RUNNER_TEMP/quotation-browser-client"
          npm init -y >/dev/null
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund '@cloudflare/playwright@1.3.0'
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const manifest=JSON.parse(readFileSync("package.json","utf8"));
          const lock=JSON.parse(readFileSync("package-lock.json","utf8"));
          const pinned=manifest.dependencies?.["@cloudflare/playwright"];
          const entry=lock.packages?.["node_modules/@cloudflare/playwright"];
          if(pinned!=="1.3.0"||entry?.version!=="1.3.0"||
             !entry.resolved?.startsWith("https://registry.npmjs.org/")||
             !entry.integrity?.startsWith("sha512-"))
            throw Error("quotation_browser_unpinned_or_unverifiable_dependency");
          const installed=JSON.parse(readFileSync("node_modules/@cloudflare/playwright/package.json","utf8"));
          if(installed.version!=="1.3.0")throw Error("quotation_browser_installed_version_mismatch");
          console.log("Exact dependency version and npm lock integrity verified; no Worker deployed");
          NODE
          sha256sum package-lock.json
          cp package-lock.json "$GITHUB_WORKSPACE/quotation-browser-run-verified-lock.json"
      - name: Retain generated lock for independent source review only
        uses: actions/upload-artifact@v4
        with:
          name: quotation-browser-run-pinned-lock-review-only
          path: quotation-browser-run-verified-lock.json
          retention-days: 14
          if-no-files-found: error
