name: Conversation staging integration acceptance
on:
  pull_request:
    paths:
      - 'cloudflare/src/conversation-*.js'
      - 'tests/conversation-*.mjs'
      - 'docs/rehearsals/conversation-storage-schema.sql'
      - '.github/workflows/conversation-staging-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversation-staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run consolidated staging security and integration tests
        run: |
          set -euo pipefail
          for test_file in tests/conversation-*.test.mjs; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
      - name: Confirm production router does not import rehearsal entry
        run: |
          set -euo pipefail
          if grep -E "conversation-staging-(authenticated-entry|route|integration)-rehearsal" cloudflare/src/production-entry.js cloudflare/src/worker.js; then
            echo "Rehearsal route was imported into a production entrypoint" >&2
            exit 1
          fi
