name: Corporate Assets v3 predeployment qualification
on:
  pull_request:
    paths:
      - 'scripts/corporate-assets-v3-predeployment-attestation.mjs'
      - 'tests/corporate-assets-v3-predeployment-attestation.test.mjs'
      - 'scripts/corporate-assets-staging-binding-preflight.mjs'
      - 'scripts/corporate-assets-v3-private-exposure-attestation.mjs'
      - 'scripts/corporate-assets-v3-worker-bundle-lineage.mjs'
      - 'tests/corporate-assets-v3-worker-bundle-lineage.test.mjs'
      - 'scripts/corporate-assets-build-input-receipt.mjs'
      - 'tests/corporate-assets-build-input-receipt.test.mjs'
      - 'scripts/corporate-assets-next-version-source-plan.mjs'
      - 'tests/corporate-assets-next-version-source-plan.test.mjs'
      - 'scripts/corporate-assets-compiled-artifact-dryrun.mjs'
      - 'tests/corporate-assets-compiled-artifact-dryrun.test.mjs'
      - 'tests/corporate-assets-v3-private-exposure-attestation.test.mjs'
      - '.github/workflows/corporate-assets-v3-predeployment-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Offline syntax and adversarial tests (no credentials)
        run: |
          node --check scripts/corporate-assets-v3-predeployment-attestation.mjs
          node --test tests/corporate-assets-v3-predeployment-attestation.test.mjs
          node --check scripts/corporate-assets-v3-private-exposure-attestation.mjs
          node --test tests/corporate-assets-v3-private-exposure-attestation.test.mjs
          node --check scripts/corporate-assets-v3-worker-bundle-lineage.mjs
          node --test tests/corporate-assets-v3-worker-bundle-lineage.test.mjs
          node --check scripts/corporate-assets-build-input-receipt.mjs
          node --test tests/corporate-assets-build-input-receipt.test.mjs
          node --check scripts/corporate-assets-next-version-source-plan.mjs
          node --test tests/corporate-assets-next-version-source-plan.test.mjs
          node --check scripts/corporate-assets-compiled-artifact-dryrun.mjs
          node --test tests/corporate-assets-compiled-artifact-dryrun.test.mjs
          node --test tests/corporate-assets-protected-secret-candidate.test.mjs

      - name: Emit checkout-bound offline build-input manifest (not a release receipt)
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: node scripts/corporate-assets-build-input-receipt.mjs

      - name: Install locked Wrangler for OFFLINE bundling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hash compiled Worker dry-run files (never upload or deploy)
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: node scripts/corporate-assets-compiled-artifact-dryrun.mjs
