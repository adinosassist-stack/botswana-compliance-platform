name: General AI private Queue protected qualification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Safe offline preflight, or separately approved private consumer deployment"
        required: true
        type: choice
        options:
          - preflight
          - deploy-private
        default: preflight
      expected_main_sha:
        description: "Exact current main commit, 40 lowercase hex characters"
        required: true
        type: string
      authorization:
        description: "For deploy only: DEPLOY_PRIVATE_GENERAL_AI_QUEUE"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: general-ai-private-queue-protected
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source is exact reviewed main
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Malformed exact SHA"; exit 1; }
          test "$GITHUB_SHA" = "$EXPECTED" || { echo "::error::Exact SHA mismatch"; exit 1; }
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED" || { echo "::error::Current main advanced"; exit 1; }
      - name: Install exact dependency lock
        run: npm ci --ignore-scripts
      - name: Review-only static safety preflight
        run: node scripts/general-ai-private-rollout-preflight.mjs
      - name: Run private Queue and durable D1 offline regressions
        run: node --test tests/general-ai-queue-acceptance.test.mjs tests/general-ai-private-queue-d1-ledger.test.mjs tests/general-ai-private-queue-d1-entry.test.mjs
      - name: Verify locked private consumer deployment config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/general-ai-private-consumer-config-preflight.mjs
      - name: Dry-run the private Worker bundle only
        run: npx wrangler deploy --dry-run --config cloudflare/wrangler.general-ai-private-consumer.toml --outdir /tmp/general-ai-private-queue
      - name: Archive deployment provenance and bundle checksum
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find /tmp/general-ai-private-queue -type f -print -quit)"
          mkdir -p general-ai-private-queue-evidence
          printf '%s\n' "$GITHUB_SHA" > general-ai-private-queue-evidence/COMMIT_SHA.txt
          printf '%s\n' "bw-general-ai-private-queue-acceptance" > general-ai-private-queue-evidence/WORKER_NAME.txt
          (cd /tmp/general-ai-private-queue && find . -type f -print0 | sort -z | xargs -0 sha256sum) > general-ai-private-queue-evidence/BUNDLE_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: general-ai-private-queue-${{ github.sha }}
          path: general-ai-private-queue-evidence/
          retention-days: 7
          if-no-files-found: error
  deploy-private:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'deploy-private' && inputs.authorization == 'DEPLOY_PRIVATE_GENERAL_AI_QUEUE'
    runs-on: ubuntu-latest
    environment: general-ai-private-staging
    timeout-minutes: 12
    steps:
      - name: Refuse outdated source after independent environment review
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected_main_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED" || exit 1
          actual="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$actual" = "$EXPECTED" || { echo "::error::Main SHA changed while waiting for approval"; exit 1; }
      - name: Validate dedicated staging credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GENERAL_AI_QUEUE_STAGING_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.GENERAL_AI_QUEUE_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Dedicated staging token missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "ddd23cab31928a4bb3d4998df9b26d1d" || { echo "::error::Wrong Cloudflare account"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Repeat all static safety and qualification checks
        run: |
          node scripts/general-ai-private-rollout-preflight.mjs
          node scripts/general-ai-private-consumer-config-preflight.mjs
          node --test tests/general-ai-queue-acceptance.test.mjs tests/general-ai-private-queue-d1-ledger.test.mjs tests/general-ai-private-queue-d1-entry.test.mjs
      - name: Publish DISABLED private Queue consumer (separate authorization required)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GENERAL_AI_QUEUE_STAGING_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.GENERAL_AI_QUEUE_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare/wrangler.general-ai-private-consumer.toml
