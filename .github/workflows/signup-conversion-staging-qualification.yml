name: Signup conversion staging preparation
on:
  pull_request:
    paths:
      - 'cloudflare/src/signup-conversion-staging-*.js'
      - 'scripts/render-signup-conversion-staging-config.mjs'
      - 'tests/signup-conversion-staging.test.mjs'
      - 'docs/signup-conversion-staging.md'
      - '.github/workflows/signup-conversion-staging-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/signup-conversion-staging.test.mjs
      - name: Compile the candidate without deployment or provider credentials
        env:
          SIGNUP_STAGING_D1_ID: '11111111-1111-4111-8111-111111111111'
          PRODUCTION_D1_DATABASE_ID: '22222222-2222-4222-8222-222222222222'
          BILLING_STAGING_D1_ID: '33333333-3333-4333-8333-333333333333'
          REGULATORY_STAGING_D1_ID: '44444444-4444-4444-8444-444444444444'
          SIGNUP_STAGING_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-signup-conversion-staging-config.mjs > "$RUNNER_TEMP/signup-staging.json"
          node ./node_modules/wrangler/bin/wrangler.js deploy --dry-run --config "$RUNNER_TEMP/signup-staging.json" --outdir "$RUNNER_TEMP/signup-staging-bundle"
