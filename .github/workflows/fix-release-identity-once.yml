name: One-shot release identity repair

on:
  push:
    branches: ['chatgpt/finance-reconciliation-20260913']
    paths: ['.github/workflows/fix-release-identity-once.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/finance-reconciliation-20260913
          persist-credentials: true
          fetch-depth: 1

      - name: Align Worker release identity and remove this one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'cloudflare/src/worker.js';
          const before = fs.readFileSync(path, 'utf8');
          const from = 'const APP_RELEASE="v79.1.0";';
          const to = 'const APP_RELEASE="v78.1.21.101";';
          const count = before.split(from).length - 1;
          if (count !== 1) throw new Error(`expected exactly one stale APP_RELEASE, found ${count}`);
          fs.writeFileSync(path, before.replace(from, to));
          NODE
          rm .github/workflows/fix-release-identity-once.yml
          git diff --check
          grep -F 'const APP_RELEASE="v78.1.21.101";' cloudflare/src/worker.js
          ! grep -F 'const APP_RELEASE="v79.1.0";' cloudflare/src/worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/worker.js .github/workflows/fix-release-identity-once.yml
          git commit -m 'fix(release): align Worker identity with 1.21.101'
          git push origin HEAD:chatgpt/finance-reconciliation-20260913
