name: AI Dock answer copy safety
on:
  pull_request:
    paths:
      - 'public/js/thebe-live-voice.js'
      - 'tests/ai-dock-copy-answer-static.test.mjs'
      - '.github/workflows/ai-dock-copy-answer.yml'
permissions:
  contents: read
jobs:
  copy-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-dock-copy-answer-static.test.mjs
