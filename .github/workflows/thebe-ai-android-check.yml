name: Thebe AI Android source and debug build
on:
  pull_request:
    paths:
      - "android/thebe-ai/**"
      - "tests/thebe-ai-android-source.test.mjs"
      - "tests/thebe-ai-android-compatibility.test.mjs"
      - "tests/thebe-ai-android-origin-trust.test.mjs"
      - "tests/thebe-ai-android-login-ui.test.mjs"
      - "tests/thebe-ai-tablet-qa-evidence.test.mjs"
      - ".github/workflows/thebe-ai-android-check.yml"
  push:
    branches:
      - main
    paths:
      - "android/thebe-ai/**"
      - "tests/thebe-ai-android-source.test.mjs"
      - "tests/thebe-ai-android-compatibility.test.mjs"
      - "tests/thebe-ai-android-origin-trust.test.mjs"
      - "tests/thebe-ai-android-login-ui.test.mjs"
      - ".github/workflows/thebe-ai-android-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build private debug APK (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - uses: android-actions/setup-android@v3
        with:
          # The action's obsolete default "tools" package fails on current SDK catalogs.
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Android wrapper and supported-OS matrix
        run: node --test tests/thebe-ai-android-source.test.mjs tests/thebe-ai-android-compatibility.test.mjs tests/thebe-ai-android-origin-trust.test.mjs tests/thebe-ai-android-login-ui.test.mjs tests/thebe-ai-tablet-qa-evidence.test.mjs
      - name: Assemble debug APK
        working-directory: android/thebe-ai
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify debug APK identity, Android signature and permissions
        run: bash android/thebe-ai/scripts/verify-debug-apk.sh
      - name: Record exact-source debug APK provenance
        shell: bash
        run: |
          set -euo pipefail
          output="android/thebe-ai/app/build/outputs/apk/debug"
          (cd "$output" && sha256sum -- *.apk > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > "$output/SOURCE_SHA"
          (cd "$output" && sha256sum -c SHA256SUMS)
      - name: Save private test artifact
        uses: actions/upload-artifact@v4
        with:
          name: thebe-ai-android-debug-not-for-release
          path: android/thebe-ai/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 7

  emulator-install-smoke:
    name: Android ${{ matrix.api_level }} emulator install / launch (no account)
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: 26
            profile: pixel_2
          - api_level: 35
            profile: pixel_7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thebe-ai-android-debug-not-for-release
          path: android/thebe-ai/app/build/outputs/apk/debug
      - name: Verify downloaded APK checksum and exact source
        shell: bash
        run: |
          set -euo pipefail
          output="android/thebe-ai/app/build/outputs/apk/debug"
          test "$(cat "$output/SOURCE_SHA")" = "$GITHUB_SHA"
          (cd "$output" && sha256sum -c SHA256SUMS)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Enable hardware acceleration on Linux runner
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Install and start Thebe AI on a test emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/thebe-ai/scripts/smoke-emulator.sh
