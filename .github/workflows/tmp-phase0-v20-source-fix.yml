name: Temporary Phase 0 v20 source repair

on:
  push:
    branches:
      - chatgpt/fix-phase0-v20-hero-contract-20261016
    paths:
      - '.github/workflows/tmp-phase0-v20-source-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: stage exact Phase 0 v20 source repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fix-phase0-v20-hero-contract-20261016
          fetch-depth: 0

      - name: Apply exact source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wrapper_path=Path('scripts/production-synthetic-full-user-wrapper.mjs')
          wrapper=wrapper_path.read_text(encoding='utf-8')
          old="""    assert(publicRoot?.status()===200,`public root returned HTTP ${publicRoot?.status()||0}`);\n    const publicState=await page.evaluate(()=>({hero:(document.querySelector('.hero h1')?.textContent||'').trim(),hasWorkspace:!!document.getElementById('appShell'),hasAuthForm:!!document.getElementById('authForm')}));\n    assert(publicState.hero==='Run your Botswana business from one place.','public root hero missing or stale');"""
          new="""    assert(publicRoot?.status()===200,`public root returned HTTP ${publicRoot?.status()||0}`);\n    await page.waitForSelector('#marketingGate[data-market-growth-v20=\"1\"]',{state:'visible',timeout:15000});\n    const publicState=await page.evaluate(()=>({hero:(document.querySelector('.hero h1')?.textContent||'').trim(),hasWorkspace:!!document.getElementById('appShell'),hasAuthForm:!!document.getElementById('authForm')}));\n    assert(publicState.hero==='Run your Botswana business with fewer surprises.','public root hero missing or stale');"""
          assert wrapper.count(old)==1, f'expected one exact stale wrapper contract, found {wrapper.count(old)}'
          wrapper_path.write_text(wrapper.replace(old,new,1),encoding='utf-8')

          test_path=Path('tests/v82-phase0-launch-audit-deferred-integrations.mjs')
          test=test_path.read_text(encoding='utf-8')
          old_hero="const currentHero='Run your Botswana business from one place.';"
          new_hero="const currentHero='Run your Botswana business with fewer surprises.';"
          assert test.count(old_hero)==1, f'expected one stale static hero contract, found {test.count(old_hero)}'
          test=test.replace(old_hero,new_hero,1)
          old_condition="""  !publicMarketing.includes('text(gate.querySelector(\".hero h1\"),')&&\n  fullUserWrapper.includes(`assert(publicState.hero==='${currentHero}','public root hero missing or stale');`),"""
          new_condition="""  !publicMarketing.includes('text(gate.querySelector(\".hero h1\"),')&&\n  fullUserWrapper.includes('await page.waitForSelector(\\'#marketingGate[data-market-growth-v20=\\\"1\\\"]\\',{state:\\'visible\\',timeout:15000});')&&\n  fullUserWrapper.includes(`assert(publicState.hero==='${currentHero}','public root hero missing or stale');`),"""
          assert test.count(old_condition)==1, f'expected one static contract condition, found {test.count(old_condition)}'
          test_path.write_text(test.replace(old_condition,new_condition,1),encoding='utf-8')
          PY

          node --check scripts/production-synthetic-full-user-wrapper.mjs
          node --check tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          git diff --check

      - name: Commit exact source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-release-bot'
          git config user.email 'thebe-release-bot@users.noreply.github.com'
          git add scripts/production-synthetic-full-user-wrapper.mjs tests/v82-phase0-launch-audit-deferred-integrations.mjs
          git commit -m 'Fix Phase 0 synthetic v20 hero contract'
          git push origin HEAD:chatgpt/fix-phase0-v20-hero-contract-20261016
