name: Temporary Phase 0 v20 source repair

on:
  push:
    branches:
      - chatgpt/fix-phase0-v20-hero-contract-20261016
    paths:
      - '.github/workflows/tmp-phase0-v20-source-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fix-phase0-v20-hero-contract-20261016
          fetch-depth: 0

      - name: Apply and verify exact source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-phase0-v20-source-fix.py
          node --check scripts/production-synthetic-full-user-wrapper.mjs
          node --check tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          git diff --check

      - name: Commit exact source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-release-bot'
          git config user.email 'thebe-release-bot@users.noreply.github.com'
          git add scripts/production-synthetic-full-user-wrapper.mjs tests/v82-phase0-launch-audit-deferred-integrations.mjs
          git commit -m 'Fix Phase 0 synthetic v20 hero contract'
          git push origin HEAD:chatgpt/fix-phase0-v20-hero-contract-20261016
