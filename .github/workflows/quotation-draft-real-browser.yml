name: Quotation Real Browser Acceptance
on:
  pull_request:
    paths:
      - 'public/js/quotation-draft-form.mjs'
      - 'public/js/quotation-draft-form-model.mjs'
      - 'public/js/quotation-draft-api-client.mjs'
      - 'tests/quotation-draft-real-browser.test.mjs'
      - '.github/workflows/quotation-draft-real-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quotation-real-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-form-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test engine in isolated runner prefix
        run: |
          mkdir -p "$RUNNER_TEMP/quotation-browser-engine"
          npm install --prefix "$RUNNER_TEMP/quotation-browser-engine" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/quotation-browser-engine/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise feature-gated quotation editor in real Chromium
        env:
          QUOTATION_BROWSER_ENGINE_ROOT: ${{ runner.temp }}/quotation-browser-engine
        run: node --test tests/quotation-draft-real-browser.test.mjs
