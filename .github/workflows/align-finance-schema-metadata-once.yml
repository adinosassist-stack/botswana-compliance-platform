name: One-shot finance schema metadata alignment

on:
  push:
    branches: ['chatgpt/finance-reconciliation-20260913']
    paths: ['.github/workflows/align-finance-schema-metadata-once.yml']

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/finance-reconciliation-20260913
          persist-credentials: true
          fetch-depth: 1

      - name: Align launch metadata and preserve historical gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function replaceExact(path,from,to,countExpected){
            const before=fs.readFileSync(path,'utf8');
            const count=before.split(from).length-1;
            if(count!==countExpected)throw new Error(`${path}: expected ${countExpected} occurrence(s), found ${count}`);
            fs.writeFileSync(path,before.split(from).join(to));
          }
          replaceExact('docs/LAUNCH.md','043_v78_session_inventory_hardening.sql','044_v79_finance_reconciliation.sql',2);
          replaceExact('docs/LAUNCH.md','No new schema migration is required.','Migration 044 is required before deploying the finance reconciliation Worker to an existing D1 database.',1);
          replaceExact('cloudflare/deploy-free.sh','043_v78_session_inventory_hardening.sql','044_v79_finance_reconciliation.sql',2);
          replaceExact('tests/v78-12158-webhook-purge-claim-hardening-adversarial.mjs','["041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql"]','["041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql","044_v79_finance_reconciliation.sql"]',1);
          replaceExact('tests/v78-12158-webhook-purge-claim-hardening-adversarial.mjs','"migration 041 is readiness floor"','"migration 041 hardening remains below or at readiness floor"',1);
          NODE
          rm .github/workflows/align-finance-schema-metadata-once.yml
          git diff --check
          grep -F '044_v79_finance_reconciliation.sql' docs/LAUNCH.md >/dev/null
          grep -F '044_v79_finance_reconciliation.sql' cloudflare/deploy-free.sh >/dev/null
          grep -F '044_v79_finance_reconciliation.sql' tests/v78-12158-webhook-purge-claim-hardening-adversarial.mjs >/dev/null
          ! grep -F 'No new schema migration is required.' docs/LAUNCH.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LAUNCH.md cloudflare/deploy-free.sh tests/v78-12158-webhook-purge-claim-hardening-adversarial.mjs .github/workflows/align-finance-schema-metadata-once.yml
          git commit -m 'chore(release): align schema 044 launch metadata'
          git push origin HEAD:chatgpt/finance-reconciliation-20260913
