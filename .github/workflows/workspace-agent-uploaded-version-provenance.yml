name: Workspace Agent uploaded-version provenance (read only)
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA; never infer from queued workflow
        type: string
        required: true
permissions: {}
concurrency:
  group: workspace-agent-version-provenance-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - name: Verify exact main and protected independent reviewer
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          reviewer="$(gh api users/thusico --jq .id)"
          envapi="repos/$GITHUB_REPOSITORY/environments/workspace-agent-private-staging"
          gh api "$envapi" | jq -e --argjson reviewer "$reviewer" '
            any(.protection_rules[]; .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | length == 1) and
              ([.reviewers[] | select(.type == "User") | .reviewer.id] == [$reviewer])) and
              .deployment_branch_policy.custom_branch_policies == true' >/dev/null
          gh api "$envapi/deployment-branch-policies" | jq -e '
            .total_count == 1 and .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"' >/dev/null
  inspect:
    needs: verify
    environment: workspace-agent-private-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
      AUDIT_TOKEN: ${{ secrets.WORKSPACE_AGENT_STAGING_READONLY_CLOUDFLARE_TOKEN }}
    steps:
      - name: Read version lineage without revealing bindings or secret values
        run: |
          set -euo pipefail
          test -n "$AUDIT_TOKEN"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          api="https://api.cloudflare.com/client/v4/accounts/b11d872b2660e76ca66323023b45b3ab/workers/scripts/bw-workspace-agent-staging"
          fetch() {
            if ! curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $AUDIT_TOKEN" "$api/$1" > "$tmp/$2" 2>/dev/null; then
              echo "::error::Version read-only API failed"; exit 1
            fi
          }
          fetch 'versions?per_page=100&page=1' versions
          fetch 'deployments' deployments
          # Reject malformed/truncated and non-unique lists. No blind ordering assumptions.
          jq -e '.success == true and (.result.items | type == "array") and
            (.result.items | length >= 2) and
            (.result_info.total_count == (.result.items | length)) and
            (.result_info.total_pages == 1) and
            ([.result.items[].id] | length == (unique | length))' "$tmp/versions" >/dev/null || {
              echo "::error::Version listing missing, incomplete, or unknown schema"; exit 1
            }
          jq -e '.success == true and (.result.deployments[0].versions |
            length == 1 and .[0].version_id == "64d9bae9-2ea3-40c1-9a26-83cea97ad71c" and
            .[0].percentage == 100)' "$tmp/deployments" >/dev/null || {
              echo "::error::Pinned deployed version changed"; exit 1
            }
          # Cloudflare may return versions in API-specific order; determine newest by timestamps,
          # require unique fully parseable created_on values and stop if ambiguous.
          jq -e '
            [.result.items[] | select((.created_on | type) == "string" and
              (.id | type) == "string")] | length == (.result.items | length)
          ' "$tmp/versions" >/dev/null || {
            echo "::error::Missing version creation timestamps"; exit 1
          }
          latest="$(jq -r '.result.items | sort_by(.created_on) | last | .id' "$tmp/versions")"
          second="$(jq -r '.result.items | sort_by(.created_on) | .[-2] | .created_on' "$tmp/versions")"
          newest="$(jq -r '.result.items | sort_by(.created_on) | last | .created_on' "$tmp/versions")"
          test "$newest" != "$second" || { echo "::error::Ambiguous latest upload"; exit 1; }
          jq -e '[.result.items[].id] | index("64d9bae9-2ea3-40c1-9a26-83cea97ad71c") != null' "$tmp/versions" >/dev/null || {
            echo "::error::Deployed pinned version absent from upload history"; exit 1
          }
          if [ "$latest" = "64d9bae9-2ea3-40c1-9a26-83cea97ad71c" ]; then
            echo "PASS latest_uploaded_equals_pinned_inert"
          else
            echo "::warning::Latest uploaded version differs from deployed inert version"
            echo "BLOCK secret_binding_inheritance_from_latest"
          fi
          # Report only lineage classification; no settings mutation, secrets, version promotion,
          # or logs/artifacts containing full Cloudflare payloads.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          echo "Read-only version lineage assessed; no Cloudflare write performed."
