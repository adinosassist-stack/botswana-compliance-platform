name: Workspace Agent secret inheritance offline gate
on:
  pull_request:
    paths:
      - 'scripts/workspace-agent-secret-inheritance-gate.mjs'
      - 'tests/workspace-agent-secret-inheritance-gate.test.mjs'
      - '.github/workflows/workspace-agent-secret-inheritance-offline.yml'
  push:
    paths:
      - 'scripts/workspace-agent-secret-inheritance-gate.mjs'
      - 'tests/workspace-agent-secret-inheritance-gate.test.mjs'
      - '.github/workflows/workspace-agent-secret-inheritance-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test secret-version provenance safety
        run: node --test tests/workspace-agent-secret-inheritance-gate.test.mjs
