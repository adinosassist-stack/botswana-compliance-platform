name: Temporary v21 proof compatibility repair

on:
  push:
    branches:
      - chatgpt/v21-production-proof-20261016
    paths:
      - '.github/workflows/tmp-v21-proof-compat-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/v21-production-proof-20261016
          fetch-depth: 0
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply and verify compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-v21-geometry-compat.py
          node --check scripts/production-synthetic-full-user-wrapper.mjs
          node --check tests/v269-live-dock-geometry.mjs
          node tests/v269-live-dock-geometry.mjs
          node tests/public-dock-width-contract.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v250-market-refinement-v21-static.mjs
          node tests/v82-client-runtime-identity.mjs
          node tests/v82-idempotent-transport-fallback-runtime.mjs
          node tests/unified-goal-flow-runtime.mjs
          git diff --check
      - name: Commit exact compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name thebe-release-bot
          git config user.email thebe-release-bot@users.noreply.github.com
          git add scripts/production-synthetic-full-user-wrapper.mjs tests/v82-phase0-launch-audit-deferred-integrations.mjs tests/v269-live-dock-geometry.mjs
          git commit -m "Align v269 proof with adjustable Gemini geometry"
          git push origin HEAD:chatgpt/v21-production-proof-20261016
