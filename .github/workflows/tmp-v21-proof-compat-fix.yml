name: Temporary v21 proof compatibility repair

on:
  push:
    branches:
      - chatgpt/v21-production-proof-20261016
    paths:
      - '.github/workflows/tmp-v21-proof-compat-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/v21-production-proof-20261016
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Harden dock geometry proof for VM harness compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/production-synthetic-full-user-wrapper.mjs')
          s=p.read_text(encoding='utf-8')
          old="document.body?.classList.contains('thebe-ai-expanded')"
          new="document.body?.classList?.contains('thebe-ai-expanded')"
          assert s.count(old)==1, f'expected one unsafe classList access, found {s.count(old)}'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/production-synthetic-full-user-wrapper.mjs
          node tests/v269-live-dock-geometry.mjs
          node tests/public-dock-width-contract.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          git diff --check
      - name: Commit compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-release-bot'
          git config user.email 'thebe-release-bot@users.noreply.github.com'
          git add scripts/production-synthetic-full-user-wrapper.mjs
          git commit -m 'Harden Phase 0 dock proof compatibility'
          git push origin HEAD:chatgpt/v21-production-proof-20261016
