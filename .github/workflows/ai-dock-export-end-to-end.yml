name: AI Dock export end-to-end contract
on:
  pull_request:
    paths:
      - 'tests/ai-dock-export-end-to-end-contract.test.mjs'
      - '.github/workflows/ai-dock-export-end-to-end.yml'
permissions:
  contents: read
jobs:
  simulated-private-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-dock-export-end-to-end-contract.test.mjs
