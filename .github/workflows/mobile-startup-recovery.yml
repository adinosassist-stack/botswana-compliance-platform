name: Mobile startup recovery CI
run-name: Mobile startup recovery ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-startup:
    name: Prove stale-preview recovery boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify mobile startup/cache recovery contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/mobile-startup-cache-recovery-adversarial.mjs
          node --check public/js/recover-runtime.js
