name: Password Recovery PR Gate

on:
  pull_request:
    paths:
      - 'cloudflare/src/worker.js'
      - 'tests/v78-12162-password-reset-email-runtime.mjs'
      - 'tests/v78-12162-password-reset-email-delivery-adversarial.mjs'
      - 'scripts/production-password-recovery-smoke.mjs'
      - '.github/workflows/client-runtime-postdeploy.yml'
      - '.github/workflows/password-recovery-pr.yml'

permissions:
  contents: read

jobs:
  recovery:
    name: Validate recovery link and production smoke contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Validate recovery implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/worker.js
          node --check scripts/production-password-recovery-smoke.mjs
          node --no-warnings tests/v78-12162-password-reset-email-runtime.mjs
          node tests/v78-12162-password-reset-email-delivery-adversarial.mjs
          grep -Fq 'new URL("/reset-password.html",publicApp)' cloudflare/src/worker.js
          grep -Fq '/reset-password.html#reset_token=' tests/v78-12162-password-reset-email-runtime.mjs

      - name: Validate post-deploy secret boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/client-runtime-postdeploy.yml').read_text()
          smoke=Path('scripts/production-password-recovery-smoke.mjs').read_text()
          required=[
              'environment: production',
              'RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}',
              'AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}',
              'node scripts/production-password-recovery-smoke.mjs',
          ]
          missing=[item for item in required if item not in workflow]
          if missing:
              raise SystemExit('missing post-deploy recovery controls: '+', '.join(missing))
          forbidden=['console.log(resetToken','console.log(newPassword','console.log(initialPassword','console.log(content)']
          hits=[item for item in forbidden if item in smoke]
          if hits:
              raise SystemExit('sensitive recovery data logging detected: '+', '.join(hits))
          if "TEST_EMAIL='delivered@resend.dev'" not in smoke:
              raise SystemExit('recovery smoke must use the Resend delivered-test address')
          if 'refusing collision' not in smoke:
              raise SystemExit('recovery smoke must fail closed on test-address collision')
          PY
