name: Independent review regressions
run-name: Independent review regressions ${{ github.event.pull_request.head.sha }}

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: independent-review-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-regressions:
    name: Reviewer regression entry points
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD_SHA" ]] || { echo "head mismatch expected=$EXPECTED_HEAD_SHA actual=$actual" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Subscription audit rollback and POP isolation
        shell: bash
        run: node --test tests/owner-payment-dashboard.test.mjs tests/platform-billing-controls.test.mjs tests/subscription-access-audit-d1.test.mjs tests/manual-bank-owner-approval-flow.test.mjs tests/manual-bank-review-audit-d1.test.mjs tests/payment-pop-*.test.mjs tests/pop-intake-metadata-contract.test.mjs tests/pop-whatsapp-*.test.mjs

      - name: Password recovery source-contract regression
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/password-reset-browser-flow.mjs
          node tests/password-reset-browser-flow.mjs

      - name: Password reset session invalidation qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v328-password-reset-session-invalidation.mjs
          node tests/v328-password-reset-session-invalidation.mjs

      - name: Saved finance lifecycle qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v329-saved-finance-lifecycle.mjs
          node tests/v329-saved-finance-lifecycle.mjs

      - name: AI advisor bounded-context truthfulness
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/ai-advisor-context-compaction.js
          node --check tests/v329-ai-advisor-context-compaction.mjs
          node tests/v329-ai-advisor-context-compaction.mjs

      - name: Report money and FNB surface qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/daily-report-money-v331.js
          node --check public/js/reporter-money-v331.js
          node --check tests/v331-report-money-fnb-surface.mjs
          node tests/v331-report-money-fnb-surface.mjs

      - name: Report evidence and reconciliation qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/report-evidence-governance-entry-v332.js
          node --check public/js/reporter-evidence-v332.js
          node --check tests/v332-report-evidence-reconciliation.mjs
          node tests/v332-report-evidence-reconciliation.mjs

      - name: Property valuation reliability regression
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v177-property-valuation-service-reliability.mjs
          node tests/v177-property-valuation-service-reliability.mjs

      - name: Operational and agentic source availability regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/business-context.js
          node --check cloudflare/src/agentic-core.js
          node --check tests/v324-business-context-source-availability.mjs
          node --check tests/v325-agentic-source-availability.mjs
          node tests/v324-business-context-source-availability.mjs
          node tests/v325-agentic-source-availability.mjs

      - name: Cross-tenant employee evidence reporting and AI isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v326-cross-tenant-runtime-isolation.mjs
          node tests/v326-cross-tenant-runtime-isolation.mjs

      - name: Privileged workspace role isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v327-privileged-role-runtime-isolation.mjs
          node tests/v327-privileged-role-runtime-isolation.mjs

      - name: Owner priority recovery regression
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-focus-strip-v296.js
          node tests/v303-owner-focus-priority-context.mjs
          node tests/v323-owner-focus-recovery.mjs

      - name: Constrained workspace and preview UI contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v322-reviewer-ui-contract.mjs
          node tests/v322-reviewer-ui-contract.mjs

      - name: Copilot credit wallet runtime hydration
        shell: bash
        run: node tests/v333-copilot-credit-wallet-runtime.mjs

      - name: Owner priority Worker routing and authority boundaries
        shell: bash
        run: node --no-warnings tests/v334-owner-priority-worker-routing.mjs

      - name: Regulatory reviewer provisioning governance
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/provision-regulatory-reviewer.mjs
          node --check tests/regulatory-reviewer-provisioning-static.mjs
          node tests/regulatory-reviewer-provisioning-static.mjs

      - name: Staging OAuth bootstrap syntax and safety
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/regulatory-staging-oauth-bootstrap.sh
          node --test tests/regulatory-staging-oauth-bootstrap-static.test.mjs

      - name: Platform billing controls and approval loading
        shell: bash
        run: node --test tests/platform-billing-controls.test.mjs tests/owner-payment-dashboard.test.mjs tests/platform-billing-analytics.test.mjs tests/owner-dashboard-audit.test.mjs tests/manual-bank-owner-approval-flow.test.mjs

      - name: Install pinned isolated browser test driver
        shell: bash
        run: |
          set -euo pipefail
          driver_dir="${RUNNER_TEMP}/thebe-review-playwright"
          mkdir -p "$driver_dir"
          npm install --prefix "$driver_dir" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          mkdir -p node_modules
          if [ ! -e node_modules/playwright-core ]; then
            ln -s "$driver_dir/node_modules/playwright-core" node_modules/playwright-core
          fi

      - name: Owner dashboard desktop and mobile browser audit
        shell: bash
        env:
          OWNER_DASHBOARD_ARTIFACT_DIR: ${{ runner.temp }}/owner-dashboard-audit
        run: node scripts/owner-dashboard-audit-browser.mjs

      - name: Upload synthetic owner dashboard screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-dashboard-audit-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/owner-dashboard-audit/*.png
          if-no-files-found: warn
