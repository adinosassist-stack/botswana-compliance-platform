name: Independent review regressions
run-name: Independent review regressions ${{ github.event.pull_request.head.sha }}

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: independent-review-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-regressions:
    name: Reviewer regression entry points
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD_SHA" ]] || { echo "head mismatch expected=$EXPECTED_HEAD_SHA actual=$actual" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Password recovery source-contract regression
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/password-reset-browser-flow.mjs
          node tests/password-reset-browser-flow.mjs

      - name: Password reset session invalidation qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v328-password-reset-session-invalidation.mjs
          node tests/v328-password-reset-session-invalidation.mjs

      - name: Saved finance lifecycle qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v329-saved-finance-lifecycle.mjs
          node tests/v329-saved-finance-lifecycle.mjs

      - name: AI advisor bounded-context truthfulness
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/ai-advisor-context-compaction.js
          node --check tests/v329-ai-advisor-context-compaction.mjs
          node tests/v329-ai-advisor-context-compaction.mjs

      - name: Report money and FNB surface qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/daily-report-money-v331.js
          node --check public/js/reporter-money-v331.js
          node --check tests/v331-report-money-fnb-surface.mjs
          node tests/v331-report-money-fnb-surface.mjs

      - name: Report evidence and reconciliation qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/report-evidence-governance-entry-v332.js
          node --check public/js/reporter-evidence-v332.js
          node --check tests/v332-report-evidence-reconciliation.mjs
          node tests/v332-report-evidence-reconciliation.mjs

      - name: Property valuation reliability regression
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v177-property-valuation-service-reliability.mjs
          node tests/v177-property-valuation-service-reliability.mjs

      - name: Operational and agentic source availability regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/business-context.js
          node --check cloudflare/src/agentic-core.js
          node --check tests/v324-business-context-source-availability.mjs
          node --check tests/v325-agentic-source-availability.mjs
          node tests/v324-business-context-source-availability.mjs
          node tests/v325-agentic-source-availability.mjs

      - name: Cross-tenant employee evidence reporting and AI isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v326-cross-tenant-runtime-isolation.mjs
          node tests/v326-cross-tenant-runtime-isolation.mjs

      - name: Privileged workspace role isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v327-privileged-role-runtime-isolation.mjs
          node tests/v327-privileged-role-runtime-isolation.mjs

      - name: Owner priority recovery regression
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-focus-strip-v296.js
          node tests/v303-owner-focus-priority-context.mjs
          node tests/v323-owner-focus-recovery.mjs

      - name: Constrained workspace and preview UI contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/v322-reviewer-ui-contract.mjs
          node tests/v322-reviewer-ui-contract.mjs

      - name: Copilot credit wallet runtime hydration
        shell: bash
        run: node tests/v333-copilot-credit-wallet-runtime.mjs

      - name: Owner priority Worker routing and authority boundaries
        shell: bash
        run: node --no-warnings tests/v334-owner-priority-worker-routing.mjs

      - name: Owner evidence quality scoring boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-evidence-quality-scoring-v339.js
          node --check tests/owner-evidence-quality-scoring-static.mjs
          node tests/owner-evidence-quality-scoring-static.mjs

      - name: Owner evidence conflict detection boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-evidence-conflict-detection-v340.js
          node --check tests/owner-evidence-conflict-detection-static.mjs
          node tests/owner-evidence-conflict-detection-static.mjs

      - name: Owner evidence resolution plan boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-evidence-resolution-plan-v341.js
          node --check tests/owner-evidence-resolution-plan-static.mjs
          node tests/owner-evidence-resolution-plan-static.mjs

      - name: Owner decision evidence readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-decision-evidence-readiness-v342.js
          node --check tests/owner-decision-evidence-readiness-static.mjs
          node tests/owner-decision-evidence-readiness-static.mjs

      - name: Owner decision review brief boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-decision-review-brief-v343.js
          node --check tests/owner-decision-review-brief-static.mjs
          node tests/owner-decision-review-brief-static.mjs

      - name: Owner decision review delta boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-decision-review-delta-v344.js
          node --check tests/owner-decision-review-delta-static.mjs
          node tests/owner-decision-review-delta-static.mjs

      - name: Owner decision reconsideration trigger boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-decision-reconsideration-trigger-v345.js
          node --check tests/owner-decision-reconsideration-trigger-static.mjs
          node tests/owner-decision-reconsideration-trigger-static.mjs

      - name: Owner decision change impact check boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-decision-change-impact-check-v346.js
          node --check tests/owner-decision-change-impact-check-static.mjs
          node tests/owner-decision-change-impact-check-static.mjs

      - name: Owner decision transition plan boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-decision-transition-plan-v347.js
          node --check tests/owner-decision-transition-plan-static.mjs
          node tests/owner-decision-transition-plan-static.mjs

      - name: Owner transition stage readiness gate boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-transition-stage-readiness-gate-v348.js
          node --check tests/owner-transition-stage-readiness-gate-static.mjs
          node tests/owner-transition-stage-readiness-gate-static.mjs

      - name: Owner transition stage outcome checkpoint boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-transition-stage-outcome-checkpoint-v349.js
          node --check tests/owner-transition-stage-outcome-checkpoint-static.mjs
          node tests/owner-transition-stage-outcome-checkpoint-static.mjs

      - name: Owner transition completion evidence review boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-transition-completion-evidence-review-v350.js
          node --check tests/owner-transition-completion-evidence-review-static.mjs
          node tests/owner-transition-completion-evidence-review-static.mjs

      - name: Owner transition outcome success review boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-transition-outcome-success-review-v351.js
          node --check tests/owner-transition-outcome-success-review-static.mjs
          node tests/owner-transition-outcome-success-review-static.mjs

      - name: Owner decision closure readiness review boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-decision-closure-readiness-review-v352.js
          node --check tests/owner-decision-closure-readiness-review-static.mjs
          node tests/owner-decision-closure-readiness-review-static.mjs

      - name: Regulatory reviewer provisioning governance
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/provision-regulatory-reviewer.mjs
          node --check tests/regulatory-reviewer-provisioning-static.mjs
          node tests/regulatory-reviewer-provisioning-static.mjs
