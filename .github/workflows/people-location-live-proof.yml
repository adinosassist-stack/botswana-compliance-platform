name: People Location Live Proof

on:
  push:
    branches:
      - chatgpt/people-location-live-proof-20261013

permissions:
  contents: read

jobs:
  prove-location-flow:
    name: Prove People Add location on live production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies and browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Run live full-user People/location proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-synthetic-full-user-wrapper.mjs
