name: AI export renderer qualification
on:
  pull_request:
    paths:
      - 'server/ai-document-renderer.js'
      - 'server/ai-document-export-model.js'
      - 'tests/ai-document-renderer.test.mjs'
      - '.github/workflows/ai-export-renderer-qualification.yml'
permissions:
  contents: read
jobs:
  render-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install candidate renderer dependencies without committing lockfile
        run: npm install --no-save --ignore-scripts --no-audit --no-fund docx pptxgenjs pdf-lib
      - name: Verify renderer behavior and actual file signatures
        run: node --test tests/ai-document-renderer.test.mjs
