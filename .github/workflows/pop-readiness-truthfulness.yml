name: Consolidated POP readiness truthfulness
on:
  pull_request:
    paths:
      - 'cloudflare/src/pop-schema-readiness.js'
      - 'cloudflare/src/agentic-entry.js'
      - 'tests/pop-schema-readiness.test.mjs'
      - 'docs/launch-pop-readiness-qualification-20261102.md'
      - '.github/workflows/pop-readiness-truthfulness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check runtime syntax
        run: node --check cloudflare/src/pop-schema-readiness.js && node --check cloudflare/src/agentic-entry.js
      - name: Test live-catalog fail-closed semantics without provider credentials
        run: node --test tests/pop-schema-readiness.test.mjs tests/v78-12146-launch-readiness-runtime.mjs tests/v78-12147-launch-readiness-runtime.mjs
      - name: Truthful scope evidence
        run: |
          echo 'POP readiness is catalog-only, not migration provenance or authorization.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No staging/prod data writes, secrets, payment activation or Worker deployment.' >> "$GITHUB_STEP_SUMMARY"
