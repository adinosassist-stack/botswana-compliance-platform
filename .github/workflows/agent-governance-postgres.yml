name: Agent Governance PostgreSQL Integration
on:
  pull_request:
    paths:
      - "db/migrations/20261015_agent_action_governance.sql"
      - "db/migrations/20261016_agent_governance_integrity.sql"
      - "db/migrations/20261017_agent_action_outbox.sql"
      - "db/migrations/20261018_agent_outbox_draft_guard.sql"
      - "db/migrations/20261019_agent_outbox_lease_integrity.sql"
      - "tests/agent-postgres-integration.test.mjs"
      - "tests/agent-approval-history-postgres-integration.test.mjs"
      - "tests/agent-history-rate-limit-postgres-integration.test.mjs"
      - "tests/agent-private-host-postgres-integration.test.mjs"
      - "tests/agent-private-host-authorized-postgres.test.mjs"
      - "tests/agent-private-route-production-inert.test.mjs"
      - "tests/agent-canonical-auth-postgres-http.test.mjs"
      - "server/sql/agent-history-rate-limits.sql"
      - "server/agent-*.js"
      - ".github/workflows/agent-governance-postgres.yml"
  workflow_dispatch:
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_test_only
          POSTGRES_DB: governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d governance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agent:agent_test_only@localhost:5432/governance
      AGENT_HISTORY_TEST_DATABASE_URL: postgresql://agent:agent_test_only@localhost:5432/governance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Apply agent governance migrations
        run: |
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261015_agent_action_governance.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261016_agent_governance_integrity.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261017_agent_action_outbox.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261018_agent_outbox_draft_guard.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261019_agent_outbox_lease_integrity.sql
      - name: Apply isolated Agent rate-limit schema
        run: PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f server/sql/agent-history-rate-limits.sql
      - name: Verify governance migrations are idempotent
        run: |
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261015_agent_action_governance.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261016_agent_governance_integrity.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261017_agent_action_outbox.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261018_agent_outbox_draft_guard.sql
          PGPASSWORD=agent_test_only psql -h localhost -U agent -d governance -v ON_ERROR_STOP=1 -f db/migrations/20261019_agent_outbox_lease_integrity.sql
      - name: Run canonical authentication HTTP test independently
        run: timeout --signal=TERM --kill-after=10s 90s node --test --test-reporter=spec tests/agent-canonical-auth-postgres-http.test.mjs
      - name: Run real PostgreSQL tests
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test --test-reporter=spec tests/agent-postgres-integration.test.mjs tests/agent-approval-history-postgres-integration.test.mjs tests/agent-history-rate-limit-postgres-integration.test.mjs tests/agent-private-host-postgres-integration.test.mjs tests/agent-private-host-authorized-postgres.test.mjs tests/agent-private-route-production-inert.test.mjs tests/agent-canonical-auth-postgres-http.test.mjs
