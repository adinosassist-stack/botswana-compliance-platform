name: Owner bank allocation isolated D1 qualification
on:
  pull_request:
    paths:
      - 'server/payments/owner-bank-allocation-contract.mjs'
      - 'server/payments/d1-bank-allocation-adapter-reference.mjs'
      - 'server/payments/bank-allocation-input-validation.mjs'
      - 'server/payments/owner-payment-evidence-policy.mjs'
      - 'tests/owner-bank-allocation-real-d1.test.mjs'
      - 'tests/owner-bank-d1-staging-fixture.test.mjs'
      - 'tests/d1-bank-allocation-adapter-reference.test.mjs'
      - 'tests/owner-bank-allocation-contract.test.mjs'
      - 'tests/owner-payment-evidence-policy.test.mjs'
      - 'docs/owner-payment-release-qualification.md'
      - '.github/workflows/owner-bank-allocation-d1-qualification.yml'
permissions:
  contents: read
jobs:
  offline-local-d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository lockfile dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate reference adapter and tests
        run: |
          node --check server/payments/d1-bank-allocation-adapter-reference.mjs
          node --check server/payments/owner-bank-allocation-contract.mjs
          node --check tests/owner-bank-allocation-real-d1.test.mjs
      - name: Run isolated D1 and owner payment evidence regressions
        run: |
          node --test \
            tests/owner-bank-allocation-real-d1.test.mjs \
            tests/owner-bank-d1-staging-fixture.test.mjs \
            tests/d1-bank-allocation-adapter-reference.test.mjs \
            tests/owner-bank-allocation-contract.test.mjs \
            tests/owner-payment-evidence-policy.test.mjs
