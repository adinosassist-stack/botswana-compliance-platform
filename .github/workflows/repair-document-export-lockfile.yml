name: Repair document export lockfile
on:
  push:
    branches:
      - feature/ai-document-export-contract-20261023
    paths:
      - '.github/workflows/repair-document-export-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'adinosassist-stack/botswana-compliance-platform' && github.ref == 'refs/heads/feature/ai-document-export-contract-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/ai-document-export-contract-20261023
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Regenerate and validate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/ai-document-renderer.test.mjs
      - name: Commit lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'fix: synchronize document export dependency lockfile'
          git push origin HEAD:feature/ai-document-export-contract-20261023
