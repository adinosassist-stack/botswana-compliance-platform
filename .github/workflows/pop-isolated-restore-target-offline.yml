name: POP distinct restore target offline qualification
on:
  pull_request:
    paths:
      - scripts/qualify-pop-isolated-restore-target-offline.mjs
      - tests/pop-isolated-restore-target-offline.test.mjs
      - docs/proposals/POP_DISTINCT_RESTORE_TARGET_HANDOFF_20261103.md
      - .github/workflows/pop-isolated-restore-target-offline.yml
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify fail-closed restore target admission
        run: |
          node --check scripts/qualify-pop-isolated-restore-target-offline.mjs
          node --test tests/pop-isolated-restore-target-offline.test.mjs
      - name: Verify no remote execution
        run: echo 'Offline regression only; no Cloudflare secrets, D1 creation, backup download, restore/import, or production write.' >> "$GITHUB_STEP_SUMMARY"
