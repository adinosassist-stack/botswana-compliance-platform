name: Thebe Desk Recovery CI
run-name: Recovery CI ${{ github.sha }}

on:
  push:
    branches: [main, 'recovery/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: V81 recovery qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify pinned npm
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "String(require('./package.json').packageManager).replace(/^npm@/,'')")"
          actual="$(npm --version)"
          [[ "$actual" == "$expected" ]] || { echo "npm mismatch expected=$expected actual=$actual" >&2; exit 1; }

      - name: Clean install from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: V81 recovery boundary
        run: npm run test:recovery-v81-sites

      - name: Finance, WhatsApp and agentic qualification
        shell: bash
        run: |
          set -euo pipefail
          node tests/v79-finance-reconciliation.mjs
          node tests/v79-whatsapp-finance-connection.mjs
          node tests/v81-finance-connections.mjs
          node tests/v80-agentic-foundation.mjs
          node tests/v80-agentic-runtime.mjs
          node tests/v80-agentic-owner-centre.mjs
          node tests/v80-agentic-stage2.mjs
          node tests/v80-agentic-stage2-runtime.mjs
          node tests/v81-delegated-authority-static.mjs
          node tests/v82-whatsapp-prepare.mjs
          node tests/v82-whatsapp-owner-centre.mjs

      - name: Production and historical regression qualification
        shell: bash
        run: |
          set -euo pipefail
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v82-postdeploy-smoke-governance.mjs
          node tests/v82-node-postgres-lineage-hardening.mjs
          npm run check
          npm run lint:production
          npm run test:production-hardening
          npm run test:feature-hardening
          npm run test:static
          npm run test:release-regressions
          npm run check:dependency-policy
          npm run check:bundle-budget
          npm run check:d1-backup-shape
          npm run check:d1-backup-restore
          npm run check:d1-recovery-drill
          npm run check:artifact-boundary
          npm run check:supply-chain

      - name: Genuine production dependency audit
        run: npm audit --omit=dev --audit-level=high

  node-postgres:
    name: Node/Postgres migration and API lifecycle
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: thebe_node_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d thebe_node_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: 'true'
      APP_ENV: test
      PORT: '3100'
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/thebe_node_ci
      PUBLIC_ORIGIN: http://127.0.0.1:3100
      PUBLIC_APP_URL: http://127.0.0.1:3100
      TRUST_PROXY_HOPS: '0'
      TEST_BASE_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "String(require('./package.json').packageManager).replace(/^npm@/,'')")"
          actual="$(npm --version)"
          [[ "$actual" == "$expected" ]] || { echo "npm mismatch expected=$expected actual=$actual" >&2; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply full Postgres migration chain
        shell: bash
        run: |
          set -euo pipefail
          npm run migrate

      - name: Prove lineage and workspace-version migration runtime
        shell: bash
        run: |
          set -euo pipefail
          node tests/v82-node-postgres-lineage-runtime.mjs

      - name: Exercise hardened Node API lifecycle
        shell: bash
        run: |
          set -euo pipefail
          export SESSION_SECRET="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          node server/server.js >/tmp/thebe-node-ci-server.log 2>&1 &
          server_pid=$!
          cleanup(){ kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/live >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then cat /tmp/thebe-node-ci-server.log >&2 || true; exit 1; fi
          npm run test:api || { cat /tmp/thebe-node-ci-server.log >&2 || true; exit 1; }
