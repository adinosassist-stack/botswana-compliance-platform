name: AI private object provider qualification
on:
  pull_request:
    paths:
      - 'server/ai-export-private-object-provider.js'
      - 'tests/ai-export-private-object-provider.test.mjs'
      - '.github/workflows/ai-export-private-object-provider.yml'
permissions:
  contents: read
jobs:
  private-object-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-export-private-object-provider.test.mjs
