name: Regulatory Maker Import CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/regulatory-maker-import.yml'
      - '.github/workflows/regulatory-maker-import-ci.yml'
      - 'tests/regulatory-maker-import-workflow-static.mjs'
  push:
    branches:
      - 'chatgpt/regulatory-maker-import-workflow'
    paths:
      - '.github/workflows/regulatory-maker-import.yml'
      - '.github/workflows/regulatory-maker-import-ci.yml'
      - 'tests/regulatory-maker-import-workflow-static.mjs'

permissions:
  contents: read

jobs:
  static-contract:
    name: Governed maker import contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Enforce maker import safety contract
        run: node tests/regulatory-maker-import-workflow-static.mjs
