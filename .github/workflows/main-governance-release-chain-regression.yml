name: Main Governance Release-Chain Regression
run-name: Main governance release-chain regression ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/main-governance-guard.yml'
      - '.github/workflows/bf07-seal.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/main-governance-release-chain-regression.yml'
      - 'scripts/main-governance-release-chain-regression.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-governance-guard.yml'
      - '.github/workflows/bf07-seal.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/main-governance-release-chain-regression.yml'
      - 'scripts/main-governance-release-chain-regression.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-release-chain:
    name: Adversarial exact-SHA release-chain regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Exercise stale-SHA and authority bypass cases
        shell: bash
        run: |
          set -euo pipefail
          node scripts/main-governance-release-chain-regression.mjs