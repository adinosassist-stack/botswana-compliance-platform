name: Thebe Desk Legacy Orphan Qualification
run-name: Legacy orphan qualification ${{ github.sha }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: quality zero-orphan clean safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify cleanup scripts parse
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/production-legacy-orphan-cleanup.mjs
          node --check scripts/production-zero-orphan-audit.mjs

      - name: Verify cleanup and zero-baseline contract
        run: node tests/v82-legacy-orphan-cleanup-contract.mjs

  compatibility-context:
    name: quality zero-orphan cleanup safety
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Preserve prior required-check context
        run: echo 'Canonical zero-orphan qualification passed under quality zero-orphan clean safety.'
