name: Workspace Agent retirement execution readiness offline contracts
on:
  pull_request:
    paths:
      - 'scripts/workspace-agent-stranded-retirement-owner-acceptance.mjs'
      - 'scripts/workspace-agent-stranded-retirement-postcheck.mjs'
      - 'tests/workspace-agent-stranded-retirement-owner-acceptance.test.mjs'
      - 'tests/workspace-agent-stranded-retirement-postcheck.test.mjs'
      - '.github/workflows/workspace-agent-retirement-execution-readiness.yml'
      - '.github/workflows/workspace-agent-retirement-execution-offline.yml'
  push:
    paths:
      - 'scripts/workspace-agent-stranded-retirement-owner-acceptance.mjs'
      - 'scripts/workspace-agent-stranded-retirement-postcheck.mjs'
      - 'tests/workspace-agent-stranded-retirement-owner-acceptance.test.mjs'
      - 'tests/workspace-agent-stranded-retirement-postcheck.test.mjs'
      - '.github/workflows/workspace-agent-retirement-execution-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-bound owner statement and fail-closed postconditions
        run: |
          set -euo pipefail
          node --test tests/workspace-agent-stranded-retirement-owner-acceptance.test.mjs tests/workspace-agent-stranded-retirement-postcheck.test.mjs
