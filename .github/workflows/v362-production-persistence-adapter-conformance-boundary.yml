name: V362 production-persistence-adapter-conformance boundary
run-name: V362 production-persistence-adapter-conformance boundary ${{ github.event.pull_request.head.sha }}

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v362-production-persistence-adapter-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v362-boundary:
    name: Owner closure record production persistence adapter conformance boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD_SHA" ]] || { echo "head mismatch expected=$EXPECTED_HEAD_SHA actual=$actual" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Production persistence primitive conformance
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/owner-closure-record-production-persistence-adapter-conformance-v362.mjs
          node --check tests/owner-closure-record-production-persistence-adapter-static-v362.mjs
          node tests/owner-closure-record-production-persistence-adapter-conformance-v362.mjs
          node tests/owner-closure-record-production-persistence-adapter-static-v362.mjs

      - name: Existing CAS replay and rollback executable proofs
        shell: bash
        run: |
          set -euo pipefail
          node tests/v82-finance-connection-transition-cas.mjs
          node tests/v82-finance-idempotency-replay-integrity.mjs
          node tests/v145-finance-finalization-rollback-runtime.mjs
