name: People UX CI
run-name: People UX ${{ github.sha }}

on:
  pull_request:
    paths:
      - 'public/assets/people-ux-audit-20261015.css'
      - 'public/js/people-directory-ux-20261015.js'
      - 'public/assets/people-infographics-20261003.css'
      - 'cloudflare/src/asset-release-identity.js'
      - 'tests/people-ux-audit-20261015.mjs'
      - '.github/workflows/people-ux-ci.yml'
  push:
    branches: [main]
    paths:
      - 'public/assets/people-ux-audit-20261015.css'
      - 'public/js/people-directory-ux-20261015.js'
      - 'public/assets/people-infographics-20261003.css'
      - 'cloudflare/src/asset-release-identity.js'
      - 'tests/people-ux-audit-20261015.mjs'
      - '.github/workflows/people-ux-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  people-ux:
    name: People workspace regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enforce People workspace UX contract
        run: node tests/people-ux-audit-20261015.mjs
