name: POP 071 production D1 read-only inspection
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact qualified current main SHA
        required: true
        type: string
      source_sha256:
        description: SHA-256 of reviewed migration 071
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: thebe-desk-production
      cancel-in-progress: false
    steps:
      - name: Checkout exact immutable main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Inspect production D1 schema without mutation
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_sha }}
          EXPECTED_SOURCE_SHA256: ${{ inputs.source_sha256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/inspect-production-pop-071.mjs
