name: Production live core-only binding gate
on:
  pull_request:
    paths:
      - scripts/verify-live-core-only-bindings.mjs
      - tests/verify-live-core-only-bindings.test.mjs
      - .github/workflows/deploy-production.yml
      - .github/workflows/production-live-core-bindings-ci.yml
permissions:
  contents: read
jobs:
  offline:
    name: Production live binding gate offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check read-only fail-closed contract
        run: node --test tests/verify-live-core-only-bindings.test.mjs
