name: Probe governed agentic Stage 1 live once

on:
  push:
    branches:
      - probe/agentic-stage1-live-20260913

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify production edge and public journeys
        shell: bash
        run: |
          set -euo pipefail
          fetch(){
            local url="$1" outfile="$2"
            curl --silent --show-error --fail-with-body --retry 5 --retry-all-errors --max-time 20 "$url" -o "$outfile"
          }

          ready="$(mktemp)"; fetch 'https://thebedesk.com/api/ready' "$ready"
          READY_FILE="$ready" node <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync(process.env.READY_FILE,'utf8'));
          if(body.ok!==true||body.schemaReady!==true||body.requiredConfigReady!==true) throw new Error('production readiness contract failed');
          if(body.expectedSchemaDelta!=='045_v80_agentic_foundation.sql') throw new Error(`unexpected schema ${body.expectedSchemaDelta}`);
          if(body.version!=='v78.1.21.101') throw new Error(`unexpected version ${body.version}`);
          console.log(`READY PASS version=${body.version} schema=${body.expectedSchemaDelta}`);
          NODE

          status_body="$(mktemp)"
          status_code="$(curl --silent --show-error --max-time 20 -o "$status_body" -w '%{http_code}' 'https://thebedesk.com/api/agentic/status')"
          [[ "$status_code" == "401" ]] || { echo "agentic status anonymous expected 401 got $status_code" >&2; cat "$status_body" >&2; exit 1; }
          STATUS_FILE="$status_body" node <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync(process.env.STATUS_FILE,'utf8'));
          if(body.error!=='unauthenticated') throw new Error(`unexpected anonymous agentic body ${JSON.stringify(body)}`);
          console.log('AGENTIC ANONYMOUS FAIL-CLOSED PASS');
          NODE

          execute_body="$(mktemp)"
          execute_code="$(curl --silent --show-error --max-time 20 -o "$execute_body" -w '%{http_code}' 'https://thebedesk.com/api/agentic/execute')"
          [[ "$execute_code" == "401" ]] || { echo "agentic execute boundary expected unauthenticated 401 got $execute_code" >&2; cat "$execute_body" >&2; exit 1; }
          EXECUTE_FILE="$execute_body" node <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync(process.env.EXECUTE_FILE,'utf8'));
          if(body.error!=='unauthenticated') throw new Error(`unexpected execute boundary body ${JSON.stringify(body)}`);
          console.log('AGENTIC EXECUTE BOUNDARY FAIL-CLOSED PASS');
          NODE

          register="$(mktemp)"; fetch 'https://thebedesk.com/register-direct.html' "$register"
          grep -Eqi 'Thebe|register|account|workspace' "$register" || { echo 'registration page did not contain expected app content' >&2; exit 1; }
          echo 'REGISTRATION PAGE PASS'

          home="$(mktemp)"; fetch 'https://thebedesk.com/' "$home"
          grep -Eqi 'Thebe|workspace|business|sign in|dashboard' "$home" || { echo 'home/workspace page did not contain expected app content' >&2; exit 1; }
          echo 'HOME/WORKSPACE ENTRY PASS'

          rm -f "$ready" "$status_body" "$execute_body" "$register" "$home"
          echo 'LIVE AGENTIC STAGE 1 PROBE PASS'
