name: Namibia compliance candidate checks
on:
  pull_request:
    paths:
      - 'cloudflare/src/namibia-compliance-candidate.js'
      - 'cloudflare/src/namibia-compliance-workflows.js'
      - 'cloudflare/src/namibia-compliance-candidate-store.js'
      - 'cloudflare/src/namibia-internal-api-candidate.js'
      - 'cloudflare/src/namibia-isolation-preflight.js'
      - 'cloudflare/src/namibia-d1-inventory-audit.js'
      - 'cloudflare/src/namibia-worker-binding-audit.js'
      - 'cloudflare/src/namibia-source-review-candidate.js'
      - 'cloudflare/src/namibia-rule-review-ledger.js'
      - 'cloudflare/src/namibia-source-evidence-candidate.js'
      - 'cloudflare/src/namibia-privacy-retention-candidate.js'
      - 'cloudflare/src/namibia-research-note-intake.js'
      - 'proposals/namibia/001_compliance_candidate.sql'
      - 'proposals/namibia/002_source_evidence_candidate.sql'
      - 'proposals/namibia/003_disposable_sessions_candidate.sql'
      - 'prototypes/namibia-compliance-preview.html'
      - 'cloudflare/src/market-profile.js'
      - 'cloudflare/src/regulatory-pack-registry.js'
      - 'tests/namibia-compliance-candidate.test.mjs'
      - 'tests/namibia-compliance-workflows.test.mjs'
      - 'tests/namibia-compliance-candidate-store.test.mjs'
      - 'tests/namibia-compliance-sqlite-rehearsal.test.mjs'
      - 'tests/namibia-internal-api-candidate.test.mjs'
      - 'tests/namibia-authenticated-internal-api.test.mjs'
      - 'tests/namibia-isolation-preflight.test.mjs'
      - 'tests/namibia-d1-inventory-audit.test.mjs'
      - 'tests/namibia-worker-binding-audit.test.mjs'
      - 'tests/namibia-disposable-sessions.test.mjs'
      - 'tests/namibia-full-isolated-auth-rehearsal.test.mjs'
      - 'tests/namibia-source-review-candidate.test.mjs'
      - 'tests/namibia-rule-review-ledger.test.mjs'
      - 'tests/namibia-source-evidence-candidate.test.mjs'
      - 'tests/namibia-privacy-retention-candidate.test.mjs'
      - 'tests/namibia-research-note-intake.test.mjs'
      - 'docs/namibia-compliance-foundation-2026-11-07.md'
      - '.github/workflows/namibia-candidate-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Namibia fail-closed source and tests
        run: |
          node --check cloudflare/src/namibia-compliance-candidate.js
          node --check cloudflare/src/namibia-compliance-workflows.js
          node --check cloudflare/src/namibia-compliance-candidate-store.js
          node --check cloudflare/src/namibia-internal-api-candidate.js
          node --check cloudflare/src/namibia-isolation-preflight.js
          node --check cloudflare/src/namibia-d1-inventory-audit.js
          node --check cloudflare/src/namibia-worker-binding-audit.js
          node --check cloudflare/src/namibia-source-review-candidate.js
          node --check cloudflare/src/namibia-rule-review-ledger.js
          node --check cloudflare/src/namibia-source-evidence-candidate.js
          node --check cloudflare/src/namibia-privacy-retention-candidate.js
          node --check cloudflare/src/namibia-research-note-intake.js
          node --test tests/namibia-compliance-candidate.test.mjs tests/namibia-compliance-workflows.test.mjs tests/namibia-compliance-candidate-store.test.mjs tests/namibia-compliance-sqlite-rehearsal.test.mjs tests/namibia-internal-api-candidate.test.mjs tests/namibia-authenticated-internal-api.test.mjs tests/namibia-isolation-preflight.test.mjs tests/namibia-d1-inventory-audit.test.mjs tests/namibia-worker-binding-audit.test.mjs tests/namibia-disposable-sessions.test.mjs tests/namibia-full-isolated-auth-rehearsal.test.mjs tests/namibia-source-review-candidate.test.mjs tests/namibia-rule-review-ledger.test.mjs tests/namibia-source-evidence-candidate.test.mjs tests/namibia-privacy-retention-candidate.test.mjs tests/namibia-research-note-intake.test.mjs
          node tests/v169-regulatory-pack-registry.mjs
          node tests/v172-market-activation-gate.mjs
