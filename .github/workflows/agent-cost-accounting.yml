name: Agent cost accounting
on:
  push:
    branches:
      - main
      - 'chatgpt/agent-runtime-economics-20261008'
    paths:
      - 'cloudflare/src/agent-cost-*.js'
      - 'cloudflare/src/agent-runtime-guard.js'
      - 'cloudflare/experimental/agent_cost_accounting.sql'
      - 'tests/agent-cost-*.mjs'
      - 'tests/helpers/agent-cost-schema.mjs'
      - '.github/workflows/agent-cost-accounting.yml'
  pull_request:
    paths:
      - 'cloudflare/src/agent-cost-*.js'
      - 'cloudflare/src/agent-runtime-guard.js'
      - 'cloudflare/experimental/agent_cost_accounting.sql'
      - 'tests/agent-cost-*.mjs'
      - 'tests/helpers/agent-cost-schema.mjs'
      - '.github/workflows/agent-cost-accounting.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/agent-cost-admission.mjs
      - run: node tests/agent-cost-execution-boundary.mjs
      - run: node tests/agent-cost-reservations-static.mjs
      - run: node --disable-warning=ExperimentalWarning tests/agent-cost-reservations-integration.mjs
      - run: node --disable-warning=ExperimentalWarning tests/agent-cost-tenant-purge.mjs
      - run: node --disable-warning=ExperimentalWarning tests/agent-cost-outcome-telemetry.mjs
