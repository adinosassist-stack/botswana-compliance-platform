name: Agent cost accounting
on:
  push:
    branches:
      - main
      - 'chatgpt/agent-runtime-economics-20261008'
    paths:
      - 'cloudflare/src/agent-cost-*.js'
      - 'cloudflare/src/agent-runtime-guard.js'
      - 'cloudflare/experimental/agent_cost_accounting.sql'
      - 'tests/agent-cost-*.mjs'
      - 'tests/agent-runtime-cost-adversarial-*.mjs'
      - 'tests/helpers/agent-cost-schema.mjs'
      - 'scripts/agent-cost-schema-preflight.mjs'
      - 'scripts/manifests/agent-cost-schema.json'
      - 'scripts/migrate-agent-cost-accounting.mjs'
      - 'scripts/qualify-agent-cost-remote-d1.mjs'
      - 'cloudflare/migrations/068_agent_cost_accounting.sql'
      - 'cloudflare/src/ledger-schema-readiness.js'
      - 'scripts/agent-cost-production-*.mjs'
      - 'scripts/migrate-production-agent-cost-accounting.mjs'
      - '.github/workflows/migrate-production-agent-cost-accounting.yml'
      - '.github/workflows/agent-cost-remote-d1-qualification.yml'
      - '.github/workflows/agent-cost-accounting.yml'
  pull_request:
    paths:
      - 'cloudflare/src/agent-cost-*.js'
      - 'cloudflare/src/agent-runtime-guard.js'
      - 'cloudflare/experimental/agent_cost_accounting.sql'
      - 'tests/agent-cost-*.mjs'
      - 'tests/agent-runtime-cost-adversarial-*.mjs'
      - 'tests/helpers/agent-cost-schema.mjs'
      - 'scripts/agent-cost-schema-preflight.mjs'
      - 'scripts/manifests/agent-cost-schema.json'
      - 'scripts/migrate-agent-cost-accounting.mjs'
      - 'scripts/qualify-agent-cost-remote-d1.mjs'
      - 'cloudflare/migrations/068_agent_cost_accounting.sql'
      - 'cloudflare/src/ledger-schema-readiness.js'
      - 'scripts/agent-cost-production-*.mjs'
      - 'scripts/migrate-production-agent-cost-accounting.mjs'
      - '.github/workflows/migrate-production-agent-cost-accounting.yml'
      - '.github/workflows/agent-cost-remote-d1-qualification.yml'
      - '.github/workflows/agent-cost-accounting.yml'
  workflow_dispatch:
jobs:
  local-d1-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:agent-cost-d1
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/agent-cost-admission.mjs
      - run: node tests/agent-cost-execution-boundary.mjs
      - run: node tests/agent-runtime-cost-adversarial-20261010.mjs
      - run: node tests/agent-cost-reservations-static.mjs
      - run: node tests/agent-cost-schema-preflight.mjs
      - run: node tests/agent-cost-migration.mjs
      - run: node tests/agent-cost-production-migration.mjs
      - run: node tests/agent-cost-remote-d1-qualification-static.mjs
      - run: node --disable-warning=ExperimentalWarning tests/agent-cost-reservations-integration.mjs
      - run: node --disable-warning=ExperimentalWarning tests/agent-cost-tenant-purge.mjs
      - run: node --disable-warning=ExperimentalWarning tests/agent-cost-outcome-telemetry.mjs
