name: Mobile post-deploy smoke
run-name: Mobile post-deploy smoke ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Production Deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  mobile-live:
    name: Verify live Android-sized startup, menu and registration UI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      ORIGIN: https://thebedesk.com
    steps:
      - name: Checkout exact deployed authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install browser driver only
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Verify audit remediation contract
        shell: bash
        run: node tests/v82-audit-remediation-static.mjs
      - name: Exercise live mobile startup, menu and registration surface
        shell: bash
        run: node scripts/production-mobile-postdeploy-smoke.mjs
