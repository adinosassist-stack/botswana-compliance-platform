name: Workspace Agent pinned-version secret provenance (read only)
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA
        type: string
        required: true
permissions: {}
concurrency:
  group: workspace-agent-pinned-version-provenance
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - name: Verify exact-main and independent reviewer protection
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          reviewer="$(gh api users/thusico --jq .id)"
          envapi="repos/$GITHUB_REPOSITORY/environments/workspace-agent-private-staging"
          gh api "$envapi" | jq -e --argjson reviewer "$reviewer" '
            any(.protection_rules[]; .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | length == 1) and
              ([.reviewers[] | select(.type == "User") | .reviewer.id] == [$reviewer])) and
              .deployment_branch_policy.custom_branch_policies == true' >/dev/null
          gh api "$envapi/deployment-branch-policies" | jq -e '
            .total_count == 1 and .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"' >/dev/null
  inspect:
    needs: verify
    environment: workspace-agent-private-staging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
      AUDIT_TOKEN: ${{ secrets.WORKSPACE_AGENT_STAGING_READONLY_CLOUDFLARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Inspect explicit pinned and latest Worker versions
        run: |
          set -euo pipefail
          test -n "$AUDIT_TOKEN"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          tmp="$(mktemp -d)"
          export PINNED_INSPECTION_TMP="$tmp"
          trap 'rm -rf "$tmp"' EXIT
          base="https://api.cloudflare.com/client/v4/accounts/b11d872b2660e76ca66323023b45b3ab"
          script="bw-workspace-agent-staging"
          fetch() {
            if ! curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $AUDIT_TOKEN" "$base/$1" > "$tmp/$2" 2>/dev/null; then
              echo "::error::Version-specific read-only Cloudflare API request failed"
              exit 1
            fi
          }
          fetch "workers/workers/$script/versions/64d9bae9-2ea3-40c1-9a26-83cea97ad71c" pinned
          fetch "workers/workers/$script/versions/latest" latest
          fetch "workers/scripts/$script/settings" service-settings
          fetch "workers/scripts/$script/deployments" deployed
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {compareWorkerSettingsSources} from './scripts/workspace-agent-settings-source-comparison.mjs';
          const tmp=process.env.PINNED_INSPECTION_TMP;
          let result;
          try {
            result=compareWorkerSettingsSources({
              version:JSON.parse(readFileSync(tmp+'/pinned','utf8')),
              script:JSON.parse(readFileSync(tmp+'/service-settings','utf8')),
              latest:JSON.parse(readFileSync(tmp+'/latest','utf8')),
              deployments:JSON.parse(readFileSync(tmp+'/deployed','utf8'))
            });
          } catch {
            console.error('::error::Unreadable Worker settings metadata');
            process.exit(1);
          }
          if(!result.verified){
            for(const reason of result.issues)console.error('::error::'+reason);
            process.exit(1);
          }
          for(const [name,source] of [['pinned_version',result.pinnedVersion],['service_settings',result.scriptSettings]]){
            console.log('CLASS '+name+' secret='+source.sessionSecret+' d1='+source.d1+
              ' advisory='+source.advisoryFlag+' bindings_count='+source.numberOfBindings);
          }
          if(result.sourcesDiffer)console.log('BLOCK per_version_service_settings_mismatch');
          if(!result.latestIsPinned)console.log('BLOCK latest_secret_inheritance_unsafe');
          if(result.repairBlocked)console.log('BLOCK configuration_mutation_requires_independent_reconciliation');
          else console.log('PASS version_and_service_settings_consistent');
          console.log('No Cloudflare writes or secret values exported.');
          NODE
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
