name: Thebe Life private release gate (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-protection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Offline protection contract
        run: node --test tests/thebe-life-environment-protection.test.mjs
      - name: Verify actual GitHub environment is protected
        env:
          LIFE_STAGING_GITHUB_ENV_READ_TOKEN: ${{ secrets.LIFE_STAGING_GITHUB_ENV_READ_TOKEN }}
        run: node scripts/verify-thebe-life-private-environment.mjs
      - name: Confirm inert Worker build (no upload)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --config cloudflare/wrangler.life-staging.toml --outdir /tmp/thebe-life-private-release
