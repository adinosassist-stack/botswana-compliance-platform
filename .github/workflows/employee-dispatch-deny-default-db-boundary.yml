name: Employee Dispatch Deny-Default DB Boundary

on:
  pull_request:
    paths:
      - 'db/schema.sql'
      - 'db/drafts/employee-dispatch-proposal-review-postgres.sql'
      - 'db/drafts/employee-dispatch-reviewer-permission-postgres.sql'
      - 'db/drafts/employee-dispatch-authenticated-grant-issuance.sql'
      - 'db/drafts/employee-dispatch-review-session-provenance.sql'
      - 'db/drafts/employee-dispatch-outbox-postgres.sql'
      - 'db/drafts/employee-dispatch-grant-activation-postgres.sql'
      - 'server/employee-reviewer-grant-activator-draft.js'
      - 'server/employee-reviewer-grant-issuer-draft.js'
      - 'server/employee-review-session-writer-draft.js'
      - 'tests/employee-dispatch-grant-activation-postgres.test.mjs'
      - 'db/drafts/employee-dispatch-deny-default-access-postgres.sql'
      - 'tests/employee-dispatch-deny-default-access-postgres.test.mjs'
      - '.github/workflows/employee-dispatch-deny-default-db-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-default-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch_ci_only
          POSTGRES_DB: employee_dispatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d employee_dispatch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dispatch:dispatch_ci_only@127.0.0.1:5432/employee_dispatch_ci
      EMPLOYEE_DISPATCH_PG_TEST_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply complete employee draft stack only in disposable PostgreSQL
        run: |
          set -e
          export PGPASSWORD=dispatch_ci_only
          for sql in \
            db/schema.sql \
            db/drafts/employee-dispatch-proposal-review-postgres.sql \
            db/drafts/employee-dispatch-reviewer-permission-postgres.sql \
            db/drafts/employee-dispatch-authenticated-grant-issuance.sql \
            db/drafts/employee-dispatch-review-session-provenance.sql \
            db/drafts/employee-dispatch-outbox-postgres.sql \
            db/drafts/employee-dispatch-grant-activation-postgres.sql \
            db/drafts/employee-dispatch-deny-default-access-postgres.sql
          do
            psql -h 127.0.0.1 -U dispatch -d employee_dispatch_ci -v ON_ERROR_STOP=1 -f "$sql"
          done
      - name: Test independent-owner activation, session binding and atomic audit
        run: node --test tests/employee-dispatch-grant-activation-postgres.test.mjs
      - name: Test RLS default deny, no tenant leakage and no write privileges
        run: node --test tests/employee-dispatch-deny-default-access-postgres.test.mjs
