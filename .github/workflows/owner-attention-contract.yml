name: Owner Attention contract

on:
  pull_request:
    paths:
      - "cloudflare/src/owner-attention.js"
      - "cloudflare/src/owner-attention-entry.js"
      - "cloudflare/src/agentic-entry.js"
      - "cloudflare/src/release-governance-entry.js"
      - "cloudflare/wrangler.toml"
      - "public/js/owner-focus-strip-v296.js"
      - "tests/owner-attention-contract.mjs"
      - "tests/owner-attention-entry-contract.mjs"
      - "tests/owner-focus-canonical-backend.mjs"
      - ".github/workflows/owner-attention-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Verify Owner Attention syntax
        run: |
          node --check cloudflare/src/owner-attention.js
          node --check cloudflare/src/owner-attention-entry.js
          node --check cloudflare/src/agentic-entry.js
          node --check cloudflare/src/release-governance-entry.js
          node --check public/js/owner-focus-strip-v296.js
          node --check tests/owner-attention-contract.mjs
          node --check tests/owner-attention-entry-contract.mjs
          node --check tests/owner-focus-canonical-backend.mjs

      - name: Run Owner Attention contract regressions
        run: |
          node tests/owner-attention-contract.mjs
          node tests/owner-attention-entry-contract.mjs
          node tests/owner-focus-canonical-backend.mjs
          node tests/v303-owner-focus-priority-context.mjs
          node tests/v323-owner-focus-recovery.mjs
