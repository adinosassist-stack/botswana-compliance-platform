name: Thebe Life private Worker preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/src/thebe-life-private-staging-entry.js'
      - 'cloudflare/wrangler.life-staging.toml'
      - 'tests/thebe-life-private-worker.test.mjs'
      - '.github/workflows/thebe-life-private-staging-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-worker-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Validate private Worker route and binding contract
        run: |
          node --check cloudflare/src/thebe-life-private-staging-entry.js
          node --test tests/thebe-life-private-worker.test.mjs
      - name: Cloudflare Worker dry run — no deployment
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --config cloudflare/wrangler.life-staging.toml --outdir /tmp/thebe-life-staging
