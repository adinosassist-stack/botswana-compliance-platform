name: Agent Gate Unit Tests
on:
  pull_request:
    paths:
      - 'cloudflare/src/agent-security-gate.js'
      - 'tests/agent-security-gate.mjs'
      - '.github/workflows/agent-gate-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudflare/src/agent-security-gate.js
      - run: node tests/agent-security-gate.mjs
