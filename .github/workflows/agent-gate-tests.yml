name: Agent Gate Unit Tests
on:
  pull_request:
    paths:
      - 'cloudflare/src/agent-security-gate.js'
      - 'tests/agent-security-gate.mjs'
      - 'tests/agent-security-gate-runtime.mjs'
      - 'tests/agent-security-gate-d1.mjs'
      - 'cloudflare/src/agentic-persistent-tasks.js'
      - 'cloudflare/src/agent-tool-trust-registry.js'
      - 'cloudflare/src/agent-capability-security.js'
      - 'cloudflare/src/agent-policy.js'
      - 'tests/v117-persistent-agent-tasks.mjs'
      - 'cloudflare/src/agentic-authority-core.js'
      - 'cloudflare/schema.sql'
      - 'cloudflare/migrations/**'
      - 'tests/helpers/agent-cost-schema.mjs'
      - 'package-lock.json'
      - '.github/workflows/agent-gate-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check cloudflare/src/agent-security-gate.js
      - run: node --check cloudflare/src/agentic-persistent-tasks.js
      - run: node --check tests/agent-security-gate.mjs
      - run: node --check tests/v117-persistent-agent-tasks.mjs
      - run: node tests/agent-security-gate.mjs
      - run: node --no-warnings tests/agent-security-gate-runtime.mjs
      - run: node --no-warnings tests/agent-security-gate-d1.mjs
      - run: node tests/v117-persistent-agent-tasks.mjs
