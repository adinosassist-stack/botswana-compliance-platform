name: AI export D1 SQLite schema qualification
on:
  pull_request:
    paths:
      - 'server/ai-export-d1-metadata.js'
      - 'docs/ai-export-d1-schema-candidate.sql'
      - 'tests/ai-export-d1-sqlite-real.test.mjs'
      - '.github/workflows/ai-export-d1-sqlite.yml'
permissions:
  contents: read
jobs:
  sqlite-schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Validate SQL schema and constraints with real SQLite
        run: node --experimental-sqlite --test tests/ai-export-d1-sqlite-real.test.mjs
