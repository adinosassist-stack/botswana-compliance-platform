name: Agent Workflow Simulation Tests
on:
  pull_request:
    paths:
      - 'cloudflare/src/agent-workflow-simulation.js'
      - 'tests/agent-workflow-simulation.test.mjs'
      - 'cloudflare/src/agent-approval-preview-boundary.js'
      - 'cloudflare/src/agent-approval-preview-handler.js'
      - 'cloudflare/src/agent-approval-history-view.js'
      - 'cloudflare/src/agent-approval-history-service.js'
      - 'tests/agent-approval-history-service.test.mjs'
      - 'server/agent-approval-history-postgres.js'
      - 'tests/agent-approval-history-postgres.test.mjs'
      - 'server/agent-approval-history-controller.js'
      - 'tests/agent-approval-history-controller.test.mjs'
      - 'server/agent-approval-history-http-adapter.js'
      - 'server/agent-approval-history-express.js'
      - 'tests/agent-approval-history-express.test.mjs'
      - 'tests/agent-approval-history-http-adapter.test.mjs'
      - 'tests/agent-approval-history-postgres-integration.test.mjs'
      - 'tests/agent-approval-history-http-guard-order.test.mjs'
      - 'tests/agent-approval-history-view.test.mjs'
      - 'public/js/agent-approval-history.js'
      - 'tests/agent-approval-history-ui.test.mjs'
      - 'tests/agent-approval-preview-handler.test.mjs'
      - 'tests/agent-approval-preview-boundary.test.mjs'
      - 'public/js/agent-approval-preview.js'
      - 'tests/agent-approval-preview-ui.test.mjs'
      - 'tests/agent-approval-preview-ui-dom.test.mjs'
      - 'public/js/agent-simulation-preview.js'
      - 'tests/agent-simulation-preview.test.mjs'
      - '.github/workflows/agent-workflow-simulation-tests.yml'
  workflow_dispatch:
jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deterministic simulation contract
        run: node --test tests/agent-workflow-simulation.test.mjs tests/agent-simulation-preview.test.mjs tests/agent-approval-preview-boundary.test.mjs tests/agent-approval-preview-ui.test.mjs tests/agent-approval-preview-handler.test.mjs tests/agent-approval-preview-ui-dom.test.mjs tests/agent-approval-history-view.test.mjs tests/agent-approval-history-ui.test.mjs tests/agent-approval-history-service.test.mjs tests/agent-approval-history-postgres.test.mjs tests/agent-approval-history-controller.test.mjs tests/agent-approval-history-http-adapter.test.mjs tests/agent-approval-history-postgres-integration.test.mjs tests/agent-approval-history-http-guard-order.test.mjs tests/agent-approval-history-express.test.mjs
