name: Agent Workflow Simulation Tests
on:
  pull_request:
    paths:
      - 'cloudflare/src/agent-workflow-simulation.js'
      - 'tests/agent-workflow-simulation.test.mjs'
      - '.github/workflows/agent-workflow-simulation-tests.yml'
  workflow_dispatch:
jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deterministic simulation contract
        run: node --test tests/agent-workflow-simulation.test.mjs
