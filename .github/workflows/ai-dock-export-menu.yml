name: AI Dock export menu security
on:
  pull_request:
    paths:
      - 'public/js/thebe-ai-export-menu.js'
      - 'tests/ai-dock-export-menu-static.test.mjs'
      - '.github/workflows/ai-dock-export-menu.yml'
permissions:
  contents: read
jobs:
  guarded-menu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-dock-export-menu-static.test.mjs
