name: V270 live provider policy

on:
  pull_request:
    paths:
      - "cloudflare/src/thebe-voice-provider-policy.js"
      - "tests/v270-live-provider-policy.mjs"
      - ".github/workflows/v270-live-provider-policy-ci.yml"
      - "docs/releases/v270-live-provider-policy.md"
  push:
    branches:
      - "chatgpt/v270-live-provider-policy"
    paths:
      - "cloudflare/src/thebe-voice-provider-policy.js"
      - "tests/v270-live-provider-policy.mjs"
      - ".github/workflows/v270-live-provider-policy-ci.yml"
      - "docs/releases/v270-live-provider-policy.md"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check provider policy
        run: node --check cloudflare/src/thebe-voice-provider-policy.js
      - name: V270 provider policy qualification
        run: node tests/v270-live-provider-policy.mjs
      - name: Preserve V101 production Realtime guard
        run: node tests/v101-gpt-live-voice-foundation.mjs
