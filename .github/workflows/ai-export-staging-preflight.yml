name: AI export staging read-only preflight qualification
on:
  pull_request:
    paths:
      - 'cloudflare/src/ai-export-staging-readonly.js'
      - 'tests/ai-export-staging-readonly.test.mjs'
      - 'docs/ai-export-staging-readonly-preflight.md'
      - '.github/workflows/ai-export-staging-preflight.yml'
permissions:
  contents: read
jobs:
  read-only-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check cloudflare/src/ai-export-staging-readonly.js
      - run: node --test tests/ai-export-staging-readonly.test.mjs
