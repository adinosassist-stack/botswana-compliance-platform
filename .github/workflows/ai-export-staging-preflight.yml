name: AI export staging read-only preflight qualification
on:
  pull_request:
    paths:
      - 'cloudflare/src/ai-export-staging-readonly.js'
      - 'tests/ai-export-staging-readonly.test.mjs'
      - 'tests/ai-export-isolated-synthetic-roundtrip.test.mjs'
      - 'server/ai-export-authorized-reader.js'
      - 'tests/ai-export-authorized-reader.test.mjs'
      - 'tests/ai-export-staging-schema-offline.test.py'
      - 'docs/ai-export-d1-schema-candidate.sql'
      - 'scripts/inspect-ai-export-staging-preapply.mjs'
      - 'tests/ai-export-staging-preapply-gates.test.mjs'
      - 'scripts/qualify-ai-export-staging-schema-offline.mjs'
      - 'tests/ai-export-staging-schema-plan.test.mjs'
      - 'scripts/ai-export-private-bucket-inventory-readonly.mjs'
      - 'tests/ai-export-private-bucket-inventory-readonly.test.mjs'
      - 'docs/ai-export-staging-readonly-preflight.md'
      - '.github/workflows/ai-export-staging-preflight.yml'
permissions:
  contents: read
jobs:
  read-only-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check cloudflare/src/ai-export-staging-readonly.js
      - run: node --check scripts/ai-export-private-bucket-inventory-readonly.mjs
      - run: node --test tests/ai-export-staging-readonly.test.mjs tests/ai-export-private-bucket-inventory-readonly.test.mjs tests/ai-export-isolated-synthetic-roundtrip.test.mjs
      - name: Offline-only pinned D1 target and schema digest checks
        run: |
          node --check scripts/qualify-ai-export-staging-schema-offline.mjs
          node --test tests/ai-export-staging-schema-plan.test.mjs
          node scripts/qualify-ai-export-staging-schema-offline.mjs
      - name: Default-deny isolated D1 preapply approval and inventory test
        run: |
          node --check scripts/inspect-ai-export-staging-preapply.mjs
          node --test tests/ai-export-staging-preapply-gates.test.mjs
      - name: In-memory-only D1 export candidate schema and constraints
        run: python3 tests/ai-export-staging-schema-offline.test.py
