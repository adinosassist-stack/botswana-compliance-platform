name: Thebe Desk WhatsApp Provider Readiness
run-name: WhatsApp provider readiness ${{ github.event.workflow_run.head_sha || inputs.expected_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional deployed main SHA to verify without sending a message
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: thebe-whatsapp-provider-readiness-${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Prove provider state without Meta traffic
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}
      ORIGIN: https://thebedesk.com
      WHATSAPP_BUSINESS_NUMBER: ${{ vars.WHATSAPP_BUSINESS_NUMBER }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
      WHATSAPP_TEMPLATE_MAP_JSON: ${{ vars.WHATSAPP_TEMPLATE_MAP_JSON }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}

    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve expected provider state without exposing values
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const requiredTemplates=[
            'obligation_due','compliance_schedule_due','daily_operations_summary_ready',
            'critical_business_risk','control_assurance_stale','performance_intelligence_alert'
          ];
          const bindingNames=['WHATSAPP_BUSINESS_NUMBER','WHATSAPP_PHONE_NUMBER_ID','WHATSAPP_GRAPH_VERSION','WHATSAPP_TEMPLATE_MAP_JSON'];
          const populated= bindingNames.filter(name=>String(process.env[name]||'').trim()!=='');
          let enabled=false;
          if(populated.length===0){
            enabled=false;
          }else{
            if(populated.length!==bindingNames.length)throw new Error('WhatsApp provider bindings are partial; release must fail closed');
            const business=String(process.env.WHATSAPP_BUSINESS_NUMBER||'').replace(/[\s+().-]/g,'');
            if(business!=='26777723273')throw new Error('WhatsApp public business number is not the approved Thebe Desk number');
            const phoneId=String(process.env.WHATSAPP_PHONE_NUMBER_ID||'');
            if(!/^\d{5,32}$/.test(phoneId)||phoneId===business)throw new Error('Meta phone-number ID is invalid or confused with the public business number');
            if(!/^v\d+\.\d+$/.test(String(process.env.WHATSAPP_GRAPH_VERSION||'')))throw new Error('WhatsApp Graph API version is invalid');
            let map;
            try{map=JSON.parse(process.env.WHATSAPP_TEMPLATE_MAP_JSON||'');}catch{throw new Error('WhatsApp template map is not valid JSON');}
            if(!map||Array.isArray(map)||typeof map!=='object')throw new Error('WhatsApp template map is not an object');
            for(const key of requiredTemplates){
              const item=map[key];
              if(!item||typeof item!=='object')throw new Error(`WhatsApp required template missing: ${key}`);
              if(!/^[a-z0-9_]{1,512}$/.test(String(item.name||'')))throw new Error(`WhatsApp template name invalid: ${key}`);
              if(!/^[a-z]{2,3}(?:_[A-Z]{2})?$/.test(String(item.language||'en_US')))throw new Error(`WhatsApp template language invalid: ${key}`);
            }
            if(String(process.env.WHATSAPP_ACCESS_TOKEN||'').length<20)throw new Error('WhatsApp access token is absent or too short');
            if(String(process.env.WHATSAPP_APP_SECRET||'').length<16)throw new Error('WhatsApp app secret is absent or too short');
            if(String(process.env.WHATSAPP_VERIFY_TOKEN||'').length<16)throw new Error('WhatsApp verify token is absent or too short');
            enabled=true;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`enabled=${enabled}\n`);
          console.log(`WhatsApp provider expected state: ${enabled?'ready':'deferred'}; secret values were not printed`);
          NODE

      - name: Verify live readiness state without a Meta request
        env:
          EXPECTED_ENABLED: ${{ steps.expected.outputs.enabled }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected=String(process.env.EXPECTED_ENABLED).toLowerCase()==='true';
          const origin=process.env.ORIGIN;
          const response=await fetch(origin+'/api/ready',{headers:{accept:'application/json','user-agent':'ThebeDesk-WhatsApp-Provider-Readiness/1.0'}});
          if(response.status!==200)throw new Error(`/api/ready returned HTTP ${response.status}`);
          const body=await response.json();
          if(body.ok!==true||body.requiredConfigReady!==true)throw new Error('core production readiness is not green');
          const checks=Array.isArray(body.checks)?body.checks:[];
          const whatsapp=checks.find(item=>item&&item.key==='WHATSAPP_CONNECTOR');
          if(!whatsapp)throw new Error('/api/ready does not expose the governed WHATSAPP_CONNECTOR readiness check');
          if(Boolean(whatsapp.configured)!==expected){
            throw new Error(`live WhatsApp provider state mismatch expected=${expected?'ready':'deferred'} actual=${whatsapp.configured?'ready':'deferred'}`);
          }
          console.log(`PASS live WhatsApp provider state=${expected?'ready':'deferred'}; no Meta request was made and no message was sent`);
          NODE

      - name: Record non-secret readiness summary
        env:
          EXPECTED_ENABLED: ${{ steps.expected.outputs.enabled }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_ENABLED" == 'true' ]]; then state=ready; else state=deferred; fi
          printf 'WhatsApp provider readiness: %s\nNo Meta request was made. No message was sent. Public wa.me entry is verified separately.\n' "$state" >> "$GITHUB_STEP_SUMMARY"
