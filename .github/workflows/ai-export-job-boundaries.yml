name: AI export job boundary tests
on:
  pull_request:
    paths:
      - 'server/ai-document-export-*.js'
      - 'tests/ai-document-export-job.test.mjs'
      - '.github/workflows/ai-export-job-boundaries.yml'
permissions:
  contents: read
jobs:
  job-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-document-export-job.test.mjs
