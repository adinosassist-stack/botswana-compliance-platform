name: Live login transport smoke
on:
  push:
    branches: [verify/live-user-smoke-20260913]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Verify tunneled login completes
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';import fs from 'node:fs';import assert from 'node:assert/strict';
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);assert.ok(exe);
          const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});const page=await browser.newPage();
          const traffic=[];const errors=[];page.on('request',r=>{const u=new URL(r.url());const logical=u.searchParams.get('__thebe_api_path')||u.pathname;if(logical.includes('/api/auth/'))traffic.push({kind:'request',method:r.method(),logical,url:r.url()})});page.on('response',r=>{const u=new URL(r.url());const logical=u.searchParams.get('__thebe_api_path')||u.pathname;if(logical.includes('/api/auth/'))traffic.push({kind:'response',status:r.status(),logical,url:r.url()})});page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://thebedesk.com/',{waitUntil:'networkidle',timeout:45000});await page.locator('button[data-guest-action]').filter({hasText:/Sign in/i}).first().click();await page.locator('#authEmail').fill(`incident-smoke-${Date.now()}@example.com`);await page.locator('#authPassword').fill('WrongPassword-Smoke-Only!');const started=Date.now();await page.locator('#authSubmit').click();
          await page.waitForFunction(()=>{const b=document.getElementById('authSubmit'),e=document.getElementById('authError');return (!!e?.classList.contains('show')&&!!e.textContent.trim())||(!b?.disabled&&b?.textContent==='Sign in')},null,{timeout:25000});
          const result=await page.evaluate(()=>({disabled:document.getElementById('authSubmit')?.disabled,text:document.getElementById('authSubmit')?.textContent,error:document.getElementById('authError')?.textContent||'',shown:document.getElementById('authError')?.classList.contains('show')||false}));
          const elapsed=Date.now()-started;console.log('LOGIN_RESULT',JSON.stringify({elapsed,result,traffic,errors}));
          assert.ok(traffic.some(x=>x.kind==='request'&&x.logical==='/api/auth/register-transport-probe'),'transport safety probe sent');assert.ok(traffic.some(x=>x.kind==='request'&&x.logical==='/api/auth/login'),'logical login sent through supported transport');assert.ok(traffic.some(x=>x.kind==='response'&&x.logical==='/api/auth/login'&&[400,401,403,429].includes(x.status)),'login failed closed for invalid credentials');assert.equal(result.disabled,false);assert.equal(result.shown,true);assert.match(result.error,/incorrect|invalid|password|email|failed/i);assert.equal(errors.length,0);assert.ok(elapsed<25000);
          await browser.close();
          NODE
