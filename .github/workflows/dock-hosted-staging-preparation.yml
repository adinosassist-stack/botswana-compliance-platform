name: Dock hosted staging preparation
on:
  pull_request:
    paths:
      - '.github/workflows/dock-hosted-staging-preparation.yml'
      - '.github/workflows/dock-protected-staging-bootstrap.yml'
      - 'cloudflare/wrangler.dock-hosted-staging-inert.toml'
      - 'cloudflare/wrangler.dock-hosted-staging-*.review.toml'
      - 'scripts/verify-dock-inert-bootstrap.py'
      - 'scripts/build-dock-staging-research-config.py'
      - 'scripts/dock-hosted-ingress-guard.mjs'
      - 'scripts/dock-provision-inert-resources.mjs'
      - 'docs/dock-hosted-staging-provisioning.md'
      - 'cloudflare/schema/dock-hosted-staging-auth-candidate.sql'
      - 'tests/dock-hosted-staging-auth-contract.py'
      - 'cloudflare/src/worker.js'
      - 'cloudflare/src/general-ai-*.js'
      - 'cloudflare/wrangler.dock-research-workspace-offline.toml'
      - 'tests/general-ai-*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dock-hosted-staging-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline workspace isolation contract
        run: |
          python3 - <<'PY'
          import tomllib
          with open('cloudflare/wrangler.dock-research-workspace-offline.toml','rb') as f:
              c=tomllib.load(f)
          assert c['name']=='bw-dock-research-workspace-offline'
          assert c['main']=='src/general-ai-dock-workspace-staging-worker.js'
          assert c['workers_dev'] is False and c['preview_urls'] is False
          assert c['keep_vars'] is False
          assert not any(k in c for k in ('route','routes','services','d1_databases','r2_buckets','env','triggers'))
          v=c['vars']
          assert v['APP_ENV']=='staging' and v['PAYMENT_PROVIDER']=='none'
          for k in ('DOCK_STAGING_RESEARCH_ENABLED','THEBE_GENERAL_AI_ENABLED','THEBE_GENERAL_AI_RESEARCH_ENABLED','THEBE_LIVE_VOICE_ENABLED','THEBE_INTERNAL_AUTONOMY_ENABLED','THEBE_MARKETING_VOICE_ENABLED'):
              assert v[k]=='false', k
          assert v['AGENT_BOUNDED_TASK_EXECUTION_ENABLED']=='0'
          assert v['AI_FEATURES_DEFAULT']=='off'
          PY
      - name: Verify review profile isolation
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          folder = Path('cloudflare')
          workspace, backend = [
              tomllib.loads((folder / f'wrangler.dock-hosted-staging-{name}.review.toml').read_text())
              for name in ('workspace', 'backend')
          ]
          assert workspace['d1_databases'] == backend['d1_databases'] == [{
              'binding': 'DB',
              'database_name': 'bw-dock-hosted-synthetic-staging',
              'database_id': 'c63255cf-c589-4f6b-99c7-2d2e437566b5',
          }]
          assert backend['name'] == 'bw-dock-private-ai-staging'
          assert workspace['services'] == [{'binding': 'STAGING_AI', 'service': backend['name']}]
          assert 'DOCK_STAGING_WORKSPACE_ORIGIN' not in workspace['vars']
          assert 'services' not in backend
          for profile in (workspace, backend):
              assert profile['workers_dev'] is False and profile['preview_urls'] is False
              assert profile['keep_vars'] is False
              assert not any(key in profile for key in ('routes', 'route', 'env', 'triggers', 'r2_buckets'))
              assert profile['vars']['APP_ENV'] == 'staging'
              assert 'SESSION_SECRET' not in profile['vars']
              for flag in ('THEBE_GENERAL_AI_ENABLED', 'THEBE_GENERAL_AI_RESEARCH_ENABLED', 'THEBE_LIVE_VOICE_ENABLED'):
                  assert profile['vars'][flag] == 'false', flag
          assert workspace['vars']['DOCK_STAGING_RESEARCH_ENABLED'] == 'false'
          PY
      - run: npm ci --ignore-scripts
      - name: Bundle both review profiles without publishing
        run: |
          set -euo pipefail
          for profile in workspace backend; do
            npx --no-install wrangler deploy --dry-run --config "cloudflare/wrangler.dock-hosted-staging-${profile}.review.toml" --outdir "/tmp/dock-review-${profile}"
          done
      - name: Bundle generated Dock research profiles without publishing
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          for role in workspace backend; do
            config="$temp_dir/dock-$role.json"
            python3 scripts/build-dock-staging-research-config.py "$role" 0123456789abcdef0123456789abcdef > "$config"
            npx --no-install wrangler deploy --dry-run --config "$config" --outdir "$temp_dir/bundle-$role"
          done
      - run: python3 tests/general-ai-staging-session-contract.py
      - run: python3 tests/dock-hosted-staging-auth-contract.py
      - run: python3 scripts/verify-dock-inert-bootstrap.py
      - name: Bundle route-free bootstrap candidate without publishing
        run: npx --no-install wrangler deploy --dry-run --config cloudflare/wrangler.dock-hosted-staging-inert.toml --outdir /tmp/dock-inert-preflight
      - run: node --test tests/general-ai-*.test.mjs
      - name: Build offline only
        run: npx --no-install wrangler deploy --dry-run --config cloudflare/wrangler.dock-research-workspace-offline.toml --outdir /tmp/dock-preflight
      - name: Package source provenance and build hashes
        run: |
          set -euo pipefail
          mkdir -p dock-preflight
          cp -a /tmp/dock-preflight/. dock-preflight/
          printf '%s\n' "$GITHUB_SHA" > dock-preflight/COMMIT_SHA.txt
          (cd dock-preflight && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dock-offline-preflight-${{ github.sha }}
          path: dock-preflight/
          if-no-files-found: error
          retention-days: 7
