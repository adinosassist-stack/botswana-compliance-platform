name: Quotation Offline Staging Artifact Receipt
on:
  pull_request:
    paths:
      - 'server/quotation-service-bound-staging-worker.mjs'
      - 'deploy/quotation-private-staging/wrangler.jsonc'
      - 'scripts/quotation-staging-bundle-hash.mjs'
      - 'tests/quotation-staging-bundle-hash.test.mjs'
      - '.github/workflows/quotation-offline-staging-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-artifact-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify deterministic bundle-hash tool and private staging contract
        run: |
          node --test tests/quotation-staging-bundle-hash.test.mjs tests/quotation-service-bound-staging-worker.test.mjs
      - name: Install exact locked Wrangler without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build real Worker bundle OFFLINE without credentials or deploy
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/quotation-offline-bundle" --config deploy/quotation-private-staging/wrangler.jsonc
      - name: Record SHA-pinned offline artifact digest
        env:
          OUT: ${{ runner.temp }}/quotation-offline-bundle
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/quotation-staging-bundle-hash.mjs "$OUT" "$SOURCE_SHA" > quotation-artifact-receipt.json
          cat quotation-artifact-receipt.json
      - name: Store evidence only (no Cloudflare token or deployment)
        uses: actions/upload-artifact@v4
        with:
          name: quotation-offline-receipt
          path: quotation-artifact-receipt.json
          retention-days: 7
