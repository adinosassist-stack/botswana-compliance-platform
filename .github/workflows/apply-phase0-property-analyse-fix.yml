name: Apply Phase 0 Property Analyse Proof Fix

on:
  push:
    branches:
      - chatgpt/phase0-property-analyse-proof
    paths:
      - '.github/workflows/apply-phase0-property-analyse-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/phase0-property-analyse-proof
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply exact Property journey patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('scripts/production-synthetic-full-user-wrapper.mjs')
          source=path.read_text()
          old="""    await openOwnerViewThroughNav('propertyintelligence');
          try{
          """
          new="""    await openOwnerViewThroughNav('propertyintelligence');
          const propertyAnalyseTab=page.getByRole('tab',{name:'Analyse',exact:true});
          assert(await propertyAnalyseTab.count(),'Property Analyse tab is missing from the authenticated Property workspace');
          await propertyAnalyseTab.click();
          await page.waitForFunction(()=>document.getElementById('propertyintelligence')?.dataset?.propertyActivePane==='analyse',null,{timeout:VIEW_TIMEOUT_MS});
          mark('Property Analyse tab','opened through the real Property workspace tab before calculator proof');
          try{
          """
          if source.count(old)!=1:
              raise SystemExit(f'expected exactly one Property proof insertion point, found {source.count(old)}')
          path.write_text(source.replace(old,new,1))
          PY

      - name: Run focused syntax and source checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/production-synthetic-full-user-wrapper.mjs
          grep -Fq "propertyAnalyseTab=page.getByRole('tab',{name:'Analyse',exact:true})" scripts/production-synthetic-full-user-wrapper.mjs
          grep -Fq "propertyActivePane==='analyse'" scripts/production-synthetic-full-user-wrapper.mjs
          git diff --check

      - name: Commit tested patch to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-release-bot'
          git config user.email 'thebe-release-bot@users.noreply.github.com'
          git add scripts/production-synthetic-full-user-wrapper.mjs
          git diff --cached --quiet && { echo 'no patch produced' >&2; exit 1; }
          git commit -m 'test: navigate to Property Analyse before calculator proof'
          git push origin HEAD:chatgpt/phase0-property-analyse-proof
