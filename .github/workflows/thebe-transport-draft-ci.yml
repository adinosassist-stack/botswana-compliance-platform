name: Thebe Transport 2027 draft contract
on:
  pull_request:
    paths:
      - 'docs/drafts/thebe-transport-2027-*'
      - 'tests/thebe-transport-draft.test.mjs'
      - '.github/workflows/thebe-transport-draft-ci.yml'
permissions:
  contents: read
jobs:
  offline-draft-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate synthetic draft and default-off limits (no secrets, deployment or network calls)
        run: |
          set -euo pipefail
          node --check tests/thebe-transport-draft.test.mjs
          node --test tests/thebe-transport-draft.test.mjs
