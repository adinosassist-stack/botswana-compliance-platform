name: Backup cadence admission offline
on:
  pull_request:
    paths:
      - scripts/qualify-backup-cadence-admission.mjs
      - tests/backup-cadence-admission.test.mjs
      - docs/proposals/BACKUP_CADENCE_ADMISSION_BATCH_20261104.md
      - .github/workflows/backup-cadence-admission-offline.yml
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Offline security admission tests, no provider credentials
        run: node --test tests/backup-cadence-admission.test.mjs
