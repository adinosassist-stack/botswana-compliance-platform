name: One-shot proxy-addr lock refresh

on:
  push:
    branches:
      - security/proxy-addr-2.0.8-20261006

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/proxy-addr-2.0.8-20261006
          fetch-depth: 0

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Refresh vulnerable transitive lock entry
        shell: bash
        run: |
          set -euo pipefail
          npm update proxy-addr --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const v=lock.packages?.['node_modules/proxy-addr']?.version;
          if(v!=='2.0.8') throw new Error(`expected proxy-addr 2.0.8, got ${v}`);
          console.log(`proxy-addr lock refreshed to ${v}`);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:dependencies

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json did not change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): refresh proxy-addr to 2.0.8'
          git push origin HEAD:security/proxy-addr-2.0.8-20261006
