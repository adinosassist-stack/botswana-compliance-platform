name: Workspace authored readiness CI

on:
  pull_request:
    paths:
      - "public/js/workspace-readiness-v305.js"
      - "tests/workspace-authored-readiness-v306.mjs"
      - ".github/workflows/workspace-authored-readiness-ci.yml"
  push:
    branches: [main]
    paths:
      - "public/js/workspace-readiness-v305.js"
      - "tests/workspace-authored-readiness-v306.mjs"
      - ".github/workflows/workspace-authored-readiness-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-ordering:
    name: Prove authored readiness precedes secondary workspace sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify readiness bootstrap syntax
        run: node --check public/js/workspace-readiness-v305.js
      - name: Prove cold-start view-change deferral
        run: node tests/workspace-authored-readiness-v306.mjs
