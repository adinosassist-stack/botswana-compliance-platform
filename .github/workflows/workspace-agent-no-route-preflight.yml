name: Workspace Agent no-route inventory preflight
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA
        required: true
        type: string
permissions:
  contents: read

jobs:
  verify-environment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify staging environment protections before referencing it
        run: |
          set -euo pipefail
          environment_api="repos/$GITHUB_REPOSITORY/environments/workspace-agent-private-staging"
          reviewer_id="$(gh api users/thusico --jq .id)"
          gh api "$environment_api" | jq -e --argjson reviewer "$reviewer_id" '
            any(.protection_rules[]; .type == "required_reviewers" and
              .prevent_self_review == true and
              ([.reviewers[] | select(.type == "User") | .reviewer.id] == [$reviewer]) and
              (.reviewers | length == 1)) and
            .deployment_branch_policy.custom_branch_policies == true'
          gh api "$environment_api/deployment-branch-policies" | jq -e '
            .total_count == 1 and .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"'

  inventory:
    needs: verify-environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: workspace-agent-private-staging
    steps:
      - name: Verify exact main after environment approval
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      - name: Verify proposed Worker and D1 names are unallocated
        env:
          AUDIT_TOKEN: ${{ secrets.WORKSPACE_AGENT_STAGING_READONLY_CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUDIT_TOKEN"
          api=https://api.cloudflare.com/client/v4/accounts/ddd23cab31928a4bb3d4998df9b26d1d
          resource=bw-workspace-agent-staging
          read_inventory() {
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $AUDIT_TOKEN" "$api/$1"
          }
          read_inventory workers/scripts | jq -e --arg name "$resource" '
            .success == true and (.result | type == "array" and all(.[]; (.id | type) == "string" and .id != $name))'
          read_inventory "d1/database?name=$resource&page=1&per_page=100" | jq -e --arg name "$resource" '
            .success == true and ((.result_info.total_pages // 1) <= 1) and
            (.result | type == "array" and length < 100 and all(.[]; (.name | type) == "string" and .name != $name))'
          read_inventory "workers/domains?service=$resource" | jq -e '
            .success == true and .result == []'
          echo "Proposed names are unallocated and the service has no listed custom domains."
          echo "Pre-provisioning inventory only. Live bindings and ingress require separate qualification."
      - name: Recheck current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
