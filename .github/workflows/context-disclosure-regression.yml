name: Thebe Context Disclosure Regression
run-name: Context disclosure ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - cloudflare/src/agentic-core.js
      - cloudflare/src/agentic-live-voice.js
      - cloudflare/src/ai-advisor-context-compaction.js
      - tests/v329-ai-advisor-context-compaction.mjs
      - tests/v330-live-voice-context-disclosure.mjs
      - .github/workflows/context-disclosure-regression.yml

permissions:
  contents: read

concurrency:
  group: thebe-context-disclosure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify advisor and voice context truthfulness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run context disclosure regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/agentic-core.js
          node --check cloudflare/src/agentic-live-voice.js
          node --check tests/v329-ai-advisor-context-compaction.mjs
          node --check tests/v330-live-voice-context-disclosure.mjs
          node tests/v329-ai-advisor-context-compaction.mjs
          node tests/v330-live-voice-context-disclosure.mjs
