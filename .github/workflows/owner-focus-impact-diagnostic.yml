name: Owner Focus impact diagnostic

on:
  pull_request:
    paths:
      - "public/js/owner-focus-strip-v296.js"
      - "tests/**"
      - ".github/workflows/owner-focus-impact-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.scan.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - id: scan
        name: Discover historical Owner Focus contracts
        shell: bash
        run: |
          set -euo pipefail
          files="$(node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const hits=[];
          const pattern=/(owner-focus-strip-v296|ownerFocusStrip|owner-focus|ownerAttentionPanel|owner focus)/i;
          for(const name of fs.readdirSync('tests')){
            if(!name.endsWith('.mjs'))continue;
            const file=path.join('tests',name);
            const source=fs.readFileSync(file,'utf8');
            if(pattern.test(source))hits.push(file);
          }
          process.stdout.write(JSON.stringify(hits.sort()));
          NODE
          )"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  contract:
    needs: discover
    if: ${{ needs.discover.outputs.files != '[]' }}
    name: ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - run: npm ci --ignore-scripts
      - name: Run discovered contract
        env:
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node "${{ matrix.file }}"
