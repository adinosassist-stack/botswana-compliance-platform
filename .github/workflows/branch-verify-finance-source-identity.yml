name: Temporary branch verify - finance source identity

on:
  push:
    branches:
      - chatgpt/finance-source-identity-integrity-20260915

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/finance-source-identity-integrity-20260915
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify finance adapter source identity
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/finance-core.js
          node tests/v79-finance-reconciliation.mjs
          node tests/v82-finance-idempotency-replay-integrity.mjs
          node tests/v82-finance-cross-idempotency-content-dedupe.mjs
          node tests/v82-finance-adapter-source-identity-integrity.mjs
          node tests/v81-finance-connections.mjs
