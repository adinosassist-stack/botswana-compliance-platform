name: Opt-in private backup cadence observer (read-only)
run-name: Backup recency observation ${{ github.sha }}
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Observe private backup metadata only (never produce backups)
        required: true
        type: choice
        default: DO_NOT_RUN
        options: [DO_NOT_RUN, READ_ONLY_CADENCE_OBSERVATION]
  pull_request:
    paths:
      - scripts/assess-r2-candidate-freshness.mjs
      - scripts/run-backup-cadence-observer.mjs
      - tests/run-backup-cadence-observer.test.mjs
      - tests/assess-r2-candidate-freshness.test.mjs
      - .github/workflows/backup-cadence-observer.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('thebe-backup-cadence-tests-{0}', github.event.pull_request.number) || 'thebe-readonly-backup-cadence' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test read-only cadence monitor and fail-closed authority
        run: node --test tests/run-backup-cadence-observer.test.mjs tests/assess-r2-candidate-freshness.test.mjs
  observe:
    needs: offline
    if: >-
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'READ_ONLY_CADENCE_OBSERVATION')) &&
      github.ref == 'refs/heads/main' &&
      vars.BACKUP_CADENCE_OBSERVER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reject stale or unreviewed source before credential step
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$GITHUB_SHA" ]]
      - name: Read candidate listing and evaluate recency plus 24-hour gap alarms
        env:
          BACKUP_CADENCE_OBSERVER_ENABLED: ${{ vars.BACKUP_CADENCE_OBSERVER_ENABLED }}
          BACKUP_MONITOR_CONFIRM: ${{ inputs.confirmation || '' }}
          BACKUP_MONITOR_ACCOUNT_ID: ${{ vars.BACKUP_MONITOR_ACCOUNT_ID }}
          BACKUP_R2_READONLY_TOKEN: ${{ secrets.BACKUP_R2_READONLY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --no-warnings scripts/run-backup-cadence-observer.mjs
