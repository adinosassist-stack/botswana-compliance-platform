name: Recover production Turnstile secret
run-name: Turnstile recovery ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: thebe-desk-turnstile-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover matching Turnstile secret into production Worker
    if: contains(github.event.head_commit.message, '[recover-turnstile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SITEKEY: 0x4AAAAAAEpcHZEBL6lkrJqM
      EXPECTED_HOSTNAME: thebedesk.com
      WORKER_NAME: bw-compliance-os
      SECRET_NAME: TURNSTILE_SECRET_KEY

    steps:
      - name: Checkout exact recovery authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          main_sha="$(
            curl --disable --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale Turnstile recovery target=$target current-main=$main_sha" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Recover and validate exact widget secret without disclosure
        shell: bash
        run: |
          set +x
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${EXPECTED_SITEKEY:?missing EXPECTED_SITEKEY}"
          : "${EXPECTED_HOSTNAME:?missing EXPECTED_HOSTNAME}"
          : "${WORKER_NAME:?missing WORKER_NAME}"
          : "${SECRET_NAME:?missing SECRET_NAME}"

          widget_json="$(
            curl --disable --fail-with-body --silent --show-error \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets/$EXPECTED_SITEKEY" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          )"

          printf '%s' "$widget_json" | jq -e \
            --arg sitekey "$EXPECTED_SITEKEY" \
            --arg hostname "$EXPECTED_HOSTNAME" '
              .success == true and
              .result.sitekey == $sitekey and
              (.result.secret | type == "string") and
              (.result.secret | test("^\\S+$")) and
              (.result.domains | type == "array") and
              (.result.domains | index($hostname) != null) and
              (.result.mode | IN("managed", "invisible", "non-interactive"))
            ' >/dev/null

          secret="$(printf '%s' "$widget_json" | jq -er '.result.secret | select(test("^\\S+$"))')"
          widget_mode="$(printf '%s' "$widget_json" | jq -er '.result.mode')"
          unset widget_json

          live_config="$(curl --disable --fail-with-body --silent --show-error 'https://thebedesk.com/api/auth/anti-bot-config')"
          printf '%s' "$live_config" | jq -e \
            --arg sitekey "$EXPECTED_SITEKEY" '
              .provider == "turnstile" and
              .siteKey == $sitekey and
              .action == "register" and
              .required == true
            ' >/dev/null
          unset live_config

          verify_response="$(
            printf '%s' "$secret" \
            | python3 -I -c 'import sys,urllib.parse; print(urllib.parse.urlencode({"secret":sys.stdin.read(),"response":"XXXX.DUMMY.TOKEN.XXXX"}),end="")' \
            | curl --disable --fail-with-body --silent --show-error \
                'https://challenges.cloudflare.com/turnstile/v0/siteverify' \
                --header 'Content-Type: application/x-www-form-urlencoded' \
                --data-binary @-
          )"
          printf '%s' "$verify_response" | jq -e '
            .success == false and
            ((.["error-codes"] // []) | index("invalid-input-response") != null) and
            ((.["error-codes"] // []) | index("invalid-input-secret") == null)
          ' >/dev/null
          unset verify_response

          before_list="$(
            curl --disable --fail-with-body --silent --show-error \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          )"
          printf '%s' "$before_list" | jq -e \
            --arg name "$SECRET_NAME" '.success == true and any(.result[]; .name == $name)' >/dev/null
          unset before_list

          write_response="$(
            printf '%s' "$secret" \
            | python3 -I -c 'import json,sys; print(json.dumps({"name":"TURNSTILE_SECRET_KEY","text":sys.stdin.read(),"type":"secret_text"}),end="")' \
            | curl --disable --fail-with-body --silent --show-error \
                "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" \
                --request PUT \
                --header 'Content-Type: application/json' \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --data-binary @-
          )"
          unset secret
          printf '%s' "$write_response" | jq -e \
            --arg name "$SECRET_NAME" '.success == true and .result.name == $name and .result.type == "secret_text"' >/dev/null
          unset write_response

          after_list="$(
            curl --disable --fail-with-body --silent --show-error \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          )"
          printf '%s' "$after_list" | jq -e \
            --arg name "$SECRET_NAME" '.success == true and any(.result[]; .name == $name)' >/dev/null
          unset after_list

          printf 'Turnstile widget recovered securely: hostname=%s mode=%s worker=%s binding=%s\n' \
            "$EXPECTED_HOSTNAME" "$widget_mode" "$WORKER_NAME" "$SECRET_NAME"

      - name: Verify production remains ready after secret replacement
        shell: bash
        run: |
          set -euo pipefail
          live="$(curl --disable --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 20 'https://thebedesk.com/api/live')"
          ready="$(curl --disable --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 20 'https://thebedesk.com/api/ready')"
          anti="$(curl --disable --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 20 'https://thebedesk.com/api/auth/anti-bot-config')"
          LIVE_JSON="$live" READY_JSON="$ready" ANTI_JSON="$anti" EXPECTED_SITEKEY="$EXPECTED_SITEKEY" node <<'NODE'
          const live = JSON.parse(process.env.LIVE_JSON);
          const ready = JSON.parse(process.env.READY_JSON);
          const anti = JSON.parse(process.env.ANTI_JSON);
          if (live.ok !== true) throw new Error('production liveness failed after Turnstile recovery');
          if (ready.ok !== true || ready.schemaReady !== true || ready.requiredConfigReady !== true) throw new Error('production readiness failed after Turnstile recovery');
          if (anti.provider !== 'turnstile' || anti.siteKey !== process.env.EXPECTED_SITEKEY || anti.action !== 'register' || anti.required !== true) throw new Error('live Turnstile public contract changed unexpectedly');
          console.log('Production readiness and Turnstile public contract remain green.');
          NODE
