name: Thebe Desk Zero-Orphan Production Integrity
run-name: Zero-orphan integrity ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Phase 0 Production Launch Audit"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: thebe-desk-zero-orphan-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Enforce zero-orphan production baseline
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      AUDIT_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

    steps:
      - name: Checkout exact launch-audited authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUDIT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid AUDIT_SHA=$AUDIT_SHA" >&2; exit 1; }
          target="$(git rev-parse HEAD)"
          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$target" == "$AUDIT_SHA" ]] || { echo "integrity checkout mismatch target=$target expected=$AUDIT_SHA" >&2; exit 1; }
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale integrity target=$target current-main=$main_sha" >&2; exit 1; }
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo 'refusing non-success launch audit trigger' >&2; exit 1; }
          [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]] || { echo 'refusing non-main launch audit trigger' >&2; exit 1; }
          [[ "${{ github.event.workflow_run.head_sha }}" == "$AUDIT_SHA" ]] || { echo 'launch-audit SHA mismatch' >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }
          echo "Exact zero-orphan authority confirmed: $AUDIT_SHA"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: One-shot bounded legacy orphan cleanup
        env:
          AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --pretty=%B | grep -Fq '[legacy-orphan-cleanup]'; then
            echo 'Legacy orphan cleanup marker absent; keeping this integrity run read-only.'
            exit 0
          fi
          node scripts/production-legacy-orphan-cleanup.mjs

      - name: Enforce permanent zero-orphan baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-zero-orphan-audit.mjs
