name: AI export artifact signature qualification
on:
  pull_request:
    paths:
      - 'server/ai-export-artifact-signature.js'
      - 'server/ai-document-export-service.js'
      - 'tests/ai-export-artifact-signature.test.mjs'
      - 'tests/ai-export-artifact-real-render.test.mjs'
      - 'tests/ai-export-pptx-text-only-import.test.mjs'
      - '.github/workflows/ai-export-artifact-signature.yml'
permissions:
  contents: read
jobs:
  signature-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check server/ai-document-export-service.js
      - name: Validate structural OOXML/PDF admission and service regression
        run: node --test tests/ai-export-artifact-signature.test.mjs tests/ai-document-export-service.test.mjs tests/ai-dock-export-integration.test.mjs tests/ai-dock-export-end-to-end-contract.test.mjs
      - name: Install pinned candidate renderer packages in CI only
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund --save-exact docx@9.5.1 pptxgenjs@3.12.0 pdf-lib@1.17.1
      - name: Validate real renderer package signatures
        run: node --test tests/ai-export-artifact-real-render.test.mjs
      - name: Prove text-only PPTX does not load image decoder
        run: node --test tests/ai-export-pptx-text-only-import.test.mjs
      - name: Generate isolated, exact-version renderer lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai-export-renderer-candidate
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = {
              name: "thebe-ai-export-renderer-review-candidate",
              version: "0.0.0",
              private: true,
              type: "module",
              engines: { node: ">=22" },
              dependencies: {
                docx: "9.5.1",
                "pdf-lib": "1.17.1",
                pptxgenjs: "3.12.0"
              }
            };
            fs.writeFileSync(".ai-export-renderer-candidate/package.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cd .ai-export-renderer-candidate
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          sha256sum package.json package-lock.json > package-sha256.txt
      - name: Check isolated renderer runtime advisories
        shell: bash
        run: |
          set -euo pipefail
          cd .ai-export-renderer-candidate
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Retain isolated renderer lock and advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-export-renderer-lock-candidate
          path: |
            .ai-export-renderer-candidate/package.json
            .ai-export-renderer-candidate/package-lock.json
            .ai-export-renderer-candidate/package-sha256.txt
            .ai-export-renderer-candidate/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
  alternative-dependency-candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Generate isolated package with proposed image-size replacement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai-export-renderer-alternative/server .ai-export-renderer-alternative/tests
          cp server/ai-document-renderer.js server/ai-document-export-model.js server/ai-export-artifact-signature.js .ai-export-renderer-alternative/server/
          cp tests/ai-export-artifact-real-render.test.mjs .ai-export-renderer-alternative/tests/
          node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync(".ai-export-renderer-alternative/package.json",JSON.stringify({
              name:"thebe-ai-renderer-security-evaluation-only",
              version:"0.0.0",private:true,type:"module",
              engines:{node:">=22"},
              dependencies:{docx:"9.5.1","pdf-lib":"1.17.1",pptxgenjs:"3.12.0"},
              overrides:{"image-size":"npm:image-size-next@2.1.0"}
            },null,2)+"\n");
          '
          cd .ai-export-renderer-alternative
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          sha256sum package.json package-lock.json > package-sha256.txt
      - name: Evaluate replacement advisories (not a production approval)
        shell: bash
        run: |
          set -euo pipefail
          cd .ai-export-renderer-alternative
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Test real PDF, DOCX and PPTX renderer against alternative graph
        run: node --test .ai-export-renderer-alternative/tests/ai-export-artifact-real-render.test.mjs
      - name: Retain evaluation-only alternative dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-export-renderer-alternative-candidate
          path: |
            .ai-export-renderer-alternative/package.json
            .ai-export-renderer-alternative/package-lock.json
            .ai-export-renderer-alternative/package-sha256.txt
            .ai-export-renderer-alternative/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
