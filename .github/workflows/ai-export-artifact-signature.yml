name: AI export artifact signature qualification
on:
  pull_request:
    paths:
      - 'server/ai-export-artifact-signature.js'
      - 'server/ai-document-export-service.js'
      - 'tests/ai-export-artifact-signature.test.mjs'
      - 'tests/ai-export-artifact-real-render.test.mjs'
      - '.github/workflows/ai-export-artifact-signature.yml'
permissions:
  contents: read
jobs:
  signature-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check server/ai-document-export-service.js
      - name: Validate structural OOXML/PDF admission and service regression
        run: node --test tests/ai-export-artifact-signature.test.mjs tests/ai-document-export-service.test.mjs tests/ai-dock-export-integration.test.mjs tests/ai-dock-export-end-to-end-contract.test.mjs
      - name: Install pinned candidate renderer packages in CI only
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund --save-exact docx@9.5.1 pptxgenjs@3.12.0 pdf-lib@1.17.1
      - name: Validate real renderer package signatures
        run: node --test tests/ai-export-artifact-real-render.test.mjs
