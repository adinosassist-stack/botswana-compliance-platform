name: AI export artifact signature qualification
on:
  pull_request:
    paths:
      - 'server/ai-export-artifact-signature.js'
      - 'server/ai-document-export-service.js'
      - 'tests/ai-export-artifact-signature.test.mjs'
      - '.github/workflows/ai-export-artifact-signature.yml'
permissions:
  contents: read
jobs:
  signature-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check server/ai-document-export-service.js
      - run: node --test tests/ai-export-artifact-signature.test.mjs tests/ai-document-export-service.test.mjs tests/ai-dock-export-integration.test.mjs tests/ai-export-persistence-composition.test.mjs
