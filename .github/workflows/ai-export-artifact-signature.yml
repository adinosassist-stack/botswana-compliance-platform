name: AI export artifact signature qualification
on:
  pull_request:
    paths:
      - 'server/ai-export-artifact-signature.js'
      - 'server/ai-document-export-service.js'
      - 'tests/ai-export-artifact-signature.test.mjs'
      - 'tests/ai-export-artifact-real-render.test.mjs'
      - 'tests/ai-export-pptx-text-only-import.test.mjs'
      - 'docs/ai-export-renderer-review-lock.sha256'
      - '.github/workflows/ai-export-artifact-signature.yml'
permissions:
  contents: read
jobs:
  signature-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check server/ai-document-export-service.js
      - name: Guard PDF/OOXML private file admission and service contracts
        run: node --test tests/ai-export-artifact-signature.test.mjs tests/ai-document-export-service.test.mjs tests/ai-dock-export-integration.test.mjs tests/ai-dock-export-end-to-end-contract.test.mjs
  renderer-supply-chain-candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Generate isolated renderer dependency graph for independent review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai-export-renderer-candidate/server .ai-export-renderer-candidate/tests
          cp server/ai-document-renderer.js server/ai-document-export-model.js server/ai-export-artifact-signature.js .ai-export-renderer-candidate/server/
          cp tests/ai-export-artifact-real-render.test.mjs tests/ai-export-pptx-text-only-import.test.mjs .ai-export-renderer-candidate/tests/
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = {
              name: "thebe-ai-export-renderer-review-candidate",
              version: "0.0.0",
              private: true,
              type: "module",
              engines: { node: ">=22" },
              dependencies: {
                docx: "9.5.1",
                "pdf-lib": "1.17.1",
                pptxgenjs: "3.12.0"
              },
              overrides: { "image-size": "npm:image-size-next@2.1.0" }
            };
            fs.writeFileSync(".ai-export-renderer-candidate/package.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cd .ai-export-renderer-candidate
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          # Match the independently captured candidate manifest and complete transitive lock graph.
          sha256sum -c ../docs/ai-export-renderer-review-lock.sha256
          npm ci --ignore-scripts --no-audit --no-fund
          sha256sum package.json package-lock.json > package-sha256.txt
      - name: Strict high-severity dependency audit of selected candidate
        shell: bash
        run: |
          set -euo pipefail
          cd .ai-export-renderer-candidate
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Validate real PDF DOCX and PPTX bytes with isolated candidate
        run: node --test .ai-export-renderer-candidate/tests/ai-export-artifact-real-render.test.mjs
      - name: Demonstrate text-only PowerPoint does not load image decoders
        run: node --test .ai-export-renderer-candidate/tests/ai-export-pptx-text-only-import.test.mjs
      - name: Retain exact renderer lockfile and security-advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-export-renderer-supply-chain-candidate
          path: |
            .ai-export-renderer-candidate/package.json
            .ai-export-renderer-candidate/package-lock.json
            .ai-export-renderer-candidate/package-sha256.txt
            .ai-export-renderer-candidate/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
