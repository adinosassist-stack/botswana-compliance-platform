name: Quotation Final HTML Private Browser Bundle Qualification
on:
  pull_request:
    paths:
      - 'deploy/quotation-final-html-private/**'
      - 'server/quotation-final-html-browser-run.mjs'
      - 'server/quotation-final-html-private-preview-host.mjs'
      - 'server/quotation-final-html-staging-bindings.mjs'
      - 'tests/quotation-final-html-staging-bindings.test.mjs'
      - 'tests/quotation-final-html-browser-package.test.mjs'
      - '.github/workflows/quotation-final-html-private-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/quotation-final-html-private/**'
      - 'server/quotation-final-html-browser-run.mjs'
      - 'server/quotation-final-html-private-preview-host.mjs'
      - 'server/quotation-final-html-staging-bindings.mjs'
      - 'tests/quotation-final-html-staging-bindings.test.mjs'
      - 'tests/quotation-final-html-browser-package.test.mjs'
      - '.github/workflows/quotation-final-html-private-bundle.yml'
permissions:
  contents: read
jobs:
  bundle-inert-private-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install immutable application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact Browser Run package into isolated runtime folder
        run: npm ci --prefix deploy/quotation-final-html-private --ignore-scripts --no-audit --no-fund
      - name: Assert source, lock and deny-all runtime
        run: |
          node --test tests/quotation-final-html-staging-bindings.test.mjs tests/quotation-final-html-browser-package.test.mjs tests/quotation-final-html-private-manifest.test.mjs
          node --check deploy/quotation-final-html-private/worker.mjs
      - name: Build immutable read-only quotation Worker evidence
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="$RUNNER_TEMP/quotation-final-html-review"
          mkdir -p "$REVIEW/compiled" "$REVIEW/metadata"
          npx --no-install wrangler deploy --dry-run --config deploy/quotation-final-html-private/wrangler.jsonc --outdir "$REVIEW/compiled"
          test -s "$REVIEW/compiled/worker.js"
          cp deploy/quotation-final-html-private/wrangler.jsonc "$REVIEW/metadata/wrangler.jsonc"
          cp deploy/quotation-final-html-private/package-lock.json "$REVIEW/metadata/package-lock.json"
          {
            echo "source_checkout_sha=$(git rev-parse HEAD)"
            echo "source_event=$GITHUB_EVENT_NAME"
            echo "worker_name=bw-quotation-final-html-private-staging"
            echo "scope=offline-review-only-no-cloudflare-upload-no-browser-execution"
          } > "$REVIEW/metadata/BUILD-REFERENCE.txt"
          (
            cd "$REVIEW"
            find compiled metadata -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/quotation-final-html-review.tar" compiled metadata SHA256SUMS
            sha256sum "$RUNNER_TEMP/quotation-final-html-review.tar" > TARBALL-SHA256.txt
          )
          echo 'Verified review bundle created offline. No Cloudflare writes or runtime calls.'
      - name: Retain exact private Worker bytes for independent review
        uses: actions/upload-artifact@v4
        with:
          name: quotation-final-html-private-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quotation-final-html-review/
            ${{ runner.temp }}/quotation-final-html-review.tar
          if-no-files-found: error
          retention-days: 7
