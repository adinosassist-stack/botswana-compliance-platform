name: POP isolated staging D1 discovery (read-only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: thebe-desk-production
      cancel-in-progress: false
    steps:
      - name: Verify staging D1 identity without mutation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" == "$EXPECTED_SHA" && "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ && -n "$CLOUDFLARE_API_TOKEN" ]]
          [[ "$PROD_D1_DATABASE_ID" == 8e6ae3fe-e7bc-4e98-a310-ce5dd85a3dce ]]
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const url=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database?per_page=100`;
          const response=await fetch(url,{method:'GET',redirect:'error',signal:AbortSignal.timeout(15000),headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,Accept:'application/json'}});
          if(!response.ok)throw Error('D1 list request failed: HTTP '+response.status);
          const data=await response.json();
          if(data.success!==true||!Array.isArray(data.result))throw Error('D1 listing unavailable');
          const matches=data.result.filter(x=>x.name==='bw-compliance-os-pop-staging');
          if(matches.length!==1)throw Error('Expected exactly one POP staging D1; observed '+matches.length);
          const db=matches[0];
          if(!/^[a-f0-9-]{36}$/i.test(db.uuid||'')||db.uuid.toLowerCase()===process.env.PROD_D1_DATABASE_ID.toLowerCase())throw Error('staging database identity invalid or equals production');
          console.log(JSON.stringify({kind:'pop_staging_d1_discovery_readonly',name:db.name,staging_uuid:db.uuid,distinct_from_production:true,production_contacted_for_mutation:false,staging_schema_verified:false,restore_rehearsed:false,mutation_performed:false}));
          NODE
