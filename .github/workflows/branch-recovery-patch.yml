name: Temporary recovery-link branch patch

on:
  push:
    branches:
      - chatgpt/production-recovery-smoke-1128

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/production-recovery-smoke-1128
          fetch-depth: 0

      - name: Apply exact recovery-link patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          worker = Path('cloudflare/src/worker.js')
          source = worker.read_text()
          old = 'const reset=new URL(publicApp);reset.search="";reset.hash=`reset_token=${encodeURIComponent(String(rawToken||""))}`;'
          new = 'const reset=new URL("/reset-password.html",publicApp);reset.search="";reset.hash=`reset_token=${encodeURIComponent(String(rawToken||""))}`;'
          if source.count(old) != 1:
              raise SystemExit(f'worker recovery-link anchor count was {source.count(old)}, expected exactly 1')
          worker.write_text(source.replace(old, new, 1))

          test = Path('tests/v78-12162-password-reset-email-runtime.mjs')
          source = test.read_text()
          old = "https://app.example/#reset_token=a%20b%26c"
          new = "https://app.example/reset-password.html#reset_token=a%20b%26c"
          if source.count(old) != 1:
              raise SystemExit(f'email runtime expectation anchor count was {source.count(old)}, expected exactly 1')
          test.write_text(source.replace(old, new, 1))
          PY

      - name: Prove patch before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/worker.js
          node --no-warnings tests/v78-12162-password-reset-email-runtime.mjs
          node tests/v78-12162-password-reset-email-delivery-adversarial.mjs
          grep -Fq 'new URL("/reset-password.html",publicApp)' cloudflare/src/worker.js
          ! grep -Fq 'https://app.example/#reset_token=' tests/v78-12162-password-reset-email-runtime.mjs

      - name: Commit guarded patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/branch-recovery-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/worker.js tests/v78-12162-password-reset-email-runtime.mjs .github/workflows/branch-recovery-patch.yml
          git diff --cached --check
          git commit -m 'fix: send password resets to reset page'
          git push origin HEAD:chatgpt/production-recovery-smoke-1128
