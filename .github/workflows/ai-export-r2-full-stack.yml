name: AI export R2 full-stack qualification
on:
  pull_request:
    paths:
      - 'tests/ai-export-r2-full-stack.test.mjs'
      - '.github/workflows/ai-export-r2-full-stack.yml'
permissions:
  contents: read
jobs:
  r2-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-export-r2-full-stack.test.mjs
