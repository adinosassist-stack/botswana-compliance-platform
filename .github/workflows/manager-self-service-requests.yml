name: Manager Self-Service Requests — Isolated Tests
on:
  pull_request:
    paths:
      - 'cloudflare/src/manager-access-requests-http.js'
      - 'cloudflare/src/manager-access-provisioning.js'
      - 'cloudflare/src/manager-request-codes.js'
      - 'cloudflare/src/manager-invitations-scoped-read.js'
      - 'cloudflare/src/worker.js'
      - 'cloudflare/wrangler.manager-invitations-functional-staging.toml'
      - 'db/drafts/manager-access-requests-self-service.sql'
      - 'public/js/auth-portal.js'
      - 'public/js/manager-access-request-entry.js'
      - 'public/js/manager-invite-owner-entry.js'
      - 'public/manager-invite/request/**'
      - 'tests/manager-access-requests-http.test.mjs'
      - 'tests/manager-request-ui-runtime.test.mjs'
      - 'tests/manager-access-provisioning.test.mjs'
      - 'tests/manager-request-codes-external.test.mjs'
      - 'tests/manager-registered-external-sqlite.test.mjs'
      - '.github/workflows/manager-self-service-requests.yml'
permissions:
  contents: read
jobs:
  requests-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated HTTP permissions and owner-review tests
        run: |
          node --test tests/manager-request-ui-runtime.test.mjs
          node --test tests/manager-registered-external-sqlite.test.mjs tests/manager-request-codes-external.test.mjs tests/manager-access-requests-http.test.mjs tests/manager-access-provisioning.test.mjs tests/manager-invitations-functional-staging-config.test.mjs tests/manager-invitations-scoped-read.test.mjs
          node --check cloudflare/src/manager-access-requests-http.js
          node --check cloudflare/src/manager-access-provisioning.js
          node --check cloudflare/src/manager-request-codes.js
          node --check cloudflare/src/worker.js
          node --check public/js/auth-portal.js
          node --check public/js/manager-access-request-entry.js
          node --check public/js/manager-invite-owner-entry.js
