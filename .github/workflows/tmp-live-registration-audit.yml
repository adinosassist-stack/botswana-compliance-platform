name: Temporary live registration audit

on:
  push:
    branches:
      - fix/registration-ui-navigation-owner-20260914

permissions:
  contents: read

jobs:
  audit:
    name: Audit live registration without creating an account
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/registration-ui-navigation-owner-20260914
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify live registration proof and transport boundary
        run: node scripts/tmp-live-registration-audit.mjs
      - name: Inspect production D1 registration prerequisites read-only
        run: node scripts/tmp-live-registration-d1-audit.mjs
