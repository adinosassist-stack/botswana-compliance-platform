name: Manager Standalone First Version - Protected Undeployed Only

on:
  pull_request:
    paths:
      - 'scripts/manager-standalone-protected-runner.py'
      - 'scripts/prepare-manager-standalone-first-version.py'
      - 'scripts/verify-manager-exact-staging-artifacts.py'
      - 'scripts/manager-standalone-first-version-dryrun.py'
      - 'scripts/manager-standalone-inert-version-transport.py'
      - 'tests/test_manager_standalone_protected_runner.py'
      - '.github/workflows/manager-standalone-protected-first-version.yml'
  workflow_dispatch:
    inputs:
      authorization:
        description: 'APPROVE_MANAGER_STANDALONE_FIRST_VERSION_ONLY_NO_DEPLOY'
        required: true
        type: string
      exact_main_sha:
        description: 'Owner and thusico approved exact current main SHA'
        required: true
        type: string
      asset_manifest_sha256:
        description: 'Immutable 278-asset manifest SHA-256'
        required: true
        type: string
      owner_approval_comment_id:
        description: 'Owner comment on issue #2599'
        required: true
        type: string
      reviewer_approval_comment_id:
        description: 'Independent thusico comment on issue #2599'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: manager-standalone-first-version-one-shot
  cancel-in-progress: false

jobs:
  offline-contract-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test deny-by-default adapter without any network calls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/manager-standalone-protected-runner.py scripts/prepare-manager-standalone-first-version.py
          python3 -m unittest discover -s tests -p 'test_manager_standalone_protected_runner.py' -v

  offline-artifact-preflight:
    # PR-only test of the REAL signed immutable ZIPs. No staging credentials,
    # no Cloudflare token, no protected environment and no Worker writes.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact source-approved artifacts (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manager-originals"
          for ID in 14407666400 14407970936; do
            curl --fail --silent --show-error --location --retry 2 \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
              --output "$RUNNER_TEMP/manager-originals/$ID.zip"
          done
      - name: Full immutable verify, isolated preparation, qualification and dry run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-manager-exact-staging-artifacts.py \
            --worker "$RUNNER_TEMP/manager-originals/14407666400.zip" \
            --assets "$RUNNER_TEMP/manager-originals/14407970936.zip" \
            --report "$RUNNER_TEMP/manager-verified.json"
          python3 scripts/prepare-manager-standalone-first-version.py \
            --worker "$RUNNER_TEMP/manager-originals/14407666400.zip" \
            --assets "$RUNNER_TEMP/manager-originals/14407970936.zip" \
            --target "$RUNNER_TEMP/manager-standalone"
          python3 scripts/manager-standalone-offline-qualification.py \
            --prepared-artifacts "$RUNNER_TEMP/manager-standalone" \
            --report "$RUNNER_TEMP/manager-qualified.json"
          python3 scripts/manager-standalone-first-version-dryrun.py \
            --prepared-artifacts "$RUNNER_TEMP/manager-standalone" \
            --report "$RUNNER_TEMP/manager-dryrun.json"
          python3 - "$RUNNER_TEMP/manager-standalone" "$RUNNER_TEMP/manager-dryrun.json" <<'PY'
          import json, sys
          from pathlib import Path
          pkg = Path(sys.argv[1])
          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert report["manifest_sha256"] == "2b06f615812022db4a5d2ace49bce433cb1929d25ebde37228dc88d5325f3f6e"
          assert report["account_id"] == "f585813fa376f7c71c7d4a79254168fa"
          assert report["database_id"] == "1a2fc702-2592-491c-9f55-80e032a56dd8"
          assert (pkg / "cloudflare/wrangler.manager-standalone-account-staging.toml").is_file()
          assert not (pkg / "cloudflare/wrangler.manager-invitations-functional-staging.toml").exists()
          assert report["expected_no_ingress"]["deployments"] == 0
          assert report["status"] == "REVIEW_ONLY_NO_LIVE_EXECUTION"
          PY
          echo 'PR-only real-artifact qualification PASS: no Cloudflare requests or writes'

  protected-first-version:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: manager-private-version-only-protected
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact owner dispatch before reading any Worker secrets
        env:
          INPUT_AUTH: ${{ inputs.authorization }}
          INPUT_SHA: ${{ inputs.exact_main_sha }}
          INPUT_MANIFEST: ${{ inputs.asset_manifest_sha256 }}
          OWNER_ID: ${{ inputs.owner_approval_comment_id }}
          REVIEWER_ID: ${{ inputs.reviewer_approval_comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'adinosassist-stack/botswana-compliance-platform'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_ACTOR" = 'adinosassist-stack'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$INPUT_SHA"
          test "$INPUT_AUTH" = 'APPROVE_MANAGER_STANDALONE_FIRST_VERSION_ONLY_NO_DEPLOY'
          test "$INPUT_MANIFEST" = '2b06f615812022db4a5d2ace49bce433cb1929d25ebde37228dc88d5325f3f6e'
          [[ "$OWNER_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWER_ID" =~ ^[1-9][0-9]*$ ]]
          test "$OWNER_ID" != "$REVIEWER_ID"
          test "$GITHUB_WORKFLOW_REF" = \
            'adinosassist-stack/botswana-compliance-platform/.github/workflows/manager-standalone-protected-first-version.yml@refs/heads/main'
      - name: Download exact original two reviewed immutable GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manager-artifacts"
          for ID in 14407666400 14407970936; do
            curl --fail --silent --show-error --location --retry 2 \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
              --output "$RUNNER_TEMP/manager-artifacts/$ID.zip"
          done
      - name: Verify exact Worker, static files, isolated config, manifest checksum
        env:
          APPROVED_MANIFEST: ${{ inputs.asset_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-manager-exact-staging-artifacts.py \
            --worker "$RUNNER_TEMP/manager-artifacts/14407666400.zip" \
            --assets "$RUNNER_TEMP/manager-artifacts/14407970936.zip" \
            --report "$RUNNER_TEMP/manager-artifact-verify.json"
          python3 scripts/prepare-manager-standalone-first-version.py \
            --worker "$RUNNER_TEMP/manager-artifacts/14407666400.zip" \
            --assets "$RUNNER_TEMP/manager-artifacts/14407970936.zip" \
            --target "$RUNNER_TEMP/manager-first-version-only"
          python3 scripts/manager-standalone-offline-qualification.py \
            --prepared-artifacts "$RUNNER_TEMP/manager-first-version-only" \
            --report "$RUNNER_TEMP/manager-standalone-qualified.json"
          python3 scripts/manager-standalone-first-version-dryrun.py \
            --prepared-artifacts "$RUNNER_TEMP/manager-first-version-only" \
            --report "$RUNNER_TEMP/manager-first-version-plan.json"
          python3 - "$RUNNER_TEMP/manager-first-version-plan.json" "$APPROVED_MANIFEST" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              plan = json.load(handle)
          assert plan["status"] == "REVIEW_ONLY_NO_LIVE_EXECUTION"
          assert plan["manifest_sha256"] == sys.argv[2]
          assert plan["account_id"] == "f585813fa376f7c71c7d4a79254168fa"
          assert plan["database_id"] == "1a2fc702-2592-491c-9f55-80e032a56dd8"
          assert plan["assets_count"] == 278
          PY
      - name: Check two independent GitHub approvals and upload ONLY an undeployed first version
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: f585813fa376f7c71c7d4a79254168fa
          MANAGER_STAGING_EXECUTION_MODE: FIRST_VERSION_ONLY_NO_DEPLOY
          MANAGER_STANDALONE_WORKER_TOKEN: ${{ secrets.MANAGER_STANDALONE_WORKER_TOKEN }}
          INPUT_SHA: ${{ inputs.exact_main_sha }}
          INPUT_MANIFEST: ${{ inputs.asset_manifest_sha256 }}
          OWNER_ID: ${{ inputs.owner_approval_comment_id }}
          REVIEWER_ID: ${{ inputs.reviewer_approval_comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manager-standalone-protected-runner.py \
            --prepared-artifacts "$RUNNER_TEMP/manager-first-version-only" \
            --source-sha "$INPUT_SHA" \
            --manifest-sha256 "$INPUT_MANIFEST" \
            --owner-comment-id "$OWNER_ID" \
            --reviewer-comment-id "$REVIEWER_ID" \
            --execute-approved

# The EXISTING environment manager-private-version-only-protected must be
# independently verified to require thusico approval and prevent self-review.
# Never dispatch before exact source + manifest authorization on issue #2599.
# No deployed version, DNS, Worker route, Access app or production operation.
