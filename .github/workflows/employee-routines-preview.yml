name: Employee Routines Preview Tests
on:
  pull_request:
    paths:
      - 'server/employee-routines-preview.js'
      - 'server/employee-routines-service.js'
      - 'server/employee-workflow-definitions.js'
      - 'server/employee-workflow-review-gate.js'
      - 'server/employee-proposal-provenance.js'
      - 'cloudflare/migrations/20261022_employee_ai_proposal_provenance.sql'
      - 'tests/employee-proposal-provenance.test.mjs'
      - 'tests/employee-proposal-provenance-d1.test.mjs'
      - 'tests/employee-proposal-provenance-workerd.test.mjs'
      - 'tests/helpers/employee-provenance-d1.mjs'
      - 'cloudflare/src/employee-proposal-review-d1-store.js'
      - 'cloudflare/src/employee-proposal-review-api.js'
      - 'cloudflare/src/employee-workflow-review-generation.js'
      - 'tests/employee-workflow-review-generation.test.mjs'
      - 'tests/employee-proposal-review-api.test.mjs'
      - 'tests/employee-proposal-review-worker-wiring.test.mjs'
      - 'cloudflare/migrations/20261021_employee_ai_proposal_reviews.sql'
      - 'tests/employee-proposal-review-d1-store.test.mjs'
      - 'tests/employee-proposal-review-d1-migration-execution.test.mjs'
      - 'server/employee-workflow-ownership-service.js'
      - 'server/employee-workflow-postgres-store.js'
      - 'server/employee-workflow-handlers.js'
      - 'cloudflare/src/employee-workflow-d1-store.js'
      - 'cloudflare/src/employee-workflow-api.js'
      - 'cloudflare/src/worker.js'
      - 'public/employee-workflow-panel.js'
      - 'public/employee-proposal-review-panel.js'
      - 'public/js/employee-workflow-people-loader.js'
      - 'public/js/workspace-runtime-20261001b.js'
      - 'cloudflare/migrations/20261021_employee_ai_workflows.sql'
      - 'db/migrations/20261021_employee_ai_workflows.sql'
      - 'public/employee-workflow-builder.js'
      - 'tests/employee-routines-preview.test.mjs'
      - 'tests/employee-routines-service.test.mjs'
      - 'tests/employee-workflow-definitions.test.mjs'
      - 'tests/employee-workflow-review-gate.test.mjs'
      - 'tests/employee-workflow-ownership-service.test.mjs'
      - 'tests/employee-workflow-postgres-store.test.mjs'
      - 'tests/employee-workflow-migration.test.mjs'
      - 'tests/employee-workflow-handlers.test.mjs'
      - 'tests/employee-workflow-d1-store.test.mjs'
      - 'tests/employee-workflow-cloudflare-api.test.mjs'
      - 'tests/employee-workflow-worker-wiring.test.mjs'
      - 'tests/employee-workflow-people-mount.test.mjs'
      - 'tests/employee-workflow-d1-migration-execution.test.mjs'
      - 'tests/employee-workflow-builder.test.mjs'
      - '.github/workflows/employee-routines-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  employee-routines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependencies for local D1 verification
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Employee routine preview tests
        run: node --test tests/employee-routines-preview.test.mjs tests/employee-routines-service.test.mjs tests/employee-workflow-definitions.test.mjs tests/employee-workflow-review-gate.test.mjs tests/employee-proposal-review-d1-store.test.mjs tests/employee-proposal-review-d1-migration-execution.test.mjs tests/employee-proposal-review-api.test.mjs tests/employee-workflow-review-generation.test.mjs tests/employee-proposal-review-worker-wiring.test.mjs tests/employee-workflow-builder.test.mjs tests/employee-workflow-ownership-service.test.mjs tests/employee-workflow-postgres-store.test.mjs tests/employee-workflow-migration.test.mjs tests/employee-workflow-handlers.test.mjs tests/employee-workflow-d1-store.test.mjs tests/employee-workflow-cloudflare-api.test.mjs tests/employee-workflow-worker-wiring.test.mjs tests/employee-workflow-people-mount.test.mjs tests/employee-workflow-d1-migration-execution.test.mjs
      - name: Immutable proposal provenance and real SQLite binding tests
        run: node --test tests/employee-proposal-provenance.test.mjs tests/employee-proposal-provenance-d1.test.mjs
      - name: Actual local workerd D1 batch contract
        run: node --test tests/employee-proposal-provenance-workerd.test.mjs
