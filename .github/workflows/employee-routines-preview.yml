name: Employee Routines Preview Tests
on:
  pull_request:
    paths:
      - 'server/employee-routines-preview.js'
      - 'tests/employee-routines-preview.test.mjs'
      - '.github/workflows/employee-routines-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  employee-routines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Employee routine preview tests
        run: node --test tests/employee-routines-preview.test.mjs
