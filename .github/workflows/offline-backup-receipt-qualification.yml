name: Offline backup receipt cadence qualification
on:
  pull_request:
    paths:
      - scripts/assess-offline-backup-receipts.mjs
      - tests/assess-offline-backup-receipts.test.mjs
      - .github/workflows/offline-backup-receipt-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate untrusted receipt cadence without Cloudflare access
        run: node --test tests/assess-offline-backup-receipts.test.mjs
