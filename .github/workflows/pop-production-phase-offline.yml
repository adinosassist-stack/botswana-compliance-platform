name: POP 070-071 production phase qualification (offline only)
on:
  pull_request:
    paths:
      - scripts/qualify-pop-production-phase-offline.mjs
      - tests/pop-production-phase-offline.test.mjs
      - docs/proposals/POP_PRODUCTION_070_071_PROTECTED_HANDOFF_20261103.md
      - .github/workflows/pop-production-phase-offline.yml
permissions:
  contents: read
jobs:
  qualify:
    name: POP production phased no-write qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test 070 and 071 static qualification
        run: |
          node --check scripts/qualify-pop-production-phase-offline.mjs
          node --test tests/pop-production-phase-offline.test.mjs
      - name: Record immutable boundary
        run: echo 'Offline only. No Cloudflare credentials, no remote SQL, no production writes or migration authority.' >> "$GITHUB_STEP_SUMMARY"
