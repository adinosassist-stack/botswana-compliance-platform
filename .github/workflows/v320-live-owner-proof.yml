name: V320 live owner production proof
run-name: V320 live owner proof ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    paths:
      - 'scripts/production-v320-owner-proof.mjs'
      - '.github/workflows/v320-live-owner-proof.yml'

permissions:
  contents: read

concurrency:
  group: v320-live-owner-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Syntax check
        run: node --check scripts/production-v320-owner-proof.mjs
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser client
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Require signed synthetic lifecycle credentials
        run: |
          set -euo pipefail
          test "${#AUDIT_INTEGRITY_SECRET}" -ge 32 || { echo 'AUDIT_INTEGRITY_SECRET missing or too short' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'CLOUDFLARE_ACCOUNT_ID invalid' >&2; exit 1; }
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'D1_DATABASE_ID invalid' >&2; exit 1; }
      - name: Run signed V320 live owner proof
        run: node scripts/production-v320-owner-proof.mjs
