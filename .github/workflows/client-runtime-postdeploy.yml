name: Thebe Desk Client Runtime Post-Deploy
run-name: Client runtime post-deploy ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Production Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: thebe-desk-client-runtime-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  proof:
    name: Prove browser loaded exact API client
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUDIT_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUDIT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main and deploy authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid AUDIT_SHA=$AUDIT_SHA" >&2; exit 1; }
          target="$(git rev-parse HEAD)"
          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$target" == "$AUDIT_SHA" ]] || { echo "checkout mismatch target=$target expected=$AUDIT_SHA" >&2; exit 1; }
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale runtime proof target=$target current-main=$main_sha" >&2; exit 1; }
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo 'deploy trigger was not successful' >&2; exit 1; }
          [[ "${{ github.event.workflow_run.head_sha }}" == "$AUDIT_SHA" ]] || { echo 'deploy trigger SHA mismatch' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies and browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Prove exact browser API client runtime
        shell: bash
        run: node scripts/production-client-runtime-proof.mjs
