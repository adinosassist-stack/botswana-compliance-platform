name: Thebe Desk Exact Post-Deploy Smoke
run-name: Post-deploy smoke ${{ github.event.workflow_run.head_sha || inputs.expected_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thebe-desk-postdeploy-${{ github.event.workflow_run.head_sha || inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify exact deployed release without customer writes
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha }}
      ORIGIN: https://thebedesk.com

    steps:
      - name: Checkout exact deployed authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployment authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid EXPECTED_SHA=$EXPECTED_SHA" >&2; exit 1; }
          target="$(git rev-parse HEAD)"
          [[ "$target" == "$EXPECTED_SHA" ]] || { echo "checkout mismatch target=$target expected=$EXPECTED_SHA" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo 'refusing non-success deployment trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]] || { echo 'refusing non-main deployment trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_sha }}" == "$EXPECTED_SHA" ]] || { echo 'workflow_run SHA mismatch' >&2; exit 1; }
          fi
          git cat-file -e "$EXPECTED_SHA^{commit}"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$main_sha" == "$EXPECTED_SHA" ]] || { echo "main authority mismatch main=$main_sha expected=$EXPECTED_SHA" >&2; exit 1; }
          echo "Exact deployed release authority confirmed: $EXPECTED_SHA"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify live HTTP and fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const origin=process.env.ORIGIN;
          const entrySource=fs.readFileSync('cloudflare/src/agentic-entry.js','utf8');
          const schemaMatch=entrySource.match(/const V81_SCHEMA_DELTA="([^"]+)"/);
          assert.ok(schemaMatch?.[1],'agentic schema delta source-of-truth missing');
          const expectedSchemaDelta=schemaMatch[1];
          const get=path=>fetch(origin+path,{redirect:'manual',headers:{accept:'application/json,text/html;q=0.9,*/*;q=0.8','user-agent':'ThebeDesk-PostDeploy-Smoke/1.0'}});

          const root=await get('/');
          assert.equal(root.status,200);
          const html=await root.text();
          assert.match(html,/See business risk before it becomes a penalty, dispute or loss\./i);
          assert.doesNotMatch(html,/id="appShell"/i);
          assert.doesNotMatch(html,/id="authForm"/i);
          assert.equal(root.headers.get('x-thebe-surface'),'public');
          assert.match(String(root.headers.get('strict-transport-security')||''),/max-age=\d+/);
          assert.equal(String(root.headers.get('x-content-type-options')||'').toLowerCase(),'nosniff');
          assert.equal(String(root.headers.get('x-frame-options')||'').toUpperCase(),'DENY');
          assert.match(String(root.headers.get('content-security-policy')||''),/default-src 'self'/);
          console.log('PASS public-only root + security headers');

          const auth=await get('/auth/');
          assert.equal(auth.status,200);assert.equal(auth.headers.get('x-thebe-surface'),'auth');assert.match(String(auth.headers.get('x-robots-tag')||''),/noindex/i);
          const authHtml=await auth.text();assert.match(authHtml,/id="authForm"/);assert.doesNotMatch(authHtml,/id="appShell"/);
          console.log('PASS isolated auth surface');

          const app=await get('/app/');
          assert.equal(app.status,302);assert.match(String(app.headers.get('location')||''),/\/auth\//);assert.match(String(app.headers.get('location')||''),/next=/);
          console.log('PASS anonymous app redirects to isolated auth surface');

          const live=await get('/api/live');
          assert.equal(live.status,200); assert.equal((await live.json()).ok,true);
          console.log('PASS /api/live');

          const ready=await get('/api/ready');
          assert.equal(ready.status,200);
          const readiness=await ready.json();
          for(const key of ['ok','d1','r2','schemaReady','requiredConfigReady','coreSchemaReady','agenticAuthoritySchemaReady'])assert.equal(readiness[key],true,`readiness ${key}`);
          assert.equal(readiness.latestSchemaDelta,expectedSchemaDelta);
          console.log(`PASS /api/ready version=${readiness.version} latestSchema=${readiness.latestSchemaDelta}`);

          const proof=await fetch(origin+'/api/auth/registration-proof/challenge',{method:'POST',redirect:'manual',headers:{accept:'application/json','content-type':'application/json',origin,'user-agent':'ThebeDesk-PostDeploy-Smoke/1.0'},body:'{}'});
          assert.equal(proof.status,200);
          const proofBody=await proof.json();
          assert.equal(proofBody.provider,'thebe_proof'); assert.equal(proofBody.required,true); assert.equal(proofBody.action,'register');
          assert.ok(typeof proofBody.token==='string'&&proofBody.token.length>=80&&proofBody.token.includes('.'));
          assert.ok(Number.isInteger(proofBody.difficulty)&&proofBody.difficulty>=8&&proofBody.difficulty<=16);
          assert.ok(Number.isInteger(proofBody.expiresInSeconds)&&proofBody.expiresInSeconds>=60&&proofBody.expiresInSeconds<=600);
          console.log('PASS first-party registration proof');

          const providers={google:'accounts.google.com',facebook:'www.facebook.com'};
          for(const [provider,host] of Object.entries(providers)){
            const response=await get(`/api/auth/oauth/${provider}/start`);
            if(response.status===503){
              assert.equal(response.headers.get('location'),null);
              console.log(`PASS ${provider} OAuth deferred/fail-closed`);
            }else{
              assert.ok(response.status>=300&&response.status<400,`${provider} OAuth unexpected HTTP ${response.status}`);
              const location=response.headers.get('location'); assert.ok(location,`${provider} OAuth redirect missing`);
              const url=new URL(location); assert.equal(url.protocol,'https:'); assert.equal(url.hostname,host);
              console.log(`PASS ${provider} OAuth configured redirect`);
            }
          }

          const authority=await get('/api/agentic/authority/status');
          assert.equal(authority.status,401); assert.equal((await authority.json()).error,'unauthenticated');
          console.log('PASS V81 delegated-authority authentication boundary');

          const liveVoice=await get('/api/agentic/live/status');
          assert.equal(liveVoice.status,401); assert.equal((await liveVoice.json()).error,'unauthenticated');
          console.log('PASS GPT-Live voice authentication boundary');

          for(const path of ['/robots.txt','/sitemap.xml','/manifest.webmanifest']){
            const response=await get(path); assert.equal(response.status,200,`${path} HTTP ${response.status}`);
          }
          console.log('PASS public SEO/PWA endpoints');
          NODE

      - name: Install browser driver only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Exercise live customer UI without submitting customer data
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
          assert.ok(executablePath,'no Chromium-compatible browser found');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await context.newPage();
          const pageErrors=[]; const criticalFailures=[]; const popupUrls=[];
          page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
          page.on('requestfailed',request=>{const url=request.url();if(url.startsWith(process.env.ORIGIN+'/js/')||url.startsWith(process.env.ORIGIN+'/assets/'))criticalFailures.push(`${request.method()} ${url} ${request.failure()?.errorText||''}`)});
          page.on('popup',popup=>popupUrls.push(popup.url()));

          await page.goto(process.env.ORIGIN+'/',{waitUntil:'networkidle',timeout:45000});
          assert.match(await page.title(),/Thebe Desk/i);
          const rootState=await page.evaluate(()=>({hero:(document.querySelector('.hero h1')?.textContent||'').trim(),app:!!document.getElementById('appShell'),auth:!!document.getElementById('authForm'),role:!!document.getElementById('roleAccessPortal')}));
          assert.match(rootState.hero,/business risk/i);assert.equal(rootState.app,false);assert.equal(rootState.auth,false);assert.equal(rootState.role,false);
          await page.waitForTimeout(600);
          assert.equal(context.pages().length,1,'desktop startup must not create extra tabs/windows');
          assert.deepEqual(popupUrls,[],'desktop startup must not create popups');
          const persistentWorkers=await page.evaluate(async()=>typeof navigator.serviceWorker?.getRegistrations==='function'?(await navigator.serviceWorker.getRegistrations()).length:0);
          assert.equal(persistentWorkers,0,'desktop startup must leave no persistent service-worker registration');
          console.log('PASS public homepage is independent of auth/workspace runtime');

          const start=page.locator('a.marketing-start-action').first();assert.ok(await start.count());await start.click();
          await page.waitForURL(url=>url.pathname==='/auth/'&&url.searchParams.get('mode')==='register',{timeout:10000});
          await page.waitForSelector('#authForm',{state:'visible',timeout:10000});
          assert.equal(await page.locator('#appShell').count(),0);console.log('PASS Start Free -> dedicated registration surface');

          await page.goto(process.env.ORIGIN+'/',{waitUntil:'domcontentloaded',timeout:30000});
          const signIn=page.getByRole('link',{name:/Sign in/i}).first();assert.ok(await signIn.count());await signIn.click();
          await page.waitForURL(url=>url.pathname==='/auth/'&&url.searchParams.get('mode')==='login',{timeout:10000});
          assert.ok(await page.locator('#authForm').count());assert.equal(await page.locator('#appShell').count(),0);console.log('PASS Sign in -> dedicated auth surface');

          const anonymous=await browser.newContext({viewport:{width:1200,height:900}});const anonymousPage=await anonymous.newPage();
          await anonymousPage.goto(process.env.ORIGIN+'/app/',{waitUntil:'domcontentloaded',timeout:30000});
          await anonymousPage.waitForURL(url=>url.pathname==='/auth/'&&url.searchParams.get('next')?.startsWith('/app/'),{timeout:10000});
          assert.ok(await anonymousPage.locator('#authForm').count());await anonymous.close();console.log('PASS anonymous workspace is server-routed to auth');

          await page.goto(process.env.ORIGIN+'/',{waitUntil:'domcontentloaded',timeout:30000});
          const seePlans=page.getByRole('link',{name:/See plans/i}).first();assert.ok(await seePlans.count());await seePlans.click();await page.waitForTimeout(250);
          const pricing=await page.evaluate(()=>({scrollY:Math.round(scrollY),top:Math.round(document.getElementById('pricing')?.getBoundingClientRect().top||9999)}));assert.ok(Math.abs(pricing.top)<700||pricing.scrollY>0);console.log('PASS See plans navigation');

          await page.goto(process.env.ORIGIN+'/register-direct.html',{waitUntil:'domcontentloaded',timeout:45000});const body=(await page.locator('body').innerText()).slice(0,800);assert.match(body,/Create your account/i);
          console.log('PASS direct registration page');
          assert.deepEqual(pageErrors,[]);assert.deepEqual(criticalFailures,[]);
          await browser.close();console.log('POSTDEPLOY_SMOKE_PASS');
          NODE
