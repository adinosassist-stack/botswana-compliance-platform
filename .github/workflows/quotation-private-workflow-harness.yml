name: Quotation private Workflow harness — offline security tests
on:
  pull_request:
    paths:
      - 'server/quotation-private-workflow-harness.mjs'
      - 'deploy/quotation-private-workflow-harness/**'
      - 'tests/quotation-private-workflow-*.test.mjs'
      - 'docs/quotation-private-workflow-rehearsal.md'
      - '.github/workflows/quotation-private-workflow-harness.yml'
permissions:
  contents: read
jobs:
  private-harness-static-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline harness isolation and negative tests
        run: node --test tests/quotation-private-workflow-harness.test.mjs tests/quotation-private-workflow-runtime.test.mjs
