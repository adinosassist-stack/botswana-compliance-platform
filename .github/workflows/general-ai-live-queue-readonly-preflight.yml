name: General AI live Queue read-only preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/general-ai-live-queue-readonly-preflight.mjs'
      - 'cloudflare/wrangler.general-ai-private-consumer.toml'
      - 'cloudflare/src/general-ai-private-queue-d1-entry.review.js'
      - 'cloudflare/src/general-ai-queue-acceptance.js'
      - 'cloudflare/src/general-ai-private-queue-d1-ledger.js'
      - '.github/workflows/general-ai-live-queue-readonly-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert Queue is inert and staging-only
        run: node scripts/general-ai-live-queue-readonly-preflight.mjs
