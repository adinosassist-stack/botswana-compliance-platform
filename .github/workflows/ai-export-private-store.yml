name: AI export private-store qualification
on:
  pull_request:
    paths:
      - 'server/ai-document-export-private-store.js'
      - 'tests/ai-document-export-private-store.test.mjs'
      - '.github/workflows/ai-export-private-store.yml'
permissions:
  contents: read
jobs:
  private-store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-document-export-private-store.test.mjs
