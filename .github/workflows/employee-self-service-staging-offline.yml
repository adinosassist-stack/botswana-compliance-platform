name: Employee self-service isolated staging offline gates
on:
  pull_request:
    paths:
      - 'cloudflare/wrangler.employee-self-service-staging.toml'
      - 'cloudflare/src/employee-self-service-staging-entry.js'
      - 'scripts/employee-self-service-staging-preflight.mjs'
      - 'tests/employee-self-service-staging-boundary.test.mjs'
      - 'cloudflare/src/employee-self-service.js'
      - 'tests/employee-self-service-runtime.test.mjs'
      - '.github/workflows/employee-self-service-staging-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Confirm staging is inert, isolated, and route-free
        run: node scripts/employee-self-service-staging-preflight.mjs
      - name: Verify deny-by-default Worker and staff lifecycle
        run: |
          node --test tests/employee-self-service-staging-boundary.test.mjs
          npm run test:employee-self-service
      - name: Verify no production Cloudflare write or deployment was invoked
        run: |
          test "$(grep -c '^workers_dev = false$' cloudflare/wrangler.employee-self-service-staging.toml)" = 1
          test "$(grep -c '^preview_urls = false$' cloudflare/wrangler.employee-self-service-staging.toml)" = 1
          if grep -E '^\[\[routes\]\]|^\[assets\]|^\[triggers\]' cloudflare/wrangler.employee-self-service-staging.toml; then exit 1; fi
