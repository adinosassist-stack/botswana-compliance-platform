name: Agent cost remote D1 one-shot qualification
run-name: Remote D1 one-shot qualification ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'operations/agent-cost-remote-d1-qualification-trigger.json'

permissions:
  contents: read

concurrency:
  group: thebe-agent-cost-remote-d1-one-shot
  cancel-in-progress: false

jobs:
  qualify:
    name: Prove remote D1 accounting on disposable database
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[run-agent-cost-remote-d1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout immutable qualification authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected one-shot authority
        env:
          PRODUCTION_D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'push' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_ACTOR" == 'adinosassist-stack' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          [[ -n "$PRODUCTION_D1_DATABASE_ID" ]]
          python3 - <<'PY'
          import json
          data=json.load(open('operations/agent-cost-remote-d1-qualification-trigger.json',encoding='utf-8'))
          assert data.get('schema') == 1, 'invalid trigger schema'
          assert data.get('requested') is True, 'qualification was not explicitly requested'
          assert data.get('purpose') == 'qualify-agent-cost-on-disposable-remote-d1', 'unexpected purpose'
          assert data.get('safety') == 'create and delete disposable remote D1 only; refuse production D1; no deployment or production activation', 'unexpected safety contract'
          print('One-shot disposable remote D1 qualification authority validated.')
          PY

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Prove reviewed remote-D1 safety contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qualify-agent-cost-remote-d1.mjs
          node tests/agent-cost-remote-d1-qualification-static.mjs

      - name: Qualify migration 068 on disposable remote D1
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          EXPECTED_SOURCE_SHA256: e5f3db240dc9d18f3625fd63a0c680b15f46d2fffe3697f98c38476d962dd7df
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION_STATE_FILE: .agent-cost-remote-d1-state.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qualify-agent-cost-remote-d1.mjs

      - name: Enforce disposable D1 cleanup
        if: always()
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION_STATE_FILE: .agent-cost-remote-d1-state.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qualify-agent-cost-remote-d1.mjs --cleanup-only
