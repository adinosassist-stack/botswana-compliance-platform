name: Temporary V286 migration-tip sync

on:
  push:
    branches:
      - chatgpt/customer-relationship-foundation-20261007

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[tip-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/customer-relationship-foundation-20261007
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Advance migration tip coherently
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tmp-v286-advance-migration-tip.mjs
          git diff --check
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'No migration-tip changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_PROFILE.json cloudflare/README.md cloudflare/deploy-free.sh cloudflare/src/agentic-entry.js docs/LAUNCH.md tests
          git commit -m '[tip-sync] V286 advance Cloudflare migration tip'
          git push origin HEAD:chatgpt/customer-relationship-foundation-20261007
