name: Offline isolated versioned restore safety
on:
  pull_request:
    paths:
      - scripts/plan-isolated-versioned-restore-offline.mjs
      - tests/plan-isolated-versioned-restore-offline.test.mjs
      - .github/workflows/isolated-versioned-restore-offline.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reject unsafe restore targets without network access
        run: node --test tests/plan-isolated-versioned-restore-offline.test.mjs
