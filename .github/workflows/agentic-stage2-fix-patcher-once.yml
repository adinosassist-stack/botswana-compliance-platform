name: Fix Agentic Stage 2 patcher once
on:
  push:
    branches:
      - chatgpt/agentic-stage2-observe-outcomes-20260913
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/agentic-stage2-patch-once.yml')
          s=p.read_text()
          old='schema.write_text(schema_text.rstrip()+"\\n\\n"+migration+"\\n")'
          new='schema.write_text(schema_text.rstrip()+"\\n\\n"+migration.rstrip()+"\\n")'
          if old not in s: raise SystemExit('schema formatting expression not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/agentic-stage2-fix-patcher-once.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: normalize Stage 2 schema patch formatting"
          git push origin HEAD:chatgpt/agentic-stage2-observe-outcomes-20260913
