name: Normalize registration UI cache successor

on:
  push:
    branches:
      - fix/registration-ui-navigation-owner-20260914

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/registration-ui-navigation-owner-20260914
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Normalize remaining historical assertions
        run: node scripts/normalize-registration-ui-cache-successor.mjs
      - name: Verify all changed tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            node "$file"
          done < <(git diff --name-only -- 'tests/*.mjs')
          git diff --check
      - name: Remove one-shot machinery
        run: |
          rm -f scripts/normalize-registration-ui-cache-successor.mjs
          rm -f .github/workflows/normalize-registration-ui-cache-successor.yml
      - name: Commit normalized assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-desk-release-bot'
          git config user.email 'thebe-desk-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Normalize registration UI cache successor assertions'
          git push origin HEAD:fix/registration-ui-navigation-owner-20260914
