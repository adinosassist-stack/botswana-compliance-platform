name: Regulatory Reviewer Readiness CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/regulatory-reviewer-readiness.yml'
      - '.github/workflows/regulatory-reviewer-readiness-ci.yml'
      - 'scripts/production-regulatory-reviewer-readiness.mjs'
      - 'tests/regulatory-reviewer-readiness-workflow-static.mjs'
      - 'operations/regulatory-reviewer-readiness-trigger.json'
  push:
    branches:
      - 'chatgpt/regulatory-reviewer-provisioning-20261011'
    paths:
      - '.github/workflows/regulatory-reviewer-readiness.yml'
      - '.github/workflows/regulatory-reviewer-readiness-ci.yml'
      - 'scripts/production-regulatory-reviewer-readiness.mjs'
      - 'tests/regulatory-reviewer-readiness-workflow-static.mjs'
      - 'operations/regulatory-reviewer-readiness-trigger.json'

permissions:
  contents: read

jobs:
  static-contract:
    name: Read-only reviewer readiness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Enforce read-only reviewer readiness contract
        run: |
          node --check scripts/production-regulatory-reviewer-readiness.mjs
          node tests/regulatory-reviewer-readiness-workflow-static.mjs
