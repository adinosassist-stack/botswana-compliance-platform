name: Workspace Agent settings source topology offline tests
on:
  pull_request:
    paths:
      - 'scripts/workspace-agent-settings-source-comparison.mjs'
      - 'tests/workspace-agent-settings-source-comparison.test.mjs'
      - '.github/workflows/workspace-agent-pinned-version-provenance.yml'
      - '.github/workflows/workspace-agent-settings-source-offline.yml'
  push:
    paths:
      - 'scripts/workspace-agent-settings-source-comparison.mjs'
      - 'tests/workspace-agent-settings-source-comparison.test.mjs'
      - '.github/workflows/workspace-agent-settings-source-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed version versus service settings classification
        run: node --test tests/workspace-agent-settings-source-comparison.test.mjs
