name: POP 071 read-only release plan
on:
  pull_request:
    paths:
      - 'cloudflare/migrations/071_payment_pop_runtime_compat.sql'
      - 'scripts/plan-production-pop-071.mjs'
      - '.github/workflows/plan-production-pop-071.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA
        required: true
        type: string
      source_sha256:
        description: Reviewed 071 migration SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enforce exact reviewed main when manually invoked
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
      - name: Validate source and generate read-only plan
        env:
          EXPECTED_SOURCE_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha256 || '' }}
        run: node scripts/plan-production-pop-071.mjs
      - name: Explain excluded actions
        run: |
          echo "Static source qualification only: no Cloudflare credentials, no remote schema state, no D1 writes, no migration application, no deployment, no feature activation." >> "$GITHUB_STEP_SUMMARY"
