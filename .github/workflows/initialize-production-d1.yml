name: Thebe Desk Production D1 Initialize
run-name: D1 initialize ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: thebe-desk-production
  cancel-in-progress: false

jobs:
  initialize:
    name: Initialize new production D1 from reviewed schema
    if: contains(github.event.head_commit.message, '[init-d1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

    steps:
      - name: Checkout exact initialization authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale D1 initialization target=$target current-main=$main_sha" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Validate production initialization inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Invalid CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          [[ "$D1_DATABASE_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || { echo 'Invalid D1_DATABASE_ID' >&2; exit 1; }

      - name: Prove D1 is new and capture rollback bookmark
        shell: bash
        run: |
          set -euo pipefail
          node scripts/guard-production-d1-initialize.mjs

      - name: Load reviewed current schema into new D1
        shell: bash
        run: |
          set -euo pipefail
          CONFIG='cloudflare/.wrangler-d1-init.ci.toml'
          cleanup(){ rm -f "$CONFIG"; }
          trap cleanup EXIT
          cat > "$CONFIG" <<EOF
          name = "bw-compliance-os"
          compatibility_date = "2026-09-03"

          [[d1_databases]]
          binding = "DB"
          database_name = "bw-compliance-os"
          database_id = "$D1_DATABASE_ID"
          EOF
          chmod 600 "$CONFIG"
          npx --yes wrangler@4.127.1 d1 execute DB --remote --file=cloudflare/schema.sql --config "$CONFIG"
          cleanup
          trap - EXIT

      - name: Verify public schema readiness after initialization
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 'https://thebedesk.com/api/ready')"
          READY_JSON="$body" node <<'NODE'
          const ready = JSON.parse(process.env.READY_JSON);
          if (ready.schemaReady !== true) throw new Error(`/api/ready still reports schemaReady=${String(ready.schemaReady)} error=${String(ready.error || '')}`);
          console.log(`Production D1 schema ready: version=${ready.version || 'unknown'} schema=${ready.expectedSchemaDelta || 'unknown'} requiredConfigReady=${String(ready.requiredConfigReady)}`);
          NODE
