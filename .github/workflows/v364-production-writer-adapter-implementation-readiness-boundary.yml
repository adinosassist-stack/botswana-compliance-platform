name: V364 production-writer-adapter-implementation-readiness boundary
run-name: V364 production-writer-adapter-implementation-readiness boundary ${{ github.event.pull_request.head.sha }}

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v364-production-writer-adapter-implementation-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v364-boundary:
    name: Owner closure record production writer adapter implementation readiness boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD_SHA" ]] || { echo "head mismatch expected=$EXPECTED_HEAD_SHA actual=$actual" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Production writer adapter implementation readiness review
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/owner-closure-record-production-writer-adapter-implementation-readiness-v364.mjs
          node --check tests/owner-closure-record-production-writer-adapter-implementation-readiness-static-v364.mjs
          node tests/owner-closure-record-production-writer-adapter-implementation-readiness-v364.mjs
          node tests/owner-closure-record-production-writer-adapter-implementation-readiness-static-v364.mjs

      - name: Inherited V363 adapter design proof
        shell: bash
        run: |
          set -euo pipefail
          node tests/owner-closure-record-production-writer-adapter-design-review-v363.mjs
          node tests/owner-closure-record-production-writer-adapter-design-static-v363.mjs

      - name: Inherited V362 production persistence primitive proof
        shell: bash
        run: |
          set -euo pipefail
          node tests/owner-closure-record-production-persistence-adapter-conformance-v362.mjs
          node tests/owner-closure-record-production-persistence-adapter-static-v362.mjs
