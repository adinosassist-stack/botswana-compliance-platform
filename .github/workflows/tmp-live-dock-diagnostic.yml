name: Temporary v21 production proof geometry repair

on:
  push:
    branches:
      - chatgpt/v21-production-proof-20261016
    paths:
      - '.github/workflows/tmp-live-dock-diagnostic.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/v21-production-proof-20261016
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Align full-user proof with authoritative Gemini dock geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wrapper_path=Path('scripts/production-synthetic-full-user-wrapper.mjs')
          wrapper=wrapper_path.read_text(encoding='utf-8')
          old="""    await page.waitForFunction(()=>{\n      const dock=document.getElementById('thebeAiDock'),pill=document.getElementById('thebeAiDockPill');\n      if(!dock||!pill)return false;\n      const style=getComputedStyle(dock),rect=dock.getBoundingClientRect(),pillStyle=getComputedStyle(pill);\n      const expectedWidth=parseFloat(getComputedStyle(document.body).getPropertyValue('--thebe-spatial-width'));\n      return !dock.hidden&&style.display!=='none'&&style.visibility!=='hidden'&&expectedWidth>0&&Math.abs(rect.width-expectedWidth)<=1&&rect.height>300&&\n        pill.hidden&&pillStyle.display==='none'&&dock.dataset.surface==='public';\n    },null,{timeout:15000});"""
          new="""    await page.waitForFunction(()=>{\n      const dock=document.getElementById('thebeAiDock'),pill=document.getElementById('thebeAiDockPill');\n      if(!dock||!pill)return false;\n      const style=getComputedStyle(dock),rect=dock.getBoundingClientRect(),pillStyle=getComputedStyle(pill);\n      const expanded=dock.dataset.expanded==='true'||document.body?.classList.contains('thebe-ai-expanded');\n      const expectedWidth=window.innerWidth>=1200\n        ?(expanded?560:Math.round(Math.max(360,Math.min(420,window.innerWidth*0.28))))\n        :window.innerWidth>=1024\n          ?(expanded?460:Math.round(Math.max(332,Math.min(360,window.innerWidth*0.31))))\n          :0;\n      return !dock.hidden&&style.display!=='none'&&style.visibility!=='hidden'&&expectedWidth>0&&Math.abs(rect.width-expectedWidth)<=1&&rect.height>300&&\n        pill.hidden&&pillStyle.display==='none'&&dock.dataset.surface==='public'&&\n        dock.dataset.geminiNarrowV274==='1'&&dock.dataset.geminiNarrowExpanded===(expanded?'1':'0');\n    },null,{timeout:15000});"""
          assert wrapper.count(old)==1, f'expected one obsolete spatial-width dock proof, found {wrapper.count(old)}'
          wrapper_path.write_text(wrapper.replace(old,new,1),encoding='utf-8')

          test_path=Path('tests/v82-phase0-launch-audit-deferred-integrations.mjs')
          test=test_path.read_text(encoding='utf-8')
          needle="""  'mandatory full-user lifecycle waits for market refinement v21 and proves its canonical public hero'\n);\n"""
          addition="""const publicDockWidthContract=fs.readFileSync('tests/public-dock-width-contract.mjs','utf8');\nok(\n  fullUserWrapper.includes("dock.dataset.geminiNarrowV274==='1'")&&\n  fullUserWrapper.includes("Math.round(Math.max(360,Math.min(420,window.innerWidth*0.28)))")&&\n  fullUserWrapper.includes("Math.round(Math.max(332,Math.min(360,window.innerWidth*0.31)))")&&\n  !fullUserWrapper.includes("getPropertyValue('--thebe-spatial-width')")&&\n  publicDockWidthContract.includes('wide desktop keeps the compact Gemini-style rail')&&\n  publicDockWidthContract.includes('runtime geometry must accept expanded state'),\n  'mandatory full-user lifecycle binds public dock readiness to the authoritative adjustable Gemini geometry contract'\n);\n"""
          assert test.count(needle)==1, f'expected one v21 hero proof insertion point, found {test.count(needle)}'
          test_path.write_text(test.replace(needle,needle+addition,1),encoding='utf-8')
          PY
          node --check scripts/production-synthetic-full-user-wrapper.mjs
          node --check tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/public-dock-width-contract.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v250-market-refinement-v21-static.mjs
          git diff --check
      - name: Commit exact proof repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-release-bot'
          git config user.email 'thebe-release-bot@users.noreply.github.com'
          git add scripts/production-synthetic-full-user-wrapper.mjs tests/v82-phase0-launch-audit-deferred-integrations.mjs
          git commit -m 'Align Phase 0 dock proof with adjustable Gemini geometry'
          git push origin HEAD:chatgpt/v21-production-proof-20261016
