name: Workspace Agent deployed-inert diagnostics offline contract
on:
  pull_request:
    paths:
      - '.github/workflows/workspace-agent-inert-diagnostics.yml'
      - 'scripts/workspace-agent-deployed-inert-audit.mjs'
      - 'tests/workspace-agent-deployed-inert-audit.test.mjs'
      - '.github/workflows/workspace-agent-deployed-inert-offline.yml'
  push:
    paths:
      - 'scripts/workspace-agent-deployed-inert-audit.mjs'
      - 'tests/workspace-agent-deployed-inert-audit.test.mjs'
      - '.github/workflows/workspace-agent-deployed-inert-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployed inert version and latest upload block
        run: node --test tests/workspace-agent-deployed-inert-audit.test.mjs
