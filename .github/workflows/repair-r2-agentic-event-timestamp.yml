name: Repair R2 agentic event timestamp

on:
  push:
    branches:
      - fix/r2-agentic-event-timestamp-20261012
    paths:
      - '.github/workflows/repair-r2-agentic-event-timestamp.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/r2-agentic-event-timestamp-20261012
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Align telemetry query and test schema with migration 045
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source=Path('cloudflare/src/agent-cost-outcome-telemetry.js')
          text=source.read_text()
          replacements=[
            ('SELECT run_id,detail_json,created_at FROM agentic_events','SELECT run_id,detail_json,occurred_at FROM agentic_events'),
            ("event_type=? AND created_at>=datetime('now',?)","event_type=? AND occurred_at>=datetime('now',?)"),
            ('ORDER BY created_at DESC','ORDER BY occurred_at DESC'),
          ]
          for old,new in replacements:
              assert text.count(old)==1, f'expected one stale production token: {old}'
              text=text.replace(old,new,1)
          source.write_text(text)

          test=Path('tests/agent-cost-outcome-telemetry.mjs')
          t=test.read_text()
          old_schema='actor_user_id TEXT,detail_json TEXT NOT NULL,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP'
          new_schema='actor_user_id TEXT,detail_json TEXT NOT NULL,occurred_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP'
          assert t.count(old_schema)==1, 'expected stale test schema timestamp once'
          t=t.replace(old_schema,new_schema,1)
          assert t.count('ORDER BY created_at,id')==1, 'expected stale test ordering once'
          t=t.replace('ORDER BY created_at,id','ORDER BY occurred_at,id',1)
          test.write_text(t)
          PY
          git diff --check -- cloudflare/src/agent-cost-outcome-telemetry.js tests/agent-cost-outcome-telemetry.mjs

      - name: Prove migration schema and telemetry behavior agree
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'occurred_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP' cloudflare/migrations/045_v80_agentic_foundation.sql
          node --check cloudflare/src/agent-cost-outcome-telemetry.js
          node --check tests/agent-cost-outcome-telemetry.mjs
          node --disable-warning=ExperimentalWarning tests/agent-cost-outcome-telemetry.mjs

      - name: Commit only production query and regression test
        shell: bash
        run: |
          set -euo pipefail
          git add cloudflare/src/agent-cost-outcome-telemetry.js tests/agent-cost-outcome-telemetry.mjs
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix agentic event timestamp schema alignment'
          git push origin HEAD:refs/heads/fix/r2-agentic-event-timestamp-20261012
