name: Thebe Desk Accounting Migration 068
run-name: Accounting 068 ${{ inputs.mode }} ${{ inputs.expected_sha }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan or reviewed schema application
        required: true
        type: choice
        default: plan
        options: [plan, apply]
      expected_sha:
        description: Exact qualified current-main merged PR SHA (40 characters)
        required: true
        type: string
      source_sha256:
        description: Reviewed migration 068 source SHA-256
        required: true
        type: string
        default: e5f3db240dc9d18f3625fd63a0c680b15f46d2fffe3697f98c38476d962dd7df
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: thebe-desk-production
      cancel-in-progress: false
    steps:
      - name: Checkout immutable workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owner dispatch and checkout
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_ACTOR" == 'adinosassist-stack' ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install lockfile-pinned transport without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Inspect or apply governed migration 068
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_sha }}
          EXPECTED_SOURCE_SHA256: ${{ inputs.source_sha256 }}
          MIGRATION_MODE: ${{ inputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export WRANGLER_JS="$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js"
          node scripts/migrate-production-agent-cost-accounting.mjs
