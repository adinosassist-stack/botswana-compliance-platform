name: Thebe Desk Accounting Migration 068
run-name: Accounting 068 ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }} ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-production-agent-cost-accounting.yml'
      - 'scripts/migrate-production-agent-cost-accounting.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan or reviewed schema application
        required: true
        type: choice
        default: plan
        options: [plan, apply]
      expected_sha:
        description: Exact qualified current-main merged PR SHA (40 characters)
        required: true
        type: string
      source_sha256:
        description: Reviewed migration 068 source SHA-256
        required: true
        type: string
        default: e5f3db240dc9d18f3625fd63a0c680b15f46d2fffe3697f98c38476d962dd7df

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: thebe-desk-production
      cancel-in-progress: false
    steps:
      - name: Checkout immutable workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate governed invocation and checkout
        env:
          EXPECTED_MAIN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_ACTOR" == 'adinosassist-stack' ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$MIGRATION_MODE" == 'plan' ]]
          else
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          fi

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install lockfile-pinned transport without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Wait for exact-main qualification on automatic plan
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in recovery-ci.yml mobile-startup-recovery.yml; do
            ready=0
            for attempt in $(seq 1 90); do
              payload="$(curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$EXPECTED_MAIN_SHA&event=push&per_page=20")"
              state="$(printf '%s' "$payload" | SHA="$EXPECTED_MAIN_SHA" python3 -c 'import json,os,sys; data=json.load(sys.stdin); sha=os.environ["SHA"]; runs=[r for r in data.get("workflow_runs",[]) if r.get("head_sha")==sha and r.get("event")=="push" and r.get("head_branch")=="main"]; runs.sort(key=lambda r:r.get("id",0),reverse=True); r=runs[0] if runs else None; print("success" if r and r.get("status")=="completed" and r.get("conclusion")=="success" else "failure" if r and r.get("status")=="completed" else "pending")')"
              if [[ "$state" == 'success' ]]; then ready=1; break; fi
              if [[ "$state" == 'failure' ]]; then
                echo "$workflow failed exact-main qualification" >&2
                exit 1
              fi
              sleep 5
            done
            [[ "$ready" == '1' ]] || { echo "$workflow qualification did not complete successfully" >&2; exit 1; }
          done

      - name: Inspect or apply governed migration 068
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          EXPECTED_SOURCE_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha256 || 'e5f3db240dc9d18f3625fd63a0c680b15f46d2fffe3697f98c38476d962dd7df' }}
          MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
          ACCOUNTING_068_AUTOPLAN: ${{ github.event_name == 'push' && '1' || '0' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export WRANGLER_JS="$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js"
          node scripts/migrate-production-agent-cost-accounting.mjs
