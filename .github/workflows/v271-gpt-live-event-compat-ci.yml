name: V271 GPT-Live event compatibility

on:
  pull_request:
    paths:
      - "cloudflare/src/agentic-live-voice-v270.js"
      - "tests/v270-gpt-live-migration-foundation.mjs"
      - "tests/v271-gpt-live-event-compat-evals.mjs"
      - ".github/workflows/v271-gpt-live-event-compat-ci.yml"
      - "docs/releases/v271-gpt-live-event-compat-evals.md"
  push:
    branches:
      - "chatgpt/v271-live-event-compat-evals"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check preview runtime
        run: node --check cloudflare/src/agentic-live-voice-v270.js
      - name: Preserve V270 migration foundation
        run: node tests/v270-gpt-live-migration-foundation.mjs
      - name: Qualify V271 Live event compatibility and evals
        run: node tests/v271-gpt-live-event-compat-evals.mjs
      - name: Preserve production Realtime guard
        run: node tests/v101-gpt-live-voice-foundation.mjs
