name: Production Operations Metadata Evidence
run-name: Read-only production operations metadata ${{ inputs.expected_sha }}

on:
  pull_request:
    paths:
      - scripts/production-operations-metadata.mjs
      - tests/production-operations-metadata.test.mjs
      - .github/workflows/production-operations-metadata.yml
      - docs/production-operations-metadata-evidence.md
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA of the reviewed collector
        required: true
        type: string
      confirmation:
        description: Read metadata only; does not prove alert delivery or recovery
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - READ_ONLY_OPERATIONS_METADATA

permissions:
  contents: read

concurrency:
  group: thebe-production-operations-metadata
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact qualification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Qualify metadata boundary without credentials
        run: node --test tests/production-operations-metadata.test.mjs
  collect:
    needs: qualify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'READ_ONLY_OPERATIONS_METADATA'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout immutable collector authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Qualify read-only transport and redaction
        run: node --test tests/production-operations-metadata.test.mjs
      - name: Confirm exact current main before provider access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid expected SHA.' >&2; exit 1; }
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" && "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo 'Checkout authority mismatch.' >&2; exit 1; }
          live_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$live_sha" == "$EXPECTED_SHA" ]] || { echo 'Collector is no longer current main.' >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'Collector checkout changed.' >&2; exit 1; }
      - name: Collect fixed production metadata GETs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report="$RUNNER_TEMP/production-operations-metadata.json"
          trap 'rm -f "$report"' EXIT
          node scripts/production-operations-metadata.mjs > "$report"
          {
            echo '## Read-only production metadata'
            echo 'Metadata success does not establish alert delivery, rollback or recovery acceptance.'
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
