name: Isolated AI Advisor Diagnostic Gate
run-name: Isolated AI diagnostic preflight ${{ inputs.expected_sha || github.sha }}
on:
  pull_request:
    paths:
      - .github/workflows/isolated-ai-advisor-diagnostic.yml
      - scripts/isolated-ai-diagnostic-gate.mjs
      - tests/isolated-ai-diagnostic-gate.test.mjs
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        description: Exact reviewed current main SHA
        type: string
      confirmation:
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - PREFLIGHT_ONLY
permissions:
  contents: read
concurrency:
  group: isolated-ai-diagnostic-${{ github.event.pull_request.number || 'protected' }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --test tests/isolated-ai-diagnostic-gate.test.mjs tests/advisor-stage-timing.test.mjs
  protected-preflight:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PREFLIGHT_ONLY'
    environment: operations-rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact reviewed current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$EXPECTED_SHA" ]]
      - name: Check fixed resources and explicitly disabled live execution
        env:
          SOURCE_SHA: ${{ inputs.expected_sha }}
        run: node scripts/isolated-ai-diagnostic-gate.mjs
