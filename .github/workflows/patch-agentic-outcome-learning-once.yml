name: Patch outcome-informed agentic planner once

on:
  push:
    branches:
      - chatgpt/agentic-outcome-informed-decisions-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Harden outcome-learning query
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-agentic-outcome-query.mjs
          node --check cloudflare/src/agentic-core.js
          git diff --check
          if git diff --quiet; then
            echo 'Outcome-learning query already hardened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/agentic-core.js
          git commit -m '[outcome-learning-query-hardened] use latest de-duplicated outcome evidence'
          git push origin HEAD:chatgpt/agentic-outcome-informed-decisions-20260913
