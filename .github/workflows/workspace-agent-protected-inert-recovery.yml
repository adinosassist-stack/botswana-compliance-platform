name: Workspace Agent protected inert recovery
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA
        required: true
        type: string
      expected_active_version:
        description: Full Cloudflare version ID of the stranded candidate
        required: true
        type: string
      confirmation:
        description: Enter RESTORE_PRIVATE_WORKSPACE_AGENT_INERT
        required: true
        type: string
permissions: {}

concurrency:
  group: workspace-agent-private-staging
  cancel-in-progress: false

jobs:
  verify-environment:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - name: Verify staging environment protections before referencing it
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          environment_api="repos/$GITHUB_REPOSITORY/environments/workspace-agent-private-staging"
          reviewer_id="$(gh api users/thusico --jq .id)"
          gh api "$environment_api" | jq -e --argjson reviewer "$reviewer_id" '
            any(.protection_rules[]; .type == "required_reviewers" and
              .prevent_self_review == true and
              ([.reviewers[] | select(.type == "User") | .reviewer.id] == [$reviewer]) and
              (.reviewers | length == 1)) and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true'
          gh api "$environment_api/deployment-branch-policies" | jq -e '
            .total_count == 1 and .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"'

  restore-inert:
    needs: verify-environment
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: workspace-agent-private-staging
    steps:
      - name: Restore only the pinned private Worker and verify the baseline
        env:
          AUDIT_TOKEN: ${{ secrets.WORKSPACE_AGENT_STAGING_READONLY_CLOUDFLARE_TOKEN }}
          WRITE_TOKEN: ${{ secrets.WORKSPACE_AGENT_STAGING_QUALIFICATION_CLOUDFLARE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_ACTIVE: ${{ inputs.expected_active_version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RESTORE_PRIVATE_WORKSPACE_AGENT_INERT
          [[ "$EXPECTED_ACTIVE" =~ ^9ba41e62-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          test -n "$AUDIT_TOKEN"
          test -n "$WRITE_TOKEN"
          current_main() {
            test "$GITHUB_SHA" = "$EXPECTED_SHA"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          }
          current_main
          api=https://api.cloudflare.com/client/v4/accounts/b11d872b2660e76ca66323023b45b3ab
          resource=bw-workspace-agent-staging
          read_inventory() {
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $AUDIT_TOKEN" "$api/$1"
          }
          script="workers/scripts/$resource"
          inert_version=64d9bae9-2ea3-40c1-9a26-83cea97ad71c
          d1_id=fa317ccc-683d-4466-9e3a-e296872d58ba
          verify_private_inventory() {
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $AUDIT_TOKEN" \
              'https://api.cloudflare.com/client/v4/zones?account.id=b11d872b2660e76ca66323023b45b3ab&per_page=50' |
              jq -e '.success == true and .result == [] and .result_info.total_count == 0 and
                (.result_info.total_pages == 0 or .result_info.total_pages == 1)' >/dev/null
            read_inventory workers/scripts | jq -e --arg name "$resource" '
              .success == true and ([.result[].id] == [$name])' >/dev/null
            read_inventory "$script/subdomain" | jq -e '
              .success == true and .result.enabled == false and
              .result.previews_enabled == false' >/dev/null
            read_inventory "$script/schedules" | jq -e '
              .success == true and .result.schedules == []' >/dev/null
            read_inventory "workers/domains?service=$resource" | jq -e '
              .success == true and .result == []' >/dev/null
            read_inventory "d1/database/$d1_id" | jq -e --arg id "$d1_id" --arg name "$resource" '
              .success == true and .result.uuid == $id and .result.name == $name and
              .result.num_tables == 0' >/dev/null
          }
          verify_private_inventory
          active_version() {
            read_inventory "$script/deployments" | jq -er '
              select(.success == true) | .result.deployments[0].versions |
              select(length == 1 and .[0].percentage == 100) | .[0].version_id'
          }
          active="$(active_version)"
          if [[ "$active" != "$inert_version" ]]; then
            test "$active" = "$EXPECTED_ACTIVE"
            read_inventory "$script/versions/$inert_version" |
              jq -e --arg version "$inert_version" '.success == true and .result.id == $version' >/dev/null
            current_main
            test "$(active_version)" = "$EXPECTED_ACTIVE"
            deployment="$(jq -nc --arg version "$inert_version" '{
              strategy:"percentage", versions:[{version_id:$version, percentage:100}],
              annotations:{"workers/message":"Restore pinned inert Workspace Agent after failed qualification"}
            }')"
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $WRITE_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$deployment" "$api/$script/deployments" |
              jq -e --arg version "$inert_version" '
                .success == true and (.result.versions | length == 1 and
                .[0].version_id == $version and .[0].percentage == 100)' >/dev/null
          fi
          for delay in 0 5 10 15 20; do
            sleep "$delay"
            if [[ "$(active_version)" == "$inert_version" ]]; then
              break
            fi
          done
          test "$(active_version)" = "$inert_version"
          verify_private_inventory
          read_inventory "$script/settings" | jq -e '
            .success == true and (.result.bindings | type == "array" and
              length == 8 and ([.[].name] | unique | length) == 8 and
              all(.[]; .type == "plain_text") and
              ([.[] | select(.name == "WORKSPACE_AGENT_ADVISORY_SHELL_ENABLED") | .text] == ["false"]))' >/dev/null
          current_main
          echo "Verified the pinned inert version, disabled subdomain and previews, no caller, routes, schedules or resource bindings, and empty dedicated D1."
