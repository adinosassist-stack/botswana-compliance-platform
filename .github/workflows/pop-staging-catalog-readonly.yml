name: POP staging catalog read-only qualification
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA
        required: true
        type: string
  pull_request:
    paths:
      - 'scripts/inspect-pop-cloudflare-catalog-readonly.mjs'
      - '.github/workflows/pop-staging-catalog-readonly.yml'
permissions:
  contents: read
concurrency:
  group: pop-staging-catalog-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline static restrictions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/inspect-pop-cloudflare-catalog-readonly.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const src=readFileSync('scripts/inspect-pop-cloudflare-catalog-readonly.mjs','utf8');
          for(const marker of ['workflow_dispatch','refs/heads/main','EXPECTED_MAIN_SHA','sqlite_master','mutation_performed: false']) {
            if(!src.includes(marker))throw Error('missing_readonly_authority_marker_'+marker);
          }
          if(/\b(UPDATE|DELETE|INSERT|ALTER|DROP|CREATE)\s+(?:TABLE|INTO|FROM|SET)/i.test(src))
            throw Error('unexpected_mutation_sql');
          NODE
  inspect:
    if: github.event_name == 'workflow_dispatch'
    needs: source-check
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Verify exact head authority and inspect only metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node scripts/inspect-pop-cloudflare-catalog-readonly.mjs
