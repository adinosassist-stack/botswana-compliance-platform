name: Offline backup RPO feasibility
on:
  pull_request:
    paths:
      - scripts/assess-backup-rpo-feasibility-offline.mjs
      - tests/assess-backup-rpo-feasibility-offline.test.mjs
      - .github/workflows/backup-rpo-feasibility-offline.yml
permissions:
  contents: read
jobs:
  no-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify backup RPO assessment and adversarial evidence tests
        run: node --test tests/assess-backup-rpo-feasibility-offline.test.mjs
