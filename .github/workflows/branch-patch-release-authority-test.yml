name: Temporary branch patch - release authority regression

on:
  push:
    branches:
      - chatgpt/release-branch-authority-20260915

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/release-branch-authority-20260915
          fetch-depth: 0
      - name: Patch only retired release-marker assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/v78-thebe-desk-deployment-closure-adversarial.mjs')
          s=p.read_text()
          anchor="const bf07Workflow=read('.github/workflows/bf07-seal.yml');\nconst provenanceCore=read('scripts/bf07-provenance-core.mjs');"
          replacement="const bf07Workflow=read('.github/workflows/bf07-seal.yml');\nconst releaseAuthority=read('.github/workflows/release-production.yml');\nconst provenanceCore=read('scripts/bf07-provenance-core.mjs');"
          if anchor not in s: raise SystemExit('missing BF-07 import anchor')
          s=s.replace(anchor,replacement,1)
          out=[]
          replaced=0
          for line in s.splitlines():
              if 'automatic BF-07 release sealing is restricted to explicit [deploy]-prefixed commits on main' in line:
                  out.extend([
                      "ok(releaseAuthority.includes(\"- 'release/prod-*'\")&&releaseAuthority.includes('actions: write')&&!releaseAuthority.includes('environment: production')&&!releaseAuthority.includes('secrets.'), 'release authority is isolated to exact-SHA release branches and cannot access production secrets');",
                      "ok(releaseAuthority.includes('expected_ref=\"refs/heads/release/prod-$release_sha\"')&&releaseAuthority.includes('release authority is stale/non-main'), 'release authority branch name and target are bound to exact current main');",
                      "ok(releaseAuthority.includes('/actions/workflows/bf07-seal.yml/dispatches')&&releaseAuthority.includes('\"ref\":\"main\"')&&releaseAuthority.includes('\"expected_sha\":os.environ[\"RELEASE_SHA\"]'), 'release authority dispatches BF-07 on main for the exact reviewed merge SHA');"
                  ])
                  replaced+=1
              elif 'manual BF-07 release path preserves explicit full-SHA confirmation' in line:
                  out.append("ok(bf07Workflow.includes('workflow_dispatch:')&&!bf07Workflow.includes('\\n  push:')&&bf07Workflow.includes('[[ \"$EXPECTED_SHA\" == \"$candidate_sha\" ]]')&&bf07Workflow.includes('dispatch SHA mismatch'), 'BF-07 is dispatch-only and preserves explicit exact-SHA confirmation');")
                  replaced+=1
              elif 'automatic BF-07 release path binds the explicit main release marker to the exact pushed SHA' in line:
                  out.append("ok(bf07Workflow.includes('BF-07 dispatch must run from main')&&bf07Workflow.includes('release candidate is not exact current main'), 'BF-07 dispatch binds the reviewed merge to exact current main');")
                  replaced+=1
              else:
                  out.append(line)
          if replaced != 3: raise SystemExit(f'expected 3 stale assertions, replaced {replaced}')
          p.write_text('\n'.join(out)+'\n')
          PY
          git diff --check
          node tests/v78-thebe-desk-deployment-closure-adversarial.mjs
      - name: Commit branch-only test patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v78-thebe-desk-deployment-closure-adversarial.mjs
          git commit -m 'test: update deployment closure for release authority'
          git push origin HEAD:chatgpt/release-branch-authority-20260915
