name: Temporary branch patch - finance idempotency integrity

on:
  push:
    branches:
      - chatgpt/finance-idempotency-integrity-20260915

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/finance-idempotency-integrity-20260915
          fetch-depth: 0
      - name: Patch and verify finance idempotency integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_branch_patch_finance_idempotency.py
          git diff --check
          node --check cloudflare/src/finance-core.js
          node tests/v79-finance-reconciliation.mjs
          node tests/v82-finance-idempotency-replay-integrity.mjs
      - name: Commit hardened finance replay contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/finance-core.js .github/workflows/recovery-ci.yml
          git commit -m 'finance: bind idempotency replay to exact import request'
          git push origin HEAD:chatgpt/finance-idempotency-integrity-20260915
