name: Provision isolated inert Workspace Agent Worker
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main commit
        required: true
        type: string
permissions: {}

jobs:
  verify-environment:
    if: github.repository == 'adinosassist-stack/botswana-compliance-platform' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - name: Verify staging environment protections before referencing it
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          environment_api="repos/$GITHUB_REPOSITORY/environments/workspace-agent-private-staging"
          reviewer_id="$(gh api users/thusico --jq .id)"
          gh api "$environment_api" | jq -e --argjson reviewer "$reviewer_id" '
            any(.protection_rules[]; .type == "required_reviewers" and
              .prevent_self_review == true and
              ([.reviewers[] | select(.type == "User") | .reviewer.id] == [$reviewer]) and
              (.reviewers | length == 1)) and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true'
          gh api "$environment_api/deployment-branch-policies" | jq -e '
            .total_count == 1 and .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"'

  provision:
    needs: verify-environment
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency: workspace-agent-isolated-inert-provision
    environment: workspace-agent-private-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build inert Worker without credentials
        run: npx --no-install wrangler deploy --dry-run --config cloudflare/wrangler.workspace-agent-staging.inert.toml
      - name: Provision only the inert Worker in the isolated account
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          CLOUDFLARE_ACCOUNT_ID: b11d872b2660e76ca66323023b45b3ab
          CLOUDFLARE_API_TOKEN: ${{ secrets.WORKSPACE_AGENT_STAGING_PROVISIONING_CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          read_inventory() {
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1"
          }
          read_inventory workers/scripts | jq -e '.success == true and .result == []' >/dev/null
          config=cloudflare/wrangler.workspace-agent-staging.inert.toml
          python - "$config" <<'PYTHON'
          import sys
          import tomllib
          with open(sys.argv[1], "rb") as config:
              settings = tomllib.load(config)
          assert set(settings) == {"name", "main", "compatibility_date", "workers_dev", "preview_urls", "keep_vars", "vars"}
          assert settings["name"] == "bw-workspace-agent-staging"
          assert settings["main"] == "src/workspace-agent-staging-inert-entry.js"
          assert all(settings[key] is False for key in ("workers_dev", "preview_urls", "keep_vars"))
          assert settings["vars"]["WORKSPACE_AGENT_ADVISORY_SHELL_ENABLED"] == "false"
          PYTHON
          npx --no-install wrangler deploy --config "$config"
          resource=bw-workspace-agent-staging
          script="workers/scripts/$resource"
          read_inventory "$script/subdomain" | jq -e '.success and .result.enabled == false and .result.previews_enabled == false' >/dev/null
          read_inventory "$script/schedules" | jq -e '.success and .result.schedules == []' >/dev/null
          read_inventory "workers/domains?service=$resource" | jq -e '.success and .result == []' >/dev/null
          read_inventory "$script/settings" | jq -e '
            .success and (.result.bindings | type == "array" and
              all(.[]; .type == "plain_text") and
              ([.[] | select(.name == "WORKSPACE_AGENT_ADVISORY_SHELL_ENABLED") | .text] == ["false"]))' >/dev/null
          version="$(read_inventory "$script/deployments" | jq -er '
            select(.success) | .result.deployments[0].versions |
            select(length == 1 and .[0].percentage == 100) | .[0].version_id |
            select(type == "string" and test("^[0-9a-f-]{36}$"))')"
          echo "Inert Worker version: $version" >> "$GITHUB_STEP_SUMMARY"
