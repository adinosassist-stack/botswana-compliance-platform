name: Agentic metadata patch once

on:
  push:
    branches:
      - chatgpt/agentic-foundation-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch release metadata and schema convergence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          latest='045_v80_agentic_foundation.sql'
          previous='044_v79_finance_reconciliation.sql'

          profile=Path('RELEASE_PROFILE.json')
          text=profile.read_text()
          needle=f'  "latest_cloudflare_migration": "{previous}",'
          replacement=(f'  "latest_cloudflare_migration": "{latest}",\n'
                       '  "agentic_foundation_v80": true,\n'
                       '  "agentic_execution_enabled": false,\n'
                       '  "agentic_human_approval_required": true,\n'
                       '  "agentic_high_risk_autonomy_prohibited": true,')
          if needle not in text:
              raise SystemExit('release profile latest migration marker not found')
          profile.write_text(text.replace(needle,replacement,1))

          worker=Path('cloudflare/src/worker.js')
          text=worker.read_text()
          old=f'const EXPECTED_SCHEMA_DELTA="{previous}";'
          new=f'const EXPECTED_SCHEMA_DELTA="{latest}";'
          if old not in text:
              raise SystemExit('worker expected schema marker not found')
          text=text.replace(old,new,1)
          marker='async function currentSchemaReady(env){'
          guard='\n  try{await env.DB.prepare("SELECT id FROM agentic_runs LIMIT 1").first()}catch{return false}'
          if marker not in text:
              raise SystemExit('currentSchemaReady marker not found')
          if 'SELECT id FROM agentic_runs LIMIT 1' not in text:
              text=text.replace(marker,marker+guard,1)
          worker.write_text(text)

          schema=Path('cloudflare/schema.sql')
          schema_text=schema.read_text()
          if 'CREATE TABLE IF NOT EXISTS agentic_runs' not in schema_text:
              migration=Path('cloudflare/migrations/'+latest).read_text().strip()
              schema.write_text(schema_text.rstrip()+f'\n\n-- V80 governed agentic planning foundation (migration 045)\n{migration}\n')

          launch=Path('docs/LAUNCH.md')
          launch_text=launch.read_text()
          target=f'through `{latest}`'
          if target not in launch_text:
              launch.write_text(launch_text.rstrip()+f'\n\n### Current schema upgrade target\nFor an existing D1 database, apply only the pending release migrations in order through `{latest}` before deploying Worker code. Worker code is newer than the production D1 schema until this completes.\n')

          cfreadme=Path('cloudflare/README.md')
          cf_text=cfreadme.read_text()
          target=f'upgrade delta `migrations/{latest}`'
          if target not in cf_text:
              cfreadme.write_text(cf_text.rstrip()+f'\n\n### Current upgrade delta\nThe current existing-database upgrade delta `migrations/{latest}` must be applied after all earlier numbered migrations. For a brand-new D1 database, load the current `schema.sql`.\n')

          status=Path('docs/LAUNCH_STATUS.md')
          status_text=status.read_text()
          if latest not in status_text:
              status.write_text(status_text.rstrip()+f'\n\nAgentic schema requirement: `{latest}`. Stage 1 agentic execution remains disabled; approvals record human intent only.\n')

          workflow=Path('.github/workflows/agentic-metadata-patch-once.yml')
          workflow.unlink()
          PY

          node tests/v78-12146-launch-metadata-coherence-adversarial.mjs
          node tests/v80-agentic-foundation.mjs

      - name: Commit exact metadata patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore: align agentic schema and release metadata"
          git push origin HEAD:chatgpt/agentic-foundation-20260913
