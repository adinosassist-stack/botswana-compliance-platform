name: Mobile QA isolated no-ingress preflight (offline only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/mobile-qa-no-ingress-preflight.mjs'
      - 'docs/mobile-qa-staging-offline-plan.json'
      - 'tests/mobile-qa-no-ingress-preflight.test.mjs'
      - '.github/workflows/mobile-qa-no-ingress-preflight.yml'

permissions:
  contents: read

jobs:
  source-only:
    name: Verify proposed QA isolation — NO DEPLOY
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Run offline fail-closed regression tests
        run: node --test tests/mobile-qa-no-ingress-preflight.test.mjs
      - name: Verify exact protected-main SHA and proposed no-ingress manifest
        env:
          EXPECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/mobile-qa-no-ingress-preflight.mjs \
            --plan docs/mobile-qa-staging-offline-plan.json \
            --exact-main-sha "$EXPECTED_MAIN_SHA"
          printf '%s\n' 'SOURCE-ONLY QUALIFICATION: NO WORKER, NO ROUTE, NO D1, NO DEPLOY'
