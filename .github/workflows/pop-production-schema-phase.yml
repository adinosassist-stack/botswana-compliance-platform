name: Protected POP production schema phase
on:
  pull_request:
    paths:
      - scripts/apply-pop-production-phase.mjs
      - scripts/qualify-pop-production-phase-offline.mjs
      - tests/pop-production-phase-executor.test.mjs
      - tests/pop-production-phase-workflow.test.mjs
      - docs/pop-production-schema-phase.md
      - .github/workflows/pop-production-schema-phase.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently reviewed current main SHA
        required: true
        type: string
      phase:
        description: Apply only one independently approved schema phase
        required: true
        type: choice
        options: ['070', '071']
      owner_approval_id:
        description: Owner-authored phase approval comment in issue 1950
        required: true
        type: string
      review_approval_id:
        description: thusico-authored phase approval comment in issue 1950
        required: true
        type: string
      confirmation:
        description: Schema only; never enables POP or activates subscriptions
        required: true
        type: choice
        default: DO_NOT_RUN
        options: [DO_NOT_RUN, APPLY_ONE_REVIEWED_POP_SCHEMA_PHASE]
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pop-schema-tests-{0}', github.event.pull_request.number) || 'thebe-isolated-operations-rehearsals' }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --check scripts/apply-pop-production-phase.mjs
      - run: node --test tests/pop-production-phase-executor.test.mjs tests/pop-production-phase-workflow.test.mjs tests/pop-production-phase-offline.test.mjs tests/pop-production-readonly-preflight.test.mjs
      - name: Reject stale dispatch before protected environment review
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$EXPECTED_SHA" ]]
  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY_ONE_REVIEWED_POP_SCHEMA_PHASE'
    needs: qualify
    environment: pop-production-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify clean exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Verify authenticated approvals and recovery before one schema phase
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          POP_PHASE: ${{ inputs.phase }}
          POP_CONFIRM: ${{ inputs.confirmation }}
          POP_OWNER_APPROVAL_ID: ${{ inputs.owner_approval_id }}
          POP_REVIEW_APPROVAL_ID: ${{ inputs.review_approval_id }}
          POP_PRODUCTION_GITHUB_READ_TOKEN: ${{ secrets.POP_PRODUCTION_GITHUB_READ_TOKEN }}
          POP_PRODUCTION_CLOUDFLARE_TOKEN: ${{ secrets.POP_PRODUCTION_CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/pop-schema-phase-receipt.json"
          trap 'rm -f "$receipt"' EXIT
          node scripts/apply-pop-production-phase.mjs > "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
