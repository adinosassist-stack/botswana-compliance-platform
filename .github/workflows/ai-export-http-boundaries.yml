name: AI export HTTP boundary tests
on:
  pull_request:
    paths:
      - 'server/ai-document-export-http.js'
      - 'tests/ai-document-export-http.test.mjs'
      - '.github/workflows/ai-export-http-boundaries.yml'
permissions:
  contents: read
jobs:
  authorized-http:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-document-export-http.test.mjs
