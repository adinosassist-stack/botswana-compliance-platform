name: One-shot finance release profile update

on:
  push:
    branches: ['chatgpt/finance-reconciliation-20260913']
    paths: ['.github/workflows/update-finance-release-profile-once.yml']

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/finance-reconciliation-20260913
          persist-credentials: true
          fetch-depth: 1

      - name: Advance reviewed schema metadata and remove helper
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='RELEASE_PROFILE.json';
          const before=fs.readFileSync(path,'utf8');
          const from='  "latest_cloudflare_migration": "043_v78_session_inventory_hardening.sql",';
          const to='  "latest_cloudflare_migration": "044_v79_finance_reconciliation.sql",\n  "finance_reconciliation_v79": true,\n  "finance_provider_neutral": true,\n  "finance_whatsapp_exception_alerts_optional": true,';
          const count=before.split(from).length-1;
          if(count!==1)throw new Error(`expected one release-profile migration marker, found ${count}`);
          const after=before.replace(from,to);
          JSON.parse(after);
          fs.writeFileSync(path,after);
          NODE
          rm .github/workflows/update-finance-release-profile-once.yml
          git diff --check
          grep -F '"latest_cloudflare_migration": "044_v79_finance_reconciliation.sql"' RELEASE_PROFILE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_PROFILE.json .github/workflows/update-finance-release-profile-once.yml
          git commit -m 'chore(release): advance Cloudflare schema profile to 044'
          git push origin HEAD:chatgpt/finance-reconciliation-20260913
