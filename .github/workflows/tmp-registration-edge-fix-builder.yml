name: Temporary registration edge fix builder
on:
  push:
    branches:
      - fix/registration-ui-navigation-owner-20260914
permissions:
  contents: write
jobs:
  build-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/registration-ui-navigation-owner-20260914
          fetch-depth: 0
      - name: Apply registration patch
        run: python3 scripts/tmp-registration-edge-fix-builder.py
      - name: Run focused regressions
        run: |
          set -euo pipefail
          node tests/v83-registration-edge-runtime.mjs
          node tests/v78-home-navigation-adversarial.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node --check cloudflare/src/worker.js
          node --check cloudflare/src/production-entry.js
      - name: Commit hotfix
        run: |
          set -euo pipefail
          git config user.name 'Thebe Desk CI'
          git config user.email 'thebe-desk-ci@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[registration-hotfix-built] Fix Workers registration runtime and owner access'
          git push origin HEAD:refs/heads/fix/registration-ui-navigation-owner-20260914
