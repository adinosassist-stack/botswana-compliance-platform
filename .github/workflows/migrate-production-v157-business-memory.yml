name: Thebe Desk Production V157 Business Memory Migration
run-name: V157 business-memory migration ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  migrate:
    concurrency:
      group: thebe-desk-production
      cancel-in-progress: false
    name: Apply reviewed business-memory migration 057
    if: contains(github.event.head_commit.message, '[migrate-057]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

    steps:
      - name: Checkout exact migration authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current-main merged-PR authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          [[ "$target" == "$GITHUB_SHA" ]]
          read -r -a line <<< "$(git rev-list --parents -n 1 "$target")"
          [[ "$(( ${#line[@]} - 1 ))" == "2" ]] || { echo 'migration authority must be a two-parent merged PR commit' >&2; exit 1; }
          main_sha="$(curl --fail-with-body --silent --show-error --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale migration target=$target current-main=$main_sha" >&2; exit 1; }
          pulls_json="$(curl --fail-with-body --silent --show-error --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$target/pulls?per_page=100")"
          printf '%s' "$pulls_json" | TARGET_SHA="$target" python3 -c 'import json,os,sys; pulls=json.load(sys.stdin); sha=os.environ["TARGET_SHA"]; matches=[pr for pr in pulls if pr.get("merged_at") and pr.get("base",{}).get("ref")=="main" and pr.get("merge_commit_sha")==sha]; len(matches)==1 or sys.exit("migration authority must resolve to exactly one merged PR targeting main"); print("Merged PR authority confirmed: #{}".format(matches[0]["number"]))'
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Prepare pinned Wrangler D1 migration transport
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER_ROOT="$RUNNER_TEMP/wrangler-d1-migration"
          NPM_HOME="$RUNNER_TEMP/npm-home-d1-migration"
          MIGRATION_CONFIG="$RUNNER_TEMP/thebe-d1-migration.toml"
          rm -rf "$WRANGLER_ROOT" "$NPM_HOME"; rm -f "$MIGRATION_CONFIG"; mkdir -p "$WRANGLER_ROOT" "$NPM_HOME"
          (cd "$RUNNER_TEMP"; HOME="$NPM_HOME" NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ NPM_CONFIG_IGNORE_SCRIPTS=true npm install --prefix "$WRANGLER_ROOT" --no-audit --no-fund --no-save --package-lock=false wrangler@4.135.0)
          WRANGLER_JS="$WRANGLER_ROOT/node_modules/wrangler/bin/wrangler.js"
          test -f "$WRANGLER_JS"
          [[ "$(node "$WRANGLER_JS" --version)" == *'4.135.0'* ]]
          cat > "$MIGRATION_CONFIG" <<EOF
          name = "thebe-d1-production-migration"
          compatibility_date = "2026-09-03"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [[d1_databases]]
          binding = "DB"
          database_name = "bw-compliance-os"
          database_id = "$D1_DATABASE_ID"
          EOF
          chmod 600 "$MIGRATION_CONFIG"
          printf 'WRANGLER_JS=%s\nWRANGLER_CONFIG=%s\n' "$WRANGLER_JS" "$MIGRATION_CONFIG" >> "$GITHUB_ENV"

      - name: Validate production migration inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          [[ "$D1_DATABASE_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]

      - name: Apply reviewed migration 057
        shell: bash
        run: node scripts/migrate-production-v157-business-memory.mjs

      - name: Verify live production readiness after migration
        shell: bash
        run: |
          set -euo pipefail
          body=''; status=''
          for attempt in {1..12}; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 --output "$tmp" --write-out '%{http_code}' 'https://thebedesk.com/api/ready' || true)"
            body="$(cat "$tmp")"; rm -f "$tmp"
            if [[ "$status" == '200' ]]; then break; fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          [[ "$status" == '200' ]] || { echo "production readiness remains unhealthy after migration 057: $body" >&2; exit 1; }
          READY_JSON="$body" node <<'NODE'
          const ready=JSON.parse(process.env.READY_JSON);
          if(ready.ok!==true||ready.schemaReady!==true||ready.coreSchemaReady!==true||ready.agenticAuthoritySchemaReady!==true||ready.requiredConfigReady!==true) throw new Error('production readiness contract is not fully green after migration 057');
          if(ready.latestSchemaDelta!=='057_v157_business_memory_money_intelligence.sql') throw new Error('latest schema delta does not match 057');
          console.log('Production readiness restored through migration 057.');
          NODE
