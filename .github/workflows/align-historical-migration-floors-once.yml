name: One-shot historical migration-floor alignment

on:
  push:
    branches: ['chatgpt/finance-reconciliation-20260913']
    paths: ['.github/workflows/align-historical-migration-floors-once.yml']

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/finance-reconciliation-20260913
          persist-credentials: true
          fetch-depth: 1

      - name: Extend reviewed successor lists through migration 044
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function replaceOne(path,from,to){
            const before=fs.readFileSync(path,'utf8');
            const count=before.split(from).length-1;
            if(count!==1)throw new Error(`${path}: expected exactly one migration successor list, found ${count}`);
            fs.writeFileSync(path,before.replace(from,to));
          }
          replaceOne('tests/v78-12167-session-generation-revocation-adversarial.mjs',
            "['042_v78_session_generation_revocation.sql','043_v78_session_inventory_hardening.sql']",
            "['042_v78_session_generation_revocation.sql','043_v78_session_inventory_hardening.sql','044_v79_finance_reconciliation.sql']");
          replaceOne('tests/v78-12157-authorization-reporting-concurrency-adversarial.mjs',
            '["040_v78_authorization_reporting_concurrency.sql","041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql"]',
            '["040_v78_authorization_reporting_concurrency.sql","041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql","044_v79_finance_reconciliation.sql"]');
          replaceOne('tests/v78-12153-payment-webhook-scheduled-restore-hardening-adversarial.mjs',
            '["038_v78_scheduled_run_observability.sql","039_v78_mutation_idempotency.sql","040_v78_authorization_reporting_concurrency.sql","041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql"]',
            '["038_v78_scheduled_run_observability.sql","039_v78_mutation_idempotency.sql","040_v78_authorization_reporting_concurrency.sql","041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql","044_v79_finance_reconciliation.sql"]');
          replaceOne('tests/v78-12154-idempotency-cross-layer-recovery-adversarial.mjs',
            '["039_v78_mutation_idempotency.sql","040_v78_authorization_reporting_concurrency.sql","041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql"]',
            '["039_v78_mutation_idempotency.sql","040_v78_authorization_reporting_concurrency.sql","041_v78_webhook_purge_claim_hardening.sql","042_v78_session_generation_revocation.sql","043_v78_session_inventory_hardening.sql","044_v79_finance_reconciliation.sql"]');
          replaceOne('tests/v78-12152-tenant-lifecycle-purge-performance-adversarial.mjs',
            "['037_v78_tenant_deletion_purge.sql','038_v78_scheduled_run_observability.sql','039_v78_mutation_idempotency.sql','040_v78_authorization_reporting_concurrency.sql','041_v78_webhook_purge_claim_hardening.sql','042_v78_session_generation_revocation.sql','043_v78_session_inventory_hardening.sql']",
            "['037_v78_tenant_deletion_purge.sql','038_v78_scheduled_run_observability.sql','039_v78_mutation_idempotency.sql','040_v78_authorization_reporting_concurrency.sql','041_v78_webhook_purge_claim_hardening.sql','042_v78_session_generation_revocation.sql','043_v78_session_inventory_hardening.sql','044_v79_finance_reconciliation.sql']");
          NODE
          rm .github/workflows/align-historical-migration-floors-once.yml
          git diff --check
          for f in \
            tests/v78-12167-session-generation-revocation-adversarial.mjs \
            tests/v78-12157-authorization-reporting-concurrency-adversarial.mjs \
            tests/v78-12153-payment-webhook-scheduled-restore-hardening-adversarial.mjs \
            tests/v78-12154-idempotency-cross-layer-recovery-adversarial.mjs \
            tests/v78-12152-tenant-lifecycle-purge-performance-adversarial.mjs; do
            grep -F '044_v79_finance_reconciliation.sql' "$f" >/dev/null
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v78-12167-session-generation-revocation-adversarial.mjs tests/v78-12157-authorization-reporting-concurrency-adversarial.mjs tests/v78-12153-payment-webhook-scheduled-restore-hardening-adversarial.mjs tests/v78-12154-idempotency-cross-layer-recovery-adversarial.mjs tests/v78-12152-tenant-lifecycle-purge-performance-adversarial.mjs .github/workflows/align-historical-migration-floors-once.yml
          git commit -m 'test(release): recognize migration 044 as reviewed successor'
          git push origin HEAD:chatgpt/finance-reconciliation-20260913
