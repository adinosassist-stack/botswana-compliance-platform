name: Temporary pricing navigation hotfix

on:
  push:
    branches:
      - fix/marketing-pricing-navigation-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/marketing-pricing-navigation-20260914
          fetch-depth: 0
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Apply bounded navigation patch
        run: python3 scripts/tmp-pricing-navigation-patch.py
      - name: Verify navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/v78-home-navigation-adversarial.mjs
          node tests/v78-start-free-visibility-static.mjs
          node tests/v82-registration-owner-navigation-hardening.mjs
          git diff --check
      - name: Ensure candidate diff is bounded
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD | sort)"
          printf '%s\n' "$changed"
          for path in $changed; do
            case "$path" in
              public/index.html|tests/v78-home-navigation-adversarial.mjs|.github/workflows/tmp-pricing-navigation-patch.yml|scripts/tmp-pricing-navigation-patch.py) ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Commit clean hotfix candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Thebe Desk CI'
          git config user.email 'thebe-desk-ci@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix marketing pricing navigation in fixed scroller'
          git push origin HEAD:refs/heads/fix/marketing-pricing-navigation-20260914
