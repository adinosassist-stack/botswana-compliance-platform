name: Consolidated Finance Evidence qualification
on:
  pull_request:
    paths:
      - 'public/js/money-workspace-v307.js'
      - 'public/js/owner-command-centre.js'
      - 'cloudflare/src/business-analytics.js'
      - 'tests/finance-reconciliation-missing-evidence-ui.test.mjs'
      - 'tests/owner-finance-evidence-clarity.test.mjs'
      - 'tests/business-analytics-finance-evidence.test.mjs'
      - '.github/workflows/consolidated-finance-evidence-offline.yml'
permissions:
  contents: read
jobs:
  finance-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate governed finance evidence from API to owner presentation
        run: node --test tests/finance-reconciliation-missing-evidence-ui.test.mjs tests/owner-finance-evidence-clarity.test.mjs tests/business-analytics-finance-evidence.test.mjs
