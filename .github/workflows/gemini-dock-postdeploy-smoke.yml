name: Gemini Dock Live Post-Deploy Smoke
run-name: Gemini dock live smoke ${{ github.event.workflow_run.head_sha || inputs.expected_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-dock-live-${{ github.event.workflow_run.head_sha || inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live Gemini-style public Thebe dock
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha }}
      ORIGIN: https://thebedesk.com

    steps:
      - name: Checkout exact deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact deployed authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid EXPECTED_SHA=$EXPECTED_SHA" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "checkout mismatch" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo 'refusing non-success deployment trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]] || { echo 'refusing non-main deployment trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_sha }}" == "$EXPECTED_SHA" ]] || { echo 'workflow_run SHA mismatch' >&2; exit 1; }
          fi

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install browser driver only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Cross-check live Gemini dock geometry and interaction
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-gemini-dock-postdeploy-smoke.mjs
