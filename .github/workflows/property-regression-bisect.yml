name: Property regression bisect
run-name: Property regression bisect ${{ github.event.pull_request.head.sha }}

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: property-regression-bisect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bisect:
    name: Property historical regression bisect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact PR head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: V180 regulatory pack integrity
        run: node tests/v180-regulatory-pack-integrity.mjs
      - name: V181 regulatory activation audit
        run: node tests/v181-regulatory-activation-audit.mjs
      - name: Agent preflight
        run: npm run check:agent-preflight
      - name: Owner operator
        run: npm run test:owner-operator
      - name: V248 pricing selector parity
        run: node tests/v248-pricing-selector-parity.mjs
      - name: V235 business goals adversarial
