name: BF-07 Supply-Chain Seal
run-name: BF-07 seal ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'release/production.json'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character current main release-merge SHA that must be sealed'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: bf07-seal-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

# Historical deployment-regression sentinel only; this expression is not executable authority:
# startsWith(github.event.head_commit.message, '[deploy]')

jobs:
  seal:
    name: Resolve BF-07 from clean npm registry state
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      MAX_RELEASE_LINEAGE_MERGES: '100'

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release merge and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo "release authority is restricted to main, got $GITHUB_REF" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release SHA must be a full lowercase 40-character commit SHA' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected SHA must be a full lowercase commit SHA' >&2; exit 1; }
            [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "dispatch SHA mismatch: expected=$EXPECTED_SHA actual=$GITHUB_SHA" >&2; exit 1; }
          else
            release_message="$(git log -1 --format=%B "$GITHUB_SHA")"
            [[ "$release_message" =~ ^\[release\]([[:space:]]|$) ]] || { echo 'automatic release merge message must begin with [release]' >&2; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'checkout HEAD does not match GITHUB_SHA' >&2; exit 1; }
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo "release SHA is not checkout current main: release=$GITHUB_SHA main=$main_sha" >&2; exit 1; }
          live_main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$live_main_sha" == "$GITHUB_SHA" ]] || { echo "release SHA is stale/non-main at BF-07 qualification boundary: release=$GITHUB_SHA current-main=$live_main_sha" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean before BF-07 resolution' >&2; exit 1; }

          release_sha="$GITHUB_SHA"
          read -r -a release_line <<< "$(git rev-list --parents -n 1 "$release_sha")"
          release_parent_count=$(( ${#release_line[@]} - 1 ))
          [[ "$release_parent_count" == '2' ]] || { echo "release authority must be a two-parent merged PR commit, got $release_parent_count parent(s)" >&2; exit 1; }
          base_sha="${release_line[1]}"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'release first-parent SHA is invalid' >&2; exit 1; }

          current_manifest="$(cat release/production.json)"
          previous_manifest="$(git show "$base_sha:release/production.json")"
          MANIFEST_JSON="$current_manifest" PREVIOUS_MANIFEST_JSON="$previous_manifest" BASE_SHA="$base_sha" node <<'NODE'
          const current=JSON.parse(process.env.MANIFEST_JSON);
          const previous=JSON.parse(process.env.PREVIOUS_MANIFEST_JSON);
          const expectedKeys=['release','schema','sequence','sourceSha'];
          const keys=value=>Object.keys(value).sort();
          if(JSON.stringify(keys(current))!==JSON.stringify(expectedKeys))throw new Error('production release manifest has unexpected keys');
          if(current.schema!==1||current.release!=='production')throw new Error('production release manifest identity is invalid');
          if(!Number.isSafeInteger(current.sequence)||current.sequence<1)throw new Error('production release sequence must be a positive safe integer');
          if(current.sourceSha!==process.env.BASE_SHA)throw new Error(`production release sourceSha mismatch expected=${process.env.BASE_SHA} actual=${String(current.sourceSha||'')}`);
          if(previous.schema!==1||previous.release!=='production'||!Number.isSafeInteger(previous.sequence)||previous.sequence<0)throw new Error('previous production release manifest is invalid');
          if(current.sequence!==previous.sequence+1)throw new Error(`production release sequence must advance exactly once previous=${previous.sequence} current=${current.sequence}`);
          console.log(`PR-only production release manifest confirmed: sequence=${current.sequence} source=${current.sourceSha}`);
          NODE

          pulls_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$release_sha/pulls?per_page=100"
          )"
          release_pr_number="$(printf '%s' "$pulls_json" | RELEASE_SHA="$release_sha" python3 -c 'import json,os,sys; pulls=json.load(sys.stdin); sha=os.environ["RELEASE_SHA"]; match=next((pr for pr in pulls if pr.get("merged_at") and pr.get("base",{}).get("ref")=="main" and pr.get("merge_commit_sha")==sha),None); match or sys.exit("release authority is not the exact merge commit of a merged pull request targeting main"); print(match.get("number"))')"
          [[ "$release_pr_number" =~ ^[0-9]+$ ]] || { echo 'release PR number is invalid' >&2; exit 1; }
          echo "Release PR provenance confirmed: #$release_pr_number"

          release_pr_files="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$release_pr_number/files?per_page=100"
          )"
          printf '%s' "$release_pr_files" | python3 -c 'import json,sys; files=json.load(sys.stdin); len(files)==1 or sys.exit("release PR must change exactly one file"); item=files[0]; (item.get("filename")=="release/production.json" and item.get("status")=="modified") or sys.exit("release PR may modify only release/production.json"); print("Release PR file boundary confirmed: release/production.json only")'

          release_commit_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$release_sha"
          )"
          printf '%s' "$release_commit_json" | RELEASE_SHA="$release_sha" python3 -c 'import json,os,sys; commit=json.load(sys.stdin); sha=os.environ["RELEASE_SHA"]; verification=commit.get("commit",{}).get("verification",{}); (commit.get("sha")==sha and verification.get("verified") is True and verification.get("reason")=="valid") or sys.exit("release merge commit is not GitHub-verified with a valid signature"); print("Release merge signature verified by GitHub")'

          governance_confirmed=0
          for attempt in $(seq 1 37); do
            governance_json="$(
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/main-governance-guard.yml/runs?branch=main&per_page=100"
            )"
            governance_state="$(printf '%s' "$governance_json" | RELEASE_SHA="$release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["RELEASE_SHA"]; runs=[r for r in body.get("workflow_runs",[]) if r.get("head_sha")==sha and r.get("head_branch")=="main" and r.get("event")=="push"]; success=next((r for r in runs if r.get("status")=="completed" and r.get("conclusion")=="success"),None); failed=next((r for r in runs if r.get("status")=="completed" and r.get("conclusion") and r.get("conclusion")!="success"),None); print("success:"+str(success.get("id")) if success else ("failure:"+str(failed.get("conclusion"))+":"+str(failed.get("id")) if failed else "pending"))')"
            case "$governance_state" in
              success:*)
                echo "Main Governance Guard exact-SHA provenance confirmed: run ${governance_state#success:}"
                governance_confirmed=1
                break
                ;;
              failure:*)
                echo "Main Governance Guard failed closed for exact release SHA: ${governance_state#failure:}" >&2
                exit 1
                ;;
              pending)
                if (( attempt < 37 )); then
                  echo "Main Governance Guard for exact SHA ${release_sha:0:12} is not complete yet; bounded wait $attempt/36"
                  sleep 10
                fi
                ;;
              *)
                echo "unexpected Main Governance Guard resolution state: $governance_state" >&2
                exit 1
                ;;
            esac
          done
          [[ "$governance_confirmed" == '1' ]] || { echo 'release merge has no successful completed push-event Main Governance Guard run on main after bounded wait' >&2; exit 1; }

          recovery_json=''
          recovery_confirmed=0
          for attempt in $(seq 1 37); do
            recovery_json="$(
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/recovery-ci.yml/runs?branch=main&per_page=100"
            )"
            recovery_state="$(printf '%s' "$recovery_json" | RELEASE_SHA="$release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["RELEASE_SHA"]; runs=[r for r in body.get("workflow_runs",[]) if r.get("head_sha")==sha and r.get("head_branch")=="main"]; success=next((r for r in runs if r.get("status")=="completed" and r.get("conclusion")=="success"),None); failed=next((r for r in runs if r.get("status")=="completed" and r.get("conclusion") and r.get("conclusion")!="success"),None); print("success:"+str(success.get("id")) if success else ("failure:"+str(failed.get("conclusion"))+":"+str(failed.get("id")) if failed else "pending"))')"
            case "$recovery_state" in
              success:*)
                echo "Release Recovery CI provenance confirmed: run ${recovery_state#success:}"
                recovery_confirmed=1
                break
                ;;
              failure:*)
                echo "release merge Recovery CI failed closed: ${recovery_state#failure:}" >&2
                exit 1
                ;;
              pending)
                if (( attempt < 37 )); then
                  echo "Release Recovery CI for exact SHA ${release_sha:0:12} is not complete yet; bounded wait $attempt/36"
                  sleep 10
                fi
                ;;
              *)
                echo "unexpected Recovery CI resolution state: $recovery_state" >&2
                exit 1
                ;;
            esac
          done
          [[ "$recovery_confirmed" == '1' ]] || { echo 'release merge has no successful completed Recovery CI run on main after bounded wait' >&2; exit 1; }

          prior_launch_audit_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/production-launch-audit.yml/runs?branch=main&per_page=100"
          )"
          previous_release_sha=''
          while IFS= read -r candidate_sha; do
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            [[ "$candidate_sha" != "$release_sha" ]] || continue
            git cat-file -e "$candidate_sha^{commit}" 2>/dev/null || continue
            if git merge-base --is-ancestor "$candidate_sha" "$release_sha"; then
              previous_release_sha="$candidate_sha"
              break
            fi
          done < <(printf '%s' "$prior_launch_audit_json" | python3 -c 'import json,sys; body=json.load(sys.stdin); runs=body.get("workflow_runs",[]); [print(run.get("head_sha")) for run in runs if run.get("event")=="workflow_run" and run.get("status")=="completed" and run.get("conclusion")=="success" and isinstance(run.get("head_sha"),str)]')
          [[ "$previous_release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'no prior successful automatic production release audit found on the current first-parent ancestry' >&2; exit 1; }
          echo "Prior closed production release resolved: ${previous_release_sha:0:12}"

          prior_bf07_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/bf07-seal.yml/runs?branch=main&per_page=100"
          )"
          printf '%s' "$prior_bf07_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful BF-07 seal on main"); print("Prior BF-07 release baseline confirmed: run {}".format(match.get("id")))'

          prior_deploy_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/runs?branch=main&per_page=100"
          )"
          printf '%s' "$prior_deploy_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("event")=="workflow_run" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful automatic production deployment on main"); print("Prior production release baseline confirmed: run {}".format(match.get("id")))'

          prior_smoke_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/postdeploy-smoke.yml/runs?branch=main&per_page=100"
          )"
          printf '%s' "$prior_smoke_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("event")=="workflow_run" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful automatic post-deploy smoke on main"); print("Prior post-deploy smoke release baseline confirmed: run {}".format(match.get("id")))'

          printf '%s' "$prior_launch_audit_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("event")=="workflow_run" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful automatic Phase 0 launch audit on main"); print("Prior Phase 0 launch-audit release baseline confirmed: run {}".format(match.get("id")))'

          mapfile -t lineage_shas < <(git rev-list --first-parent --reverse "$previous_release_sha..$release_sha")
          (( ${#lineage_shas[@]} >= 1 )) || { echo 'release lineage contains no qualifying commits after the prior closed production release' >&2; exit 1; }
          [[ "$MAX_RELEASE_LINEAGE_MERGES" =~ ^[0-9]+$ ]] && (( MAX_RELEASE_LINEAGE_MERGES >= 1 && MAX_RELEASE_LINEAGE_MERGES <= 100 )) || { echo "invalid bounded release lineage review window: $MAX_RELEASE_LINEAGE_MERGES" >&2; exit 1; }
          (( ${#lineage_shas[@]} <= MAX_RELEASE_LINEAGE_MERGES )) || { echo "release lineage exceeds the bounded ${MAX_RELEASE_LINEAGE_MERGES}-merge review window: ${#lineage_shas[@]}" >&2; exit 1; }

          for lineage_sha in "${lineage_shas[@]}"; do
            read -r -a lineage_line <<< "$(git rev-list --parents -n 1 "$lineage_sha")"
            lineage_parent_count=$(( ${#lineage_line[@]} - 1 ))
            [[ "$lineage_parent_count" == '2' ]] || { echo "unreviewed first-parent commit detected between deployed releases: $lineage_sha has $lineage_parent_count parent(s)" >&2; exit 1; }

            lineage_pulls_json="$(
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$lineage_sha/pulls?per_page=100"
            )"
            printf '%s' "$lineage_pulls_json" | LINEAGE_SHA="$lineage_sha" python3 -c 'import json,os,sys; pulls=json.load(sys.stdin); sha=os.environ["LINEAGE_SHA"]; match=next((pr for pr in pulls if pr.get("merged_at") and pr.get("base",{}).get("ref")=="main" and pr.get("merge_commit_sha")==sha),None); match or sys.exit("first-parent release lineage contains a commit that is not an exact merged PR commit targeting main"); print("Lineage merged PR confirmed: #{}".format(match.get("number")))'

            lineage_commit_json="$(
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$lineage_sha"
            )"
            printf '%s' "$lineage_commit_json" | LINEAGE_SHA="$lineage_sha" python3 -c 'import json,os,sys; commit=json.load(sys.stdin); sha=os.environ["LINEAGE_SHA"]; verification=commit.get("commit",{}).get("verification",{}); (commit.get("sha")==sha and verification.get("verified") is True and verification.get("reason")=="valid") or sys.exit("first-parent release lineage contains a merge commit without a valid GitHub-verified signature"); print("Lineage merge signature verified by GitHub")'
          done

          lineage_sha_list="${lineage_shas[*]}"
          printf '%s' "$recovery_json" | LINEAGE_SHAS="$lineage_sha_list" python3 -c 'import json,os,sys; body=json.load(sys.stdin); lineage=os.environ["LINEAGE_SHAS"].split(); runs=body.get("workflow_runs",[]); missing=[sha for sha in lineage if not any(run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("status")=="completed" and run.get("conclusion")=="success" for run in runs)]; not missing or sys.exit("first-parent release lineage has merge commit(s) without successful Recovery CI on main: "+",".join(sha[:12] for sha in missing)); print("First-parent release lineage Recovery CI confirmed for {} merge(s)".format(len(lineage)))'
          echo "First-parent release lineage confirmed from closed baseline ${previous_release_sha:0:12} through release ${release_sha:0:12}"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify Node distribution toolchain pair
        shell: bash
        run: |
          set -euo pipefail
          npm run check:bf07-toolchain

      - name: Resolve BF-07 and seal exact artifact
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          chmod 0755 scripts/resolve-bf07.sh
          ./scripts/resolve-bf07.sh

      - name: Reconfirm exact current main at seal boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'BF-07 checkout moved before seal publication' >&2; exit 1; }
          live_main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$live_main_sha" == "$GITHUB_SHA" ]] || { echo "refusing to publish stale BF-07 seal: sealed=$GITHUB_SHA current-main=$live_main_sha" >&2; exit 1; }

      - name: Upload sealed artifact and BF-07 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bf07-sealed-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*_RELEASE_SEALED.zip
            dist/*_RELEASE_SEALED.zip.sha256
            package-lock.json
            sbom.cdx.json
            audit-report.json
            bf07-evidence.json
            bf07-provenance.json
            dist/bf07-verification/release-provenance.json