name: BF-07 Supply-Chain Seal
run-name: BF-07 seal ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character commit SHA that must be sealed'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: bf07-seal-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seal:
    name: Resolve BF-07 from clean npm registry state
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release commit and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected SHA must be a full lowercase commit SHA' >&2; exit 1; }
            [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "dispatch SHA mismatch: expected=$EXPECTED_SHA actual=$GITHUB_SHA" >&2; exit 1; }
          else
            [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo "automatic release trigger is restricted to main, got $GITHUB_REF" >&2; exit 1; }
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'automatic release SHA must be a full lowercase 40-character commit SHA' >&2; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'checkout HEAD does not match GITHUB_SHA' >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean before BF-07 resolution' >&2; exit 1; }

          release_message="$(git log -1 --format=%B "$GITHUB_SHA")"
          [[ "$release_message" =~ ^\[deploy\]([[:space:]]|$) ]] || { echo 'release authority must begin with [deploy]' >&2; exit 1; }

          read -r -a release_line <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          release_parent_count=$(( ${#release_line[@]} - 1 ))
          [[ "$release_parent_count" == '1' ]] || { echo "release marker must have exactly one parent, got $release_parent_count" >&2; exit 1; }
          parent_sha="${release_line[1]}"
          [[ "$parent_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'release parent SHA is invalid' >&2; exit 1; }

          release_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          parent_tree="$(git rev-parse "$parent_sha^{tree}")"
          [[ "$release_tree" == "$parent_tree" ]] || { echo 'release marker must be metadata-only and preserve the qualified parent tree exactly' >&2; exit 1; }

          read -r -a parent_line <<< "$(git rev-list --parents -n 1 "$parent_sha")"
          parent_parent_count=$(( ${#parent_line[@]} - 1 ))
          [[ "$parent_parent_count" == '2' ]] || { echo "qualified parent must be a two-parent merged PR commit, got $parent_parent_count parent(s)" >&2; exit 1; }

          pulls_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$parent_sha/pulls?per_page=100"
          )"
          printf '%s' "$pulls_json" | PARENT_SHA="$parent_sha" python3 -c 'import json,os,sys; pulls=json.load(sys.stdin); parent=os.environ["PARENT_SHA"]; match=next((pr for pr in pulls if pr.get("merged_at") and pr.get("base",{}).get("ref")=="main" and pr.get("merge_commit_sha")==parent),None); match or sys.exit("qualified parent is not the merge commit of a merged pull request targeting main"); print("Merged PR provenance confirmed: #{}".format(match.get("number")))'

          parent_commit_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$parent_sha"
          )"
          printf '%s' "$parent_commit_json" | PARENT_SHA="$parent_sha" python3 -c 'import json,os,sys; commit=json.load(sys.stdin); parent=os.environ["PARENT_SHA"]; verification=commit.get("commit",{}).get("verification",{}); (commit.get("sha")==parent and verification.get("verified") is True and verification.get("reason")=="valid") or sys.exit("qualified parent merge commit is not GitHub-verified with a valid signature"); print("Parent merge signature verified by GitHub")'

          recovery_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/recovery-ci.yml/runs?branch=main&per_page=100"
          )"
          printf '%s' "$recovery_json" | PARENT_SHA="$parent_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); parent=os.environ["PARENT_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==parent and run.get("head_branch")=="main" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("qualified parent has no successful completed Recovery CI run on main"); print("Parent Recovery CI provenance confirmed: run {}".format(match.get("id")))'

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify Node distribution toolchain pair
        shell: bash
        run: |
          set -euo pipefail
          npm run check:bf07-toolchain

      - name: Resolve BF-07 and seal exact artifact
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          chmod 0755 scripts/resolve-bf07.sh
          ./scripts/resolve-bf07.sh

      - name: Upload sealed artifact and BF-07 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bf07-sealed-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*_RELEASE_SEALED.zip
            dist/*_RELEASE_SEALED.zip.sha256
            package-lock.json
            sbom.cdx.json
            audit-report.json
            bf07-evidence.json
            bf07-provenance.json
            dist/bf07-verification/release-provenance.json
