name: BF-07 Supply-Chain Seal
run-name: BF-07 seal ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character current main merge SHA that must be sealed'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: bf07-seal-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  seal:
    name: Resolve BF-07 from clean npm registry state
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release commit and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$GITHUB_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected SHA must be a full lowercase commit SHA' >&2; exit 1; }
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'release candidate SHA must be a full lowercase 40-character commit SHA' >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$candidate_sha" ]] || { echo "dispatch SHA mismatch: expected=$EXPECTED_SHA actual=$candidate_sha" >&2; exit 1; }
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo "BF-07 dispatch must run from main, got $GITHUB_REF" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$candidate_sha" ]] || { echo 'checkout HEAD does not match release candidate SHA' >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean before BF-07 resolution' >&2; exit 1; }

          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$candidate_sha" == "$main_sha" ]] || { echo "release candidate is not exact current main: candidate=$candidate_sha main=$main_sha" >&2; exit 1; }

          read -r -a candidate_line <<< "$(git rev-list --parents -n 1 "$candidate_sha")"
          candidate_parent_count=$(( ${#candidate_line[@]} - 1 ))
          [[ "$candidate_parent_count" == '2' ]] || { echo "release candidate must be a two-parent merged PR commit, got $candidate_parent_count parent(s)" >&2; exit 1; }

          pulls_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$candidate_sha/pulls?per_page=100"
          )"
          printf '%s' "$pulls_json" | CANDIDATE_SHA="$candidate_sha" python3 -c 'import json,os,sys; pulls=json.load(sys.stdin); sha=os.environ["CANDIDATE_SHA"]; match=next((pr for pr in pulls if pr.get("merged_at") and pr.get("base",{}).get("ref")=="main" and pr.get("merge_commit_sha")==sha),None); match or sys.exit("release candidate is not the exact merge commit of a merged pull request targeting main"); print("Merged PR provenance confirmed: #{}".format(match.get("number")))'

          candidate_commit_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$candidate_sha"
          )"
          printf '%s' "$candidate_commit_json" | CANDIDATE_SHA="$candidate_sha" python3 -c 'import json,os,sys; commit=json.load(sys.stdin); sha=os.environ["CANDIDATE_SHA"]; verification=commit.get("commit",{}).get("verification",{}); (commit.get("sha")==sha and verification.get("verified") is True and verification.get("reason")=="valid") or sys.exit("release candidate merge commit is not GitHub-verified with a valid signature"); print("Release candidate merge signature verified by GitHub")'

          recovery_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/recovery-ci.yml/runs?branch=main&per_page=100"
          )"
          printf '%s' "$recovery_json" | CANDIDATE_SHA="$candidate_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["CANDIDATE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("release candidate has no successful completed Recovery CI run on main"); print("Candidate Recovery CI provenance confirmed: run {}".format(match.get("id")))'

          prior_launch_audit_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/production-launch-audit.yml/runs?branch=main&per_page=100"
          )"
          closed_release_shas="$(printf '%s' "$prior_launch_audit_json" | python3 -c 'import json,sys; body=json.load(sys.stdin); seen=set(); [print(r.get("head_sha")) or seen.add(r.get("head_sha")) for r in body.get("workflow_runs",[]) if r.get("event")=="workflow_run" and r.get("status")=="completed" and r.get("conclusion")=="success" and r.get("head_sha") and r.get("head_sha") not in seen]')"
          previous_release_sha=''
          while IFS= read -r ancestor_sha; do
            if grep -Fxq "$ancestor_sha" <<< "$closed_release_shas"; then
              previous_release_sha="$ancestor_sha"
              break
            fi
          done < <(git rev-list --first-parent "${candidate_sha}^1")
          [[ "$previous_release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'no prior fully closed production release found on candidate first-parent history' >&2; exit 1; }

          prior_bf07_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/bf07-seal.yml/runs?per_page=100"
          )"
          printf '%s' "$prior_bf07_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful BF-07 seal on main"); print("Prior BF-07 release baseline confirmed: run {}".format(match.get("id")))'

          prior_deploy_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/runs?per_page=100"
          )"
          printf '%s' "$prior_deploy_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("event")=="workflow_run" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful production deployment"); print("Prior production deployment baseline confirmed: run {}".format(match.get("id")))'

          prior_smoke_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/postdeploy-smoke.yml/runs?per_page=100"
          )"
          printf '%s' "$prior_smoke_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("event")=="workflow_run" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful automatic post-deploy smoke"); print("Prior post-deploy smoke baseline confirmed: run {}".format(match.get("id")))'

          printf '%s' "$prior_launch_audit_json" | PREVIOUS_RELEASE_SHA="$previous_release_sha" python3 -c 'import json,os,sys; body=json.load(sys.stdin); sha=os.environ["PREVIOUS_RELEASE_SHA"]; runs=body.get("workflow_runs",[]); match=next((run for run in runs if run.get("head_sha")==sha and run.get("event")=="workflow_run" and run.get("status")=="completed" and run.get("conclusion")=="success"),None); match or sys.exit("prior closed release has no successful automatic Phase 0 launch audit"); print("Prior Phase 0 launch-audit baseline confirmed: run {}".format(match.get("id")))'

          mapfile -t lineage_shas < <(git rev-list --first-parent --reverse "$previous_release_sha..$candidate_sha")
          (( ${#lineage_shas[@]} >= 1 )) || { echo 'release lineage contains no qualifying commits after the prior closed release' >&2; exit 1; }
          (( ${#lineage_shas[@]} <= 25 )) || { echo "release lineage exceeds the bounded 25-merge review window: ${#lineage_shas[@]}" >&2; exit 1; }

          for lineage_sha in "${lineage_shas[@]}"; do
            read -r -a lineage_line <<< "$(git rev-list --parents -n 1 "$lineage_sha")"
            lineage_parent_count=$(( ${#lineage_line[@]} - 1 ))
            [[ "$lineage_parent_count" == '2' ]] || { echo "unreviewed first-parent commit detected between closed releases: $lineage_sha has $lineage_parent_count parent(s)" >&2; exit 1; }

            lineage_pulls_json="$(
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$lineage_sha/pulls?per_page=100"
            )"
            printf '%s' "$lineage_pulls_json" | LINEAGE_SHA="$lineage_sha" python3 -c 'import json,os,sys; pulls=json.load(sys.stdin); sha=os.environ["LINEAGE_SHA"]; match=next((pr for pr in pulls if pr.get("merged_at") and pr.get("base",{}).get("ref")=="main" and pr.get("merge_commit_sha")==sha),None); match or sys.exit("first-parent release lineage contains a commit that is not an exact merged PR commit targeting main"); print("Lineage merged PR confirmed: #{}".format(match.get("number")))'

            lineage_commit_json="$(
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$lineage_sha"
            )"
            printf '%s' "$lineage_commit_json" | LINEAGE_SHA="$lineage_sha" python3 -c 'import json,os,sys; commit=json.load(sys.stdin); sha=os.environ["LINEAGE_SHA"]; verification=commit.get("commit",{}).get("verification",{}); (commit.get("sha")==sha and verification.get("verified") is True and verification.get("reason")=="valid") or sys.exit("first-parent release lineage contains a merge commit without a valid GitHub-verified signature"); print("Lineage merge signature verified by GitHub")'
          done

          lineage_sha_list="${lineage_shas[*]}"
          printf '%s' "$recovery_json" | LINEAGE_SHAS="$lineage_sha_list" python3 -c 'import json,os,sys; body=json.load(sys.stdin); lineage=os.environ["LINEAGE_SHAS"].split(); runs=body.get("workflow_runs",[]); missing=[sha for sha in lineage if not any(run.get("head_sha")==sha and run.get("head_branch")=="main" and run.get("status")=="completed" and run.get("conclusion")=="success" for run in runs)]; not missing or sys.exit("first-parent release lineage has merge commit(s) without successful Recovery CI on main: "+",".join(sha[:12] for sha in missing)); print("First-parent release lineage Recovery CI confirmed for {} merge(s)".format(len(lineage)))'
          echo "First-parent release lineage confirmed from closed baseline ${previous_release_sha:0:12} through candidate ${candidate_sha:0:12}"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify Node distribution toolchain pair
        shell: bash
        run: |
          set -euo pipefail
          npm run check:bf07-toolchain

      - name: Resolve BF-07 and seal exact artifact
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          chmod 0755 scripts/resolve-bf07.sh
          ./scripts/resolve-bf07.sh

      - name: Upload sealed artifact and BF-07 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bf07-sealed-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*_RELEASE_SEALED.zip
            dist/*_RELEASE_SEALED.zip.sha256
            package-lock.json
            sbom.cdx.json
            audit-report.json
            bf07-evidence.json
            bf07-provenance.json
            dist/bf07-verification/release-provenance.json
