name: AI export read-only retention audit
on:
  pull_request:
    paths:
      - 'server/ai-document-export-retention-audit.js'
      - 'tests/ai-document-export-retention-audit.test.mjs'
      - '.github/workflows/ai-export-retention-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-document-export-retention-audit.test.mjs
