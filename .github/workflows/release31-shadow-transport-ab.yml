name: Release 31 shadow transport A/B proof

on:
  push:
    branches:
      - diag/release31-shadow-transport-ab-20260916

permissions:
  contents: read

env:
  EXPECTED_SHA: 3b39936093956c8b7ed2bdcb2415aa336e094ae6

jobs:
  prove:
    name: Prove authenticated reload over existing shadow transport
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}

    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact production authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_SHA" ]]
          git cat-file -e "$EXPECTED_SHA^{commit}"
          manifest="$(git show "$EXPECTED_SHA:release/production.json")"
          MANIFEST="$manifest" node -e 'const m=JSON.parse(process.env.MANIFEST);const e={schema:1,release:"production",sequence:31,sourceSha:"515534accc6dc04ad10b0928c929251b589c4714"};if(JSON.stringify(m)!==JSON.stringify(e))throw new Error("release manifest mismatch")'

      - name: Checkout exact deployed source into worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/release31" "$EXPECTED_SHA"
          cp scripts/release31-shadow-ab-patch.mjs "$RUNNER_TEMP/release31/scripts/release31-shadow-ab-patch.mjs"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install exact dependencies and browser driver
        working-directory: ${{ runner.temp }}/release31
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "String(require('./package.json').packageManager).replace(/^npm@/,'')")"
          actual="$(npm --version)"
          [[ "$actual" == "$expected" ]]
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Recover bounded interrupted synthetic residue
        working-directory: ${{ runner.temp }}/release31
        shell: bash
        run: node scripts/production-synthetic-interruption-recovery.mjs

      - name: Build temporary shadow-transport canonical wrapper
        working-directory: ${{ runner.temp }}/release31
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release31-shadow-ab-patch.mjs
          grep -Fq 'installShadowTransport(page)' scripts/.shadow-transport-ab.mjs
          grep -Fq 'installShadowTransport(mobilePage)' scripts/.shadow-transport-ab.mjs
          node --check scripts/.shadow-transport-ab.mjs

      - name: Run canonical synthetic lifecycle with shadow transport A/B
        working-directory: ${{ runner.temp }}/release31
        shell: bash
        run: node scripts/.shadow-transport-ab.mjs

      - name: Remove temporary diagnostic files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/release31"
