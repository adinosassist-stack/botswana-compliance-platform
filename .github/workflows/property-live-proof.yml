name: Property live proof
run-name: Property live proof ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - "cloudflare/src/production-entry.js"
      - "public/js/workspace-runtime-*"
      - "public/assets/workspace-view-fragments-*"
      - "scripts/production-property-live-proof.mjs"
      - ".github/workflows/property-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-live-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Verify live Property calculator assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Prove the production Property calculator is live
        env:
          PROPERTY_ORIGIN: https://thebedesk.com
        run: |
          set -euo pipefail
          node --check scripts/production-property-live-proof.mjs
          node scripts/production-property-live-proof.mjs
