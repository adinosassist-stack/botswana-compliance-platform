name: Thebe Desk Production V115 Manual Bank Migration
run-name: V115 manual bank migration ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    concurrency:
      group: thebe-desk-production
      cancel-in-progress: false
    name: Apply reviewed manual bank migration 050
    if: contains(github.event.head_commit.message, '[migrate-050]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

    steps:
      - name: Checkout exact migration authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale migration target=$target current-main=$main_sha" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Validate production migration inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Invalid CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          [[ "$D1_DATABASE_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || { echo 'Invalid D1_DATABASE_ID' >&2; exit 1; }

      - name: Apply guarded forward-only migration 050
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate-production-v115-manual-bank-subscriptions.mjs

      - name: Verify live production remains healthy after schema expansion
        shell: bash
        run: |
          set -euo pipefail
          body=''
          status=''
          for attempt in {1..12}; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 --output "$tmp" --write-out '%{http_code}' 'https://thebedesk.com/api/ready' || true)"
            body="$(cat "$tmp")"
            rm -f "$tmp"
            if [[ "$status" == '200' ]]; then break; fi
            compact="$(printf '%s' "$body" | tr '\n' ' ' | cut -c1-500)"
            echo "post-migration readiness attempt $attempt/12 status=${status:-curl_error} body=${compact:-<empty>}" >&2
            if (( attempt < 12 )); then sleep 5; fi
          done
          [[ "$status" == '200' ]] || { echo 'production readiness unhealthy after migration 050' >&2; exit 1; }
          READY_JSON="$body" node <<'NODE'
          const ready=JSON.parse(process.env.READY_JSON);
          if(ready.ok!==true||ready.schemaReady!==true||ready.requiredConfigReady!==true){
            throw new Error(`production readiness unhealthy after migration 050 schemaReady=${String(ready.schemaReady)} error=${String(ready.error||'')}`);
          }
          console.log(`Production remained healthy after schema 050 expansion: version=${ready.version||'unknown'} currentWorkerDelta=${ready.latestSchemaDelta||'unknown'}`);
          NODE
