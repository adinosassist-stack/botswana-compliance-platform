name: Workspace Agent authenticated Chromium

on:
  pull_request:
    paths:
      - "public/js/workspace-agent-*.js"
      - "cloudflare/src/release-governance-entry.js"
      - "tests/workspace-agent-app-shell-browser.mjs"
      - ".github/workflows/workspace-agent-app-shell-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - run: node --check tests/workspace-agent-app-shell-browser.mjs
      - run: node tests/workspace-agent-app-shell-browser.mjs
