name: Historical backup receipt offline reconciliation
on:
  pull_request:
    paths:
      - scripts/reconcile-historical-private-candidate-offline.mjs
      - tests/reconcile-historical-private-candidate-offline.test.mjs
      - .github/workflows/historical-backup-receipt-offline.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reject historical evidence forgery without network access
        run: node --test tests/reconcile-historical-private-candidate-offline.test.mjs tests/plan-versioned-recovery-offline.test.mjs tests/pop-private-backup-evidence-offline.test.mjs
