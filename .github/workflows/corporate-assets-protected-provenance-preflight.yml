name: Corporate Assets protected provenance preflight
on:
  pull_request:
    paths:
      - '.github/workflows/corporate-assets-protected-provenance-preflight.yml'
      - 'scripts/corporate-assets-protected-provenance-preflight.mjs'
      - 'tests/corporate-assets-protected-provenance-preflight.test.mjs'
      - 'scripts/corporate-assets-complete-readonly-evidence.mjs'
      - 'tests/corporate-assets-complete-readonly-evidence.test.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only protected preflight only (never upload or deploy)
        type: choice
        required: true
        default: preflight-only
        options:
          - preflight-only
      expected_main_sha:
        description: Exact reviewed main SHA, checked against live main
        required: true
        type: string
      authorization:
        description: Explicit authorization for metadata-only verification
        required: true
        type: string
        default: READ_ONLY_ASSETS_SOURCE_PREFLIGHT
permissions:
  contents: read
concurrency:
  group: corporate-assets-protected-provenance-readonly
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Source syntax and adversarial regressions, no tokens
        run: |
          node --check scripts/corporate-assets-protected-provenance-preflight.mjs
          node --test tests/corporate-assets-protected-provenance-preflight.test.mjs
          node --check scripts/corporate-assets-complete-readonly-evidence.mjs
          node --test tests/corporate-assets-complete-readonly-evidence.test.mjs
  protected-readonly:
    needs: offline
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'preflight-only' &&
      inputs.authorization == 'READ_ONLY_ASSETS_SOURCE_PREFLIGHT'
    environment: corporate-assets-staging-protected
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      ASSETS_STAGING_GITHUB_READ_TOKEN: ${{ secrets.ASSETS_STAGING_GITHUB_READ_TOKEN }}
      ASSETS_STAGING_CLOUDFLARE_TOKEN: ${{ secrets.ASSETS_STAGING_CLOUDFLARE_TOKEN }}
    steps:
      - name: Refuse wrong branch, stale commit and missing read credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          test -n "$ASSETS_STAGING_GITHUB_READ_TOKEN"
          test -n "$ASSETS_STAGING_CLOUDFLARE_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact checked-out commit and run offline tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          node --test tests/corporate-assets-protected-provenance-preflight.test.mjs
      - name: Read-only GitHub policy, source inputs and Cloudflare metadata
        run: node scripts/corporate-assets-protected-provenance-preflight.mjs

      - name: Verify account-wide private exposure with source hold (GET only)
        run: node scripts/corporate-assets-complete-readonly-evidence.mjs
