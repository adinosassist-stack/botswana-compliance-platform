name: Temporary v21 production proof repair

on:
  push:
    branches:
      - chatgpt/v21-production-proof-20261016
    paths:
      - '.github/workflows/tmp-v21-production-proof-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/v21-production-proof-20261016
          fetch-depth: 0

      - name: Apply and verify v21 production proof repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-v21-production-proof-fix.py
          node --check scripts/production-synthetic-full-user-wrapper.mjs
          node --check scripts/production-mobile-postdeploy-smoke.mjs
          node --check tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v250-market-refinement-v21-static.mjs
          git diff --check

      - name: Commit exact source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-release-bot'
          git config user.email 'thebe-release-bot@users.noreply.github.com'
          git add scripts/production-synthetic-full-user-wrapper.mjs scripts/production-mobile-postdeploy-smoke.mjs tests/v82-phase0-launch-audit-deferred-integrations.mjs
          git commit -m 'Align production proofs with market refinement v21'
          git push origin HEAD:chatgpt/v21-production-proof-20261016
