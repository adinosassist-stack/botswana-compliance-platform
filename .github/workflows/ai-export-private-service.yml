name: AI export private service qualification
on:
  pull_request:
    paths:
      - 'server/ai-document-export-service.js'
      - 'tests/ai-document-export-service.test.mjs'
      - '.github/workflows/ai-export-private-service.yml'
permissions:
  contents: read
jobs:
  private-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-document-export-service.test.mjs
