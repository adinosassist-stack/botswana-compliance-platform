name: Apply verified AI context patch

on:
  push:
    branches:
      - chatgpt/ai-context-compaction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Apply exact scoped patch
        run: node scripts/apply-ai-context-compaction.mjs

      - name: Verify syntax and context contracts
        run: |
          node --check cloudflare/src/ai-advisor-context-compaction.js
          node --check cloudflare/src/worker.js
          node --check public/js/owner-command-centre.js
          node tests/v116-thebe-super-agent-ask-anything.mjs
          node tests/v329-ai-advisor-context-compaction.mjs
          git diff --check

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-ai-context-compaction.mjs
          rm .github/workflows/export-worker-snapshot.yml

      - name: Verify final scoped file set
        run: |
          git add -A
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "cloudflare/src/ai-advisor-context-compaction.js cloudflare/src/worker.js public/js/owner-command-centre.js tests/v116-thebe-super-agent-ask-anything.mjs tests/v329-ai-advisor-context-compaction.mjs "
          git diff --cached --check

      - name: Commit verified patch
        run: |
          git config user.name "adinosassist-stack"
          git config user.email "adinosassist@gmail.com"
          git commit -m "fix: bound advisor workspace context truthfully"
          git push origin HEAD:chatgpt/ai-context-compaction
