name: Export AI context sources

on:
  push:
    branches:
      - chatgpt/ai-context-compaction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Upload exact AI context sources
        uses: actions/upload-artifact@v4
        with:
          name: ai-context-sources
          path: |
            cloudflare/src/worker.js
            public/js/owner-command-centre.js
          if-no-files-found: error
          retention-days: 1
