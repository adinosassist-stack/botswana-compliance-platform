name: Live registration lifecycle closure
run-name: Live registration lifecycle closure ${{ github.sha }}

on:
  push:
    branches:
      - verify/live-user-smoke-20260913
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thebe-desk-live-registration-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Register login purge and prove invalidation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORIGIN: https://thebedesk.com
      EXPECTED_PRODUCTION_SHA: d260b3e63d9907be5d8b4110f8dd8922ac3f4e48

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse production drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$main_sha" == "$EXPECTED_PRODUCTION_SHA" ]] || {
            echo "main moved: $main_sha expected=$EXPECTED_PRODUCTION_SHA; refusing live mutation" >&2
            exit 1
          }
          echo "PASS production SHA authority $EXPECTED_PRODUCTION_SHA"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install browser driver only
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Execute live synthetic account lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {chromium} from 'playwright-core';

          const origin=process.env.ORIGIN;
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
          assert.ok(executablePath,'no Chromium-compatible browser found');

          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const page=await context.newPage();
          const pageErrors=[];
          page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));

          const suffix=`${Date.now()}-${crypto.randomBytes(5).toString('hex')}`;
          const email=`thebedesk-lifecycle-${suffix}@example.com`;
          const companyName=`Thebe Desk Lifecycle ${suffix.slice(-8)}`;
          const password=`Td!Lifecycle-${crypto.randomBytes(18).toString('base64url')}`;

          let registered=false;
          let cleanupConfirmed=false;
          let primaryError=null;

          async function openRuntime(){
            await page.goto(origin+'/register-direct.html',{waitUntil:'networkidle',timeout:45000});
            await page.waitForFunction(()=>!!window.BW?.api?.createClient,{timeout:15000});
          }

          async function call(operation,args={}){
            return page.evaluate(async ({operation,args})=>{
              const state=window.__lifecycleSmokeState||(window.__lifecycleSmokeState={csrf:''});
              const client=window.BW.api.createClient({getCsrfToken:()=>state.csrf,onUnauthorized:()=>{},onError:()=>{},timeoutMs:25000,retries:0});

              async function solveProof(){
                const challenge=await client.request('/api/auth/registration-proof/challenge',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
                const token=String(challenge?.token||''),difficulty=Number(challenge?.difficulty||0);
                if(!token||difficulty<8||difficulty>16)throw new Error('invalid registration proof challenge');
                const encoder=new TextEncoder();
                const leadingZeroBits=(bytes,bits)=>{let remaining=bits;for(const value of bytes){if(remaining<=0)return true;const take=Math.min(8,remaining);if((value>>(8-take))!==0)return false;remaining-=take}return remaining<=0};
                for(let counter=0;counter<=500000;counter++){
                  const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',encoder.encode(`${token}:${counter}`)));
                  if(leadingZeroBits(digest,difficulty))return JSON.stringify({challenge:token,counter,honeypot:''});
                  if(counter&&counter%512===0)await new Promise(resolve=>setTimeout(resolve,0));
                }
                throw new Error('registration proof solve limit exceeded');
              }

              if(operation==='register'){
                const turnstileToken=await solveProof();
                return client.request('/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...args,turnstileToken})});
              }
              if(operation==='login'){
                const result=await client.request('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(args)});
                state.csrf=String(result?.csrfToken||'');
                return result;
              }
              if(operation==='me'){
                const result=await client.request('/api/auth/me');
                if(result?.csrfToken)state.csrf=String(result.csrfToken);
                return result;
              }
              if(operation==='delete-request')return client.request('/api/account/deletion-request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirmation:'DELETE MY ACCOUNT',reason:'Automated production registration lifecycle verification; synthetic account only.'})});
              if(operation==='approve')return client.request(`/api/account/deletion/${encodeURIComponent(args.id)}/approve`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
              if(operation==='execute')return client.request(`/api/account/deletion/${encodeURIComponent(args.id)}/execute`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
              throw new Error(`unknown operation ${operation}`);
            },{operation,args});
          }

          async function loginExpectSuccess(){
            const login=await call('login',{email,password});
            assert.equal(login?.ok,true,'login did not return ok=true');
            assert.equal(String(login?.user?.email||'').toLowerCase(),email.toLowerCase(),'login email mismatch');
            assert.equal(login?.user?.role,'owner','synthetic registrant is not owner');
            assert.ok(String(login?.csrfToken||'').length>=16,'missing CSRF token');
            return login;
          }

          async function deleteSyntheticTenant(){
            const request=await call('delete-request');
            assert.equal(request?.ok,true,'deletion request not accepted');
            assert.ok(request?.id,'deletion request id missing');
            if(request.status==='blocked')throw new Error('synthetic account unexpectedly blocked by legal hold');
            if(request.status!=='approved'&&request.status!=='processing'){
              const approved=await call('approve',{id:request.id});
              assert.equal(approved?.ok,true,'deletion approval failed');
              assert.equal(approved?.status,'approved','deletion approval status mismatch');
            }
            const executed=await call('execute',{id:request.id});
            assert.equal(executed?.ok,true,'deletion execution failed');
            assert.equal(executed?.status,'completed','deletion did not complete');
            cleanupConfirmed=true;
            return executed;
          }

          async function loginMustFailAfterCleanup(){
            try{
              await call('login',{email,password});
              throw new Error('credential resurrection: login succeeded after purge');
            }catch(error){
              if(String(error?.message||'').includes('credential resurrection'))throw error;
              assert.equal(Number(error?.status||0),401,`post-cleanup login status ${error?.status} code=${error?.code}`);
              assert.equal(String(error?.code||''),'invalid_credentials',`post-cleanup login code ${error?.code}`);
            }
          }

          async function meMustFailAfterCleanup(){
            try{
              await call('me');
              throw new Error('session resurrection: auth/me succeeded after purge');
            }catch(error){
              if(String(error?.message||'').includes('session resurrection'))throw error;
              assert.equal(Number(error?.status||0),401,`post-cleanup auth/me status ${error?.status} code=${error?.code}`);
              assert.equal(String(error?.code||''),'unauthenticated',`post-cleanup auth/me code ${error?.code}`);
            }
          }

          try{
            await openRuntime();
            const registration=await call('register',{companyName,email,password});
            assert.equal(registration?.ok,true,'registration did not return ok=true');
            registered=true;
            console.log('PASS live synthetic registration');

            await loginExpectSuccess();
            console.log('PASS live synthetic login');

            const me=await call('me');
            assert.equal(String(me?.user?.email||'').toLowerCase(),email.toLowerCase(),'auth/me email mismatch');
            assert.equal(me?.user?.role,'owner','auth/me role mismatch');
            console.log('PASS authenticated session identity');

            const deleted=await deleteSyntheticTenant();
            console.log(`PASS synthetic tenant purge status=${deleted.status} orphanUsersPurged=${deleted.orphanUsersPurged ?? 'n/a'}`);

            await loginMustFailAfterCleanup();
            console.log('PASS post-purge credential invalidation');
            await meMustFailAfterCleanup();
            console.log('PASS post-purge session invalidation');
          }catch(error){
            primaryError=error;
            console.error('PRIMARY_PROOF_FAILURE',String(error?.stack||error));
          }finally{
            if(registered&&!cleanupConfirmed){
              console.log('Attempting fail-safe cleanup after primary proof failure');
              try{
                await openRuntime();
                await loginExpectSuccess();
                const deleted=await deleteSyntheticTenant();
                console.log(`PASS fail-safe cleanup status=${deleted.status}`);
              }catch(cleanupError){
                console.error('CLEANUP_FAILURE',String(cleanupError?.stack||cleanupError));
                console.error(`SYNTHETIC_ACCOUNT_REQUIRES_CLEANUP email=${email}`);
                primaryError=primaryError||cleanupError;
              }
            }
            await browser.close();
          }

          assert.deepEqual(pageErrors,[],'unexpected page errors');
          assert.equal(registered,true,'synthetic account was never registered');
          assert.equal(cleanupConfirmed,true,'synthetic account cleanup was not confirmed');
          if(primaryError)throw primaryError;
          console.log('LIVE_REGISTRATION_LOGIN_CLEANUP_PASS');
          NODE
