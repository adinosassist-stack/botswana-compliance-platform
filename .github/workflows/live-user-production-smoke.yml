name: Fix branch deletion ordering verifier
run-name: Fix branch deletion ordering verifier ${{ github.sha }}

on:
  push:
    branches:
      - verify/live-user-smoke-20260913

permissions:
  contents: write

concurrency:
  group: thebe-desk-fix-branch-deletion-ordering
  cancel-in-progress: false

jobs:
  patch-test-commit:
    name: Patch test and commit fix branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/deletion-tombstone-order-20260914
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Apply exact ordering patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-deletion-tombstone-order.py
          git diff --check

      - name: Run deletion safety regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/worker.js
          node tests/v78-deletion-tombstone-order-regression.mjs
          node tests/v78-12152-tenant-deletion-purge-runtime.mjs
          node tests/v78-12115-deletion-route-adversarial.mjs

      - name: Commit tested patch to fix branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/worker.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'No worker change produced'; exit 1; }
          git commit -m 'fix: preserve deletion tombstone before user cascade'
          git push origin HEAD:fix/deletion-tombstone-order-20260914
