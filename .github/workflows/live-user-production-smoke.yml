name: Clean deletion fix branch verifier
run-name: Clean deletion fix branch verifier ${{ github.sha }}

on:
  push:
    branches:
      - verify/live-user-smoke-20260913

permissions:
  contents: write

concurrency:
  group: thebe-desk-clean-deletion-fix
  cancel-in-progress: false

jobs:
  qualify-clean-branch:
    name: Cherry-pick and qualify clean deletion fix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: 612928ed2a251451cd0d763c3a55106357041df7
      CLEAN_BRANCH: fix/deletion-tombstone-order-clean-20260914
      TEST_COMMIT: d487d8ca48399090ea865239a0d8377d5b30a620
      WORKER_COMMIT: 90b270f91b47740b475780508f63f33a9aac814a
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/deletion-tombstone-order-clean-20260914
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse main drift and apply only reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/deletion-tombstone-order-20260914
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "main moved: $main_sha expected=$EXPECTED_MAIN_SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "clean branch no longer starts at expected main" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick "$TEST_COMMIT"
          git cherry-pick "$WORKER_COMMIT"
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD | sort)"
          expected=$'cloudflare/src/worker.js\ntests/v78-deletion-tombstone-order-regression.mjs'
          [[ "$changed" == "$expected" ]] || {
            echo "unexpected clean-branch diff:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git diff --check "$EXPECTED_MAIN_SHA" HEAD

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Run deletion safety regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/worker.js
          node tests/v78-deletion-tombstone-order-regression.mjs
          node tests/v78-12152-tenant-deletion-purge-runtime.mjs
          node tests/v78-12115-deletion-route-adversarial.mjs

      - name: Push qualified clean branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$CLEAN_BRANCH"
