name: V319 Ask Thebe render qualification
run-name: V319 Ask Thebe render ${{ github.event.pull_request.head.sha }}

on:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Syntax and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/owner-ask-thebe-render-v319.js
          node --check public/js/workspace-readiness-v305.js
          node --check tests/v319-owner-ask-render-decoupling.mjs
          node tests/v319-owner-ask-render-decoupling.mjs
