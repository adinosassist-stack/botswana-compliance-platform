name: Thebe Desk Phase 0 Production Launch Audit
run-name: Phase 0 launch audit ${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed commit SHA to audit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thebe-desk-production-launch-audit-${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit exact deployed Phase 0 build
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: thebe_redteam
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d thebe_redteam"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact deployed authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact deployment trigger
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid EXPECTED_DEPLOY_SHA=$EXPECTED_DEPLOY_SHA" >&2; exit 1; }
          [[ "$target" == "$EXPECTED_DEPLOY_SHA" ]] || { echo "checkout mismatch target=$target expected=$EXPECTED_DEPLOY_SHA" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo 'refusing non-success deployment trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]] || { echo 'refusing non-main deployment trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_sha }}" == "$target" ]] || { echo 'workflow_run SHA mismatch' >&2; exit 1; }
          fi
          git cat-file -e "$target^{commit}"
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify pinned npm and install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "String(require('./package.json').packageManager).replace(/^npm@/,'')")"
          actual="$(npm --version)"
          [[ "$actual" == "$expected" ]] || { echo "npm mismatch expected=$expected actual=$actual" >&2; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Isolated sign-up, sign-in and workspace lifecycle
        shell: bash
        env:
          APP_ENV: test
          PORT: '3100'
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/thebe_redteam
          PUBLIC_ORIGIN: http://127.0.0.1:3100
          PUBLIC_APP_URL: http://127.0.0.1:3100
          TRUST_PROXY_HOPS: '0'
          TEST_BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          export SESSION_SECRET="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          npm run migrate
          node server/server.js >/tmp/thebe-redteam-server.log 2>&1 &
          server_pid=$!
          cleanup(){ kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/live >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then cat /tmp/thebe-redteam-server.log >&2 || true; exit 1; fi
          npm run test:api || { cat /tmp/thebe-redteam-server.log >&2 || true; exit 1; }

      - name: Final UI, auth, workspace, SEO and security red-team
        shell: bash
        run: |
          set -euo pipefail
          node tests/v82-final-build-redteam.mjs
          node tests/ui-functionality-static.mjs
          node tests/v78-12146-ui-runtime-wiring-adversarial.mjs
          node tests/v78-home-navigation-adversarial.mjs
          node tests/v78-role-isolation-static.mjs
          node tests/v78-12114-role-api-adversarial.mjs
          node tests/v78-12116-seo-adversarial.mjs
          node tests/v78-12116-seo-runtime.mjs
          node tests/v78-12149-auth-input-runtime.mjs
          node tests/v78-12152-tenant-deletion-purge-runtime.mjs
          node tests/v78-12162-password-reset-email-delivery-adversarial.mjs
          node tests/v78-12179-request-encoding-abuse-runtime.mjs
          node tests/v78-12188-oauth-redirect-config-hardening-adversarial.mjs
          node tests/v78-12194-oauth-state-cookie-hardening-adversarial.mjs
          node tests/v81-auth-workspace-selection-adversarial.mjs
          node tests/v81-standalone-auth-role-preview-runtime.mjs
          node tests/v82-whatsapp-owner-centre.mjs

      - name: Audit live production without creating customer data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-launch-audit.mjs
