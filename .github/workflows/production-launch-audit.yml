name: Thebe Desk Phase 0 Production Launch Audit
run-name: Phase 0 launch audit ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Exact Post-Deploy Smoke"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: thebe-desk-production-launch-audit-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit live Phase 0 beta readiness
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      AUDIT_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

    steps:
      - name: Checkout exact audit authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUDIT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid AUDIT_SHA=$AUDIT_SHA" >&2; exit 1; }
          target="$(git rev-parse HEAD)"
          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$target" == "$AUDIT_SHA" ]] || { echo "audit checkout mismatch target=$target expected=$AUDIT_SHA" >&2; exit 1; }
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale launch audit target=$target current-main=$main_sha" >&2; exit 1; }
          [[ "${{ github.event_name }}" == "workflow_run" ]] || { echo 'refusing non-workflow_run launch audit trigger' >&2; exit 1; }
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo 'refusing non-success post-deploy smoke trigger' >&2; exit 1; }
          [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]] || { echo 'refusing non-main post-deploy smoke trigger' >&2; exit 1; }
          [[ "${{ github.event.workflow_run.head_sha }}" == "$AUDIT_SHA" ]] || { echo 'post-deploy smoke SHA mismatch' >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }
          echo "Exact live audit authority confirmed: $AUDIT_SHA"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify pinned npm and install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "String(require('./package.json').packageManager).replace(/^npm@/,'')")"
          actual="$(npm --version)"
          [[ "$actual" == "$expected" ]] || { echo "npm mismatch expected=$expected actual=$actual" >&2; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused authentication, role and AI regression audit
        shell: bash
        run: |
          set -euo pipefail
          node tests/v82-audit-remediation-static.mjs
          node tests/v78-role-isolation-static.mjs
          node tests/v78-12114-role-api-adversarial.mjs
          node tests/v78-ai-copilot-motion-security.mjs
          node tests/v73-daily-operations-reporting-static.mjs
          node tests/v74-performance-learning-static.mjs
          node tests/v81-auth-workspace-selection-adversarial.mjs
          node tests/v78-12162-password-reset-email-delivery-adversarial.mjs
          node tests/v78-12188-oauth-redirect-config-hardening-adversarial.mjs
          node tests/v78-12194-oauth-state-cookie-hardening-adversarial.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs
          node tests/v163-thebe-dock-release-identity.mjs

      - name: Audit live production without creating customer data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-launch-audit.mjs

      - name: Mandatory browser-backed synthetic full-user lifecycle closure
        if: github.event_name == 'workflow_run'
        env:
          AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-synthetic-interruption-recovery.mjs
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          node tests/v246-spatial-dock-browser.mjs

          # The compact workspace now exposes four real, visible cross-view buttons while
          # every owner destination is independently exercised through the primary/specialist
          # navigation matrix above. Calibrate only this legacy button-count guard and fail
          # closed if any of the stronger route/action invariants or source assumptions drift.
          generated="scripts/.production-synthetic-full-user-wrapper.phase0.mjs"
          trap 'rm -f "$generated"' EXIT
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/production-synthetic-full-user-wrapper.mjs')
          generated_path = Path('scripts/.production-synthetic-full-user-wrapper.phase0.mjs')
          source = source_path.read_text(encoding='utf-8')

          required = (
              "const MIN_OWNER_VIEW_COUNT=8;",
              "const MIN_SAFE_UI_ACTION_COUNT=5;",
              "const MIN_OWNER_INVIEW_NAV_CONTROL_COUNT=7;",
          )
          for invariant in required:
              if source.count(invariant) != 1:
                  raise SystemExit(f'Phase 0 navigation calibration refused unexpected source invariant: {invariant}')

          old_comment = "// Property/Money separation intentionally removed the two reciprocal cross-hub buttons; retain a seven-control minimum as the current non-destructive in-view navigation baseline."
          new_comment = "// Compact workspace decluttering leaves four visible cross-view buttons; all 8+ owner destinations are independently exercised through the primary/specialist navigation matrix."
          if source.count(old_comment) != 1:
              raise SystemExit('Phase 0 navigation calibration refused unexpected baseline comment')

          calibrated = source.replace(old_comment, new_comment).replace(
              "const MIN_OWNER_INVIEW_NAV_CONTROL_COUNT=7;",
              "const MIN_OWNER_INVIEW_NAV_CONTROL_COUNT=4;",
          )
          generated_path.write_text(calibrated, encoding='utf-8')
          print('Phase 0 compact navigation calibration: owner views >=8; visible in-view controls >=4; safe UI actions >=5')
          PY
          node "$generated"
          rm -f "$generated"
          trap - EXIT
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'audit calibration left the checkout dirty' >&2; exit 1; }

      - name: One-shot bounded legacy orphan cleanup
        if: github.event_name == 'workflow_run'
        env:
          AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --pretty=%B | grep -Fq '[legacy-orphan-cleanup]'; then
            echo 'Legacy orphan cleanup marker absent; keeping this step read-only.'
            exit 0
          fi
          node scripts/production-legacy-orphan-cleanup.mjs

      - name: Enforce permanent zero-orphan baseline
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-zero-orphan-audit.mjs
