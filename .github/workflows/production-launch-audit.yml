name: Thebe Desk Phase 0 Production Launch Audit
run-name: Phase 0 launch audit ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

on:
  workflow_run:
    workflows: ["Thebe Desk Exact Post-Deploy Smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact deployed main commit SHA to audit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thebe-desk-production-launch-audit-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit live Phase 0 beta readiness
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      AUDIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

    steps:
      - name: Checkout exact audit authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUDIT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid AUDIT_SHA=$AUDIT_SHA" >&2; exit 1; }
          target="$(git rev-parse HEAD)"
          main_sha="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])'
          )"
          [[ "$target" == "$AUDIT_SHA" ]] || { echo "audit checkout mismatch target=$target expected=$AUDIT_SHA" >&2; exit 1; }
          [[ "$target" == "$main_sha" ]] || { echo "refusing stale launch audit target=$target current-main=$main_sha" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo 'refusing non-success post-deploy smoke trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]] || { echo 'refusing non-main post-deploy smoke trigger' >&2; exit 1; }
            [[ "${{ github.event.workflow_run.head_sha }}" == "$AUDIT_SHA" ]] || { echo 'post-deploy smoke SHA mismatch' >&2; exit 1; }
          else
            [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || { echo 'unsupported launch audit trigger' >&2; exit 1; }
          fi
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'checkout is not clean' >&2; exit 1; }
          echo "Exact live audit authority confirmed: $AUDIT_SHA"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify pinned npm and install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "String(require('./package.json').packageManager).replace(/^npm@/,'')")"
          actual="$(npm --version)"
          [[ "$actual" == "$expected" ]] || { echo "npm mismatch expected=$expected actual=$actual" >&2; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused authentication, role and AI regression audit
        shell: bash
        run: |
          set -euo pipefail
          node tests/v78-role-isolation-static.mjs
          node tests/v78-12114-role-api-adversarial.mjs
          node tests/v78-ai-copilot-motion-security.mjs
          node tests/v73-daily-operations-reporting-static.mjs
          node tests/v74-performance-learning-static.mjs
          node tests/v81-auth-workspace-selection-adversarial.mjs
          node tests/v78-12162-password-reset-email-delivery-adversarial.mjs
          node tests/v78-12188-oauth-redirect-config-hardening-adversarial.mjs
          node tests/v78-12194-oauth-state-cookie-hardening-adversarial.mjs
          node tests/v82-phase0-launch-audit-deferred-integrations.mjs

      - name: Audit live production without creating customer data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-launch-audit.mjs

      - name: One-shot browser-backed synthetic registration lifecycle closure
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --pretty=%B | grep -Fq '[synthetic-lifecycle]'; then
            echo 'Synthetic lifecycle marker absent; keeping production audit read-only.'
            exit 0
          fi
          node scripts/production-synthetic-interruption-recovery.mjs
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          node scripts/production-synthetic-browser-wrapper.mjs

      - name: One-shot bounded legacy orphan cleanup
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          AUDIT_INTEGRITY_SECRET: ${{ secrets.AUDIT_INTEGRITY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --pretty=%B | grep -Fq '[legacy-orphan-cleanup]'; then
            echo 'Legacy orphan cleanup marker absent; keeping this step read-only.'
            exit 0
          fi
          node scripts/production-legacy-orphan-cleanup.mjs

      - name: Enforce permanent zero-orphan baseline
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-zero-orphan-audit.mjs
