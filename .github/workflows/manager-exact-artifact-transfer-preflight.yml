name: Manager Exact Artifact Transfer Preflight — No Deploy
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-manager-artifacts:
    # Source-only proposal: no secrets, no Cloudflare authentication, no deployment.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require default-branch execution and pinned reviewed artifacts
        shell: bash
        env:
          EXPECTED_REPO: adinosassist-stack/botswana-compliance-platform
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "$GITHUB_REF" = refs/heads/main
          test -f scripts/verify-manager-exact-staging-artifacts.py
      - name: Download exact two immutable artifact ZIPs (read-only GitHub API)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manager-artifacts"
          for ID in 14407666400 14407970936; do
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
              -o "$RUNNER_TEMP/manager-artifacts/$ID.zip"
          done
      - name: Independently verify ZIPs, source, compiled Worker, 278 static files and every manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-manager-exact-staging-artifacts.py \
            --worker "$RUNNER_TEMP/manager-artifacts/14407666400.zip" \
            --assets "$RUNNER_TEMP/manager-artifacts/14407970936.zip" \
            --report "$RUNNER_TEMP/manager-artifact-preflight-report.json"
      - name: Publish redacted immutable verification receipt only
        uses: actions/upload-artifact@v4
        with:
          name: manager-exact-artifact-preflight-receipt
          path: ${{ runner.temp }}/manager-artifact-preflight-report.json
          if-no-files-found: error
          retention-days: 7
