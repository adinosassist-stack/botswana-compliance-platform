name: AI Dock export integration qualification
on:
  pull_request:
    paths:
      - 'server/ai-dock-export-integration.js'
      - 'tests/ai-dock-export-integration.test.mjs'
      - '.github/workflows/ai-dock-export-integration.yml'
permissions:
  contents: read
jobs:
  secure-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/ai-dock-export-integration.test.mjs
