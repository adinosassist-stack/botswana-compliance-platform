name: Agentic Stage 2 patch once

on:
  push:
    branches:
      - chatgpt/agentic-stage2-observe-outcomes-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch governed Stage 2 observation and measurement
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          agent=Path('cloudflare/src/agentic-core.js')
          s=agent.read_text()

          old='''  let opsMetrics={};\n  try{opsMetrics=JSON.parse(String(ops?.metrics_json||"{}"))}catch{}\n  return {'''
          new='''  let opsMetrics={};\n  try{opsMetrics=JSON.parse(String(ops?.metrics_json||"{}"))}catch{}\n  const [performance,compliance]=await Promise.all([\n    safeFirst(env,`SELECT COUNT(*) open_count,\n      SUM(CASE WHEN severity='critical' THEN 1 ELSE 0 END) critical_count,\n      SUM(CASE WHEN severity='warning' THEN 1 ELSE 0 END) warning_count,\n      MAX(created_at) latest_signal_at\n      FROM performance_insights WHERE tenant_id=? AND status IN ('open','acknowledged')`,[tenantId]),\n    safeFirst(env,`SELECT\n      SUM(CASE WHEN status NOT IN ('completed','closed') AND due_at<CURRENT_TIMESTAMP THEN 1 ELSE 0 END) overdue_count,\n      SUM(CASE WHEN status NOT IN ('completed','closed') AND due_at>=CURRENT_TIMESTAMP AND due_at<datetime('now','+14 days') THEN 1 ELSE 0 END) due_14d_count,\n      MIN(CASE WHEN status NOT IN ('completed','closed') AND due_at>=CURRENT_TIMESTAMP THEN due_at END) next_due_at\n      FROM compliance_obligations WHERE tenant_id=?`,[tenantId])\n  ]);\n  return {'''
          if old not in s: raise SystemExit('agent observation insertion point missing')
          s=s.replace(old,new,1)

          old='''      latestCoverage:Number(opsMetrics?.coverage||0)||null\n    }\n  };'''
          new='''      latestCoverage:Number(opsMetrics?.coverage||0)||null\n    },\n    performance:{\n      openSignals:Number(performance?.open_count||0),\n      criticalSignals:Number(performance?.critical_count||0),\n      warningSignals:Number(performance?.warning_count||0),\n      latestSignalAt:performance?.latest_signal_at||null\n    },\n    compliance:{\n      overdueCount:Number(compliance?.overdue_count||0),\n      dueWithin14Days:Number(compliance?.due_14d_count||0),\n      nextDueAt:compliance?.next_due_at||null\n    }\n  };'''
          if old not in s: raise SystemExit('agent observation return point missing')
          s=s.replace(old,new,1)

          marker='''function deterministicFallback(observation){'''
          simulation='''function deterministicSimulation(observation){\n  const cash=Number(observation?.finance?.cashPositionMinor||0);\n  const reconciliationExposure=Math.max(0,Number(observation?.finance?.reconciliationExposureMinor||0));\n  const pending=Math.max(0,Number(observation?.operations?.pendingWorkflowCount||0));\n  const failed=Math.max(0,Number(observation?.operations?.failedWorkflowCount||0));\n  const overdue=Math.max(0,Number(observation?.compliance?.overdueCount||0));\n  const critical=Math.max(0,Number(observation?.performance?.criticalSignals||0));\n  return {\n    type:"deterministic_non_mutating",\n    currency:"BWP",\n    cashStress:{\n      recordedCashMinor:cash,\n      reconciliationExposureMinor:reconciliationExposure,\n      exposureAdjustedCashMinor:cash-reconciliationExposure\n    },\n    operatingLoad:{pendingWorkflowCount:pending,failedWorkflowCount:failed,overdueComplianceCount:overdue,criticalPerformanceSignals:critical},\n    pressureScore:Math.min(100,failed*20+overdue*15+critical*15+Math.min(pending,20)*2),\n    assumptions:[\n      "Reconciliation exposure is treated as downside uncertainty, not a forecasted loss.",\n      "Pressure score is a deterministic triage aid and not a financial, legal or employment decision.",\n      "No simulation output changes business records or authorizes execution."\n    ]\n  };\n}\n\n'''
          if marker not in s: raise SystemExit('fallback marker missing')
          s=s.replace(marker,simulation+marker,1)

          old='''  if(!observation.finance.latestReconciliationAt){\n    actions.push({title:"Run the first finance reconciliation",reason:"No reconciliation snapshot is available yet, so finance certainty is limited.",priority:"medium",sourceRefs:["finance_reconciliation"]});\n  }\n  if(!actions.length){'''
          new='''  if(!observation.finance.latestReconciliationAt){\n    actions.push({title:"Run the first finance reconciliation",reason:"No reconciliation snapshot is available yet, so finance certainty is limited.",priority:"medium",sourceRefs:["finance_reconciliation"]});\n  }\n  if(Number(observation?.compliance?.overdueCount||0)>0){\n    actions.push({title:"Review overdue compliance obligations",reason:`${observation.compliance.overdueCount} compliance obligation(s) are overdue and require human review.`,priority:"high",sourceRefs:["compliance_obligations"]});\n  }\n  if(Number(observation?.performance?.criticalSignals||0)>0){\n    actions.push({title:"Review critical performance signals",reason:`${observation.performance.criticalSignals} critical operating signal(s) are open. Check source reports before acting.`,priority:"high",sourceRefs:["performance_insights"]});\n  }\n  if(!actions.length){'''
          if old not in s: raise SystemExit('fallback expansion point missing')
          s=s.replace(old,new,1)

          old='''  const runId=id(),observation=await observeWorkspace(env,auth.tenant_id);\n  const advisor=await runAdvisor({request,env,ctx,coreFetch,runId,observation});'''
          new='''  const runId=id(),observation=await observeWorkspace(env,auth.tenant_id);\n  observation.simulation=deterministicSimulation(observation);\n  const advisor=await runAdvisor({request,env,ctx,coreFetch,runId,observation});'''
          if old not in s: raise SystemExit('create plan simulation point missing')
          s=s.replace(old,new,1)

          marker='''export async function handleAgenticRequest({request,logicalPath,env,ctx,coreFetch}){'''
          outcome_funcs='''async function listOutcomes(env,auth){\n  const rows=await env.DB.prepare(`SELECT o.id,o.run_id,o.proposal_id,o.outcome_status,o.metric_key,o.baseline_json,o.observed_json,o.note,o.created_at,\n    p.title proposal_title,p.status proposal_status\n    FROM agentic_outcomes o JOIN agentic_proposals p ON p.id=o.proposal_id AND p.tenant_id=o.tenant_id\n    WHERE o.tenant_id=? ORDER BY o.created_at DESC LIMIT 100`).bind(auth.tenant_id).all();\n  return json({items:(rows.results||[]).map(row=>({...row,baseline:JSON.parse(row.baseline_json||"{}"),observed:JSON.parse(row.observed_json||"{}"),baseline_json:undefined,observed_json:undefined})),executionEnabled:false});\n}\n\nasync function recordOutcome({request,env,auth,proposalId}){\n  if(!roleAllowed(auth,"owner","manager"))return json({error:"forbidden"},403);\n  const proposal=await env.DB.prepare(`SELECT id,run_id,status FROM agentic_proposals WHERE id=? AND tenant_id=? LIMIT 1`).bind(proposalId,auth.tenant_id).first();\n  if(!proposal)return json({error:"agentic_proposal_not_found"},404);\n  if(proposal.status==="pending")return json({error:"proposal_decision_required_before_outcome"},409);\n  const body=await readJson(request);\n  const outcomeStatus=String(body?.outcomeStatus||"");\n  const allowed=new Set(["observed","improved","unchanged","worsened","resolved","not_applicable"]);\n  if(!allowed.has(outcomeStatus))return json({error:"invalid_outcome_status"},400);\n  const metricKey=text(body?.metricKey||"",120)||null;\n  const note=text(body?.note||"",1000);\n  const baseline=body?.baseline&&typeof body.baseline==="object"&&!Array.isArray(body.baseline)?body.baseline:{};\n  const observed=body?.observed&&typeof body.observed==="object"&&!Array.isArray(body.observed)?body.observed:{};\n  const outcomeId=id();\n  await env.DB.prepare(`INSERT INTO agentic_outcomes(id,tenant_id,run_id,proposal_id,recorded_by_user_id,outcome_status,metric_key,baseline_json,observed_json,note)\n    VALUES(?,?,?,?,?,?,?,?,?,?)`).bind(outcomeId,auth.tenant_id,proposal.run_id,proposalId,auth.user_id,outcomeStatus,metricKey,JSON.stringify(baseline),JSON.stringify(observed),note).run();\n  return json({ok:true,id:outcomeId,proposalId,runId:proposal.run_id,outcomeStatus,measurementOnly:true,execution:{performed:false,enabled:false}},201);\n}\n\n'''
          if marker not in s: raise SystemExit('handler marker missing')
          s=s.replace(marker,outcome_funcs+marker,1)

          s=s.replace('''    stage:"observe_reason_simulate_recommend",\n    executionEnabled:false,''','''    stage:"observe_reason_simulate_recommend_measure",\n    executionEnabled:false,''',1)
          old='''  if(path==="/api/agentic/runs"&&request.method==="GET")return listRuns(env,auth);\n  if(path==="/api/agentic/plan"&&request.method==="POST")return createPlan({request,env,ctx,coreFetch,auth});\n  const decisionMatch=path.match(/^\\/api\\/agentic\\/proposals\\/([^/]+)\\/(approve|reject)$/);'''
          new='''  if(path==="/api/agentic/runs"&&request.method==="GET")return listRuns(env,auth);\n  if(path==="/api/agentic/outcomes"&&request.method==="GET")return listOutcomes(env,auth);\n  if(path==="/api/agentic/plan"&&request.method==="POST")return createPlan({request,env,ctx,coreFetch,auth});\n  const outcomeMatch=path.match(/^\\/api\\/agentic\\/proposals\\/([^/]+)\\/outcome$/);\n  if(outcomeMatch&&request.method==="POST")return recordOutcome({request,env,auth,proposalId:outcomeMatch[1]});\n  const decisionMatch=path.match(/^\\/api\\/agentic\\/proposals\\/([^/]+)\\/(approve|reject)$/);'''
          if old not in s: raise SystemExit('handler route point missing')
          s=s.replace(old,new,1)

          s=s.replace('''  normalizeProposals,\n  originAllowed,''','''  normalizeProposals,\n  deterministicSimulation,\n  originAllowed,''',1)
          agent.write_text(s)

          migration=Path('cloudflare/migrations/046_v80_agentic_outcomes.sql').read_text()
          schema=Path('cloudflare/schema.sql')
          schema_text=schema.read_text()
          if 'CREATE TABLE IF NOT EXISTS agentic_outcomes' not in schema_text:
            schema.write_text(schema_text.rstrip()+"\n\n"+migration+"\n")

          worker=Path('cloudflare/src/worker.js')
          w=worker.read_text()
          w=w.replace('const EXPECTED_SCHEMA_DELTA="045_v80_agentic_foundation.sql";','const EXPECTED_SCHEMA_DELTA="046_v80_agentic_outcomes.sql";',1)
          old='''  try{await env.DB.prepare("SELECT id FROM agentic_runs LIMIT 1").first()}catch{return false}\n  if(!env.DB)return false;'''
          new='''  try{await env.DB.prepare("SELECT id FROM agentic_runs LIMIT 1").first();await env.DB.prepare("SELECT id FROM agentic_outcomes LIMIT 1").first()}catch{return false}\n  if(!env.DB)return false;'''
          if old not in w: raise SystemExit('worker readiness point missing')
          worker.write_text(w.replace(old,new,1))

          profile=Path('RELEASE_PROFILE.json')
          import json
          data=json.loads(profile.read_text())
          data['latest_cloudflare_migration']='046_v80_agentic_outcomes.sql'
          data['v80_agentic_outcome_measurement']=True
          data['agentic_stage2_execution_enabled']=False
          data['agentic_stage2_external_side_effects']=False
          profile.write_text(json.dumps(data,indent=2)+"\n")

          for name in ['docs/LAUNCH.md','cloudflare/deploy-free.sh']:
            p=Path(name); t=p.read_text(); t=t.replace('045_v80_agentic_foundation.sql','046_v80_agentic_outcomes.sql'); p.write_text(t)

          # Historical gates preserve their original floors while accepting reviewed migration 046 as a successor.
          for p in Path('tests').glob('*.mjs'):
            t=p.read_text()
            if '045_v80_agentic_foundation.sql' not in t or 'latest_cloudflare_migration' not in t or '046_v80_agentic_outcomes.sql' in t: continue
            t=t.replace('"045_v80_agentic_foundation.sql"]','"045_v80_agentic_foundation.sql","046_v80_agentic_outcomes.sql"]')
            t=t.replace("'045_v80_agentic_foundation.sql']","'045_v80_agentic_foundation.sql','046_v80_agentic_outcomes.sql']")
            p.write_text(t)

          wf=Path('.github/workflows/agentic-stage2-patch-once.yml')
          wf.unlink()
          PY
          node --check cloudflare/src/agentic-core.js
          node --check cloudflare/src/worker.js
          git diff --check
      - name: Commit bounded Stage 2 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: extend governed agentic observation and outcome measurement"
          git push origin HEAD:chatgpt/agentic-stage2-observe-outcomes-20260913
