name: Apply SW cache successor tests

on:
  push:
    branches:
      - fix/registration-ui-navigation-owner-20260914

permissions:
  contents: write

concurrency:
  group: apply-sw-cache-successor-tests
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/registration-ui-navigation-owner-20260914
          fetch-depth: 0

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Update stale cache assertions
        run: node scripts/apply-sw-cache-successor-tests.mjs

      - name: Verify changed historical cache assertions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node "$file"
          done < <(git diff --name-only -- 'tests/*.mjs')
          git diff --check

      - name: Remove one-shot updater
        shell: bash
        run: |
          rm -f scripts/apply-sw-cache-successor-tests.mjs
          rm -f .github/workflows/apply-sw-cache-successor-tests.yml

      - name: Commit historical successor assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thebe-desk-release-bot'
          git config user.email 'thebe-desk-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Accept registration UI cache successor in historical gates'
          git push origin HEAD:fix/registration-ui-navigation-owner-20260914
