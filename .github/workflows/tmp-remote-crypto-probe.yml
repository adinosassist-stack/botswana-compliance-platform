name: Temporary remote Workers crypto probe

on:
  push:
    branches:
      - fix/registration-ui-navigation-owner-20260914

permissions:
  contents: read

jobs:
  probe:
    name: Verify PBKDF2 on Cloudflare remote preview
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/registration-ui-navigation-owner-20260914
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install exact Wrangler
        run: npm ci --ignore-scripts
      - name: Run isolated remote preview probe
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/thebe-crypto-probe.log
          npx wrangler dev --remote --config scripts/tmp-crypto-probe-wrangler.jsonc --ip 127.0.0.1 --port 8787 >"$log" 2>&1 &
          pid=$!
          cleanup(){ kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8787/probe -o /tmp/probe.json; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat "$log"; exit 1; fi
          cat /tmp/probe.json
          PROBE_JSON="$(cat /tmp/probe.json)" node <<'NODE'
          const body=JSON.parse(process.env.PROBE_JSON);
          const byIterations=new Map((body.results||[]).map(x=>[Number(x.iterations),x]));
          for(const n of [10000,99999,100000]){
            const r=byIterations.get(n);
            if(!r?.ok)throw new Error(`PBKDF2 ${n} failed: ${r?.errorName||''} ${r?.errorMessage||''}`);
            if(r.bytes!==32)throw new Error(`PBKDF2 ${n} returned ${r.bytes} bytes`);
          }
          console.log(`REMOTE_PBKDF2_100K_PASS elapsedMs=${byIterations.get(100000).elapsedMs}`);
          for(const n of [100001,120000]){
            const r=byIterations.get(n);
            console.log(`REMOTE_PBKDF2_BOUNDARY iterations=${n} ok=${String(r?.ok)} error=${r?.errorName||''} message=${r?.errorMessage||''}`);
          }
          NODE
