name: Temporary registration hotfix finalizer

on:
  push:
    branches:
      - fix/registration-ui-navigation-owner-20260914

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize and verify registration hotfix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/registration-ui-navigation-owner-20260914
          fetch-depth: 0
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Apply final Worker ceiling, regression and cleanup patch
        run: python3 scripts/tmp-finalize-registration-hotfix.py
      - name: Run focused registration and historical regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/worker.js
          node tests/v82-registration-owner-navigation-hardening.mjs
          node tests/v78-12150-resilience-backup-rate-limit-adversarial.mjs
          node tests/v78-start-free-visibility-static.mjs
          node tests/v78-home-navigation-adversarial.mjs
          git diff --check
      - name: Commit qualified source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Thebe Desk CI'
          git config user.email 'thebe-desk-ci@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Workers registration PBKDF2 ceiling and clean audit probes'
          git push origin HEAD:refs/heads/fix/registration-ui-navigation-owner-20260914
