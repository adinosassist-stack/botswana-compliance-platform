name: Dock composer CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/src/advisor-attachments.js'
      - 'cloudflare/src/worker.js'
      - 'cloudflare/src/production-entry.js'
      - 'public/js/thebe-live-voice.js'
      - 'public/js/api-client.js'
      - 'public/js/market-thebe-gemini-narrow-v274.js'
      - 'public/assets/thebe-ai-dock.css'
      - 'public/assets/thebe-ai-immersive-v1.css'
      - 'tests/thebe-aura-fullscreen-browser.mjs'
      - 'tests/thebe-web-conversation-find-2830.mjs'
      - 'public/assets/market-thebe-gemini-v273.css'
      - 'public/assets/thebe-spatial-dock-v246.css'
      - 'public/assets/workspace-audit-refinements-20261013.css'
      - 'tests/workspace-dock-cascade-browser.mjs'
      - 'tests/dock-composer-browser.mjs'
      - 'tests/advisor-attachments-integration.mjs'
      - 'tests/v292-dock-visual-contract-browser.mjs'
      - 'tests/public-dock-width-contract.mjs'
      - '.github/workflows/dock-composer-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install browser driver only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Verify authenticated file review and credit failure handling
        run: node --no-warnings tests/advisor-attachments-integration.mjs
      - name: Verify consolidated chat, voice and advice regressions
        run: |
          node --test tests/ai-dock-general-conversation-routing.test.mjs tests/ai-dock-general-answer-presentation.test.mjs tests/ai-dock-voice-start-race.test.mjs tests/ai-dock-advisor-deadline.test.mjs tests/ai-dock-copy-answer-snapshot.test.mjs tests/ai-dock-empty-advisor-response.test.mjs tests/ai-advisor-business-guidance.test.mjs
      - name: Verify advisor compatibility and API transport
        run: |
          node --no-warnings tests/ai-advisor-planner-integration.mjs
          node tests/v82-idempotent-transport-fallback-runtime.mjs
      - name: Verify public and workspace composer interactions
        env:
          THEBE_AURA_SCREENSHOT_DIR: artifacts/aura
        run: |
          node tests/workspace-dock-cascade-browser.mjs
          node tests/dock-composer-browser.mjs
          node tests/v292-dock-visual-contract-browser.mjs
          node tests/thebe-aura-fullscreen.mjs
          node tests/thebe-aura-fullscreen-browser.mjs
          node tests/thebe-web-conversation-find-2830.mjs
          node tests/public-dock-width-contract.mjs
      - name: Preserve Aura layout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aura-layout-${{ github.event.pull_request.head.sha }}
          path: artifacts/aura/
          if-no-files-found: ignore
          retention-days: 7
