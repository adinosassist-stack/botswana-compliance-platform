name: Corporate Assets protected staging secret candidate
on:
  pull_request:
    paths:
      - '.github/workflows/corporate-assets-protected-secret-candidate.yml'
      - 'scripts/corporate-assets-protected-secret-candidate.mjs'
      - 'tests/corporate-assets-protected-secret-candidate.test.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: Offline preflight, or version-only staging secret candidate creation
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - create-version-only
      expected_main_sha:
        description: Exact approved current main SHA
        required: true
        type: string
      expected_deployed_source_sha:
        description: Exact existing staging Worker source marker
        required: true
        type: string
      authorization:
        description: PREFLIGHT_ONLY or CREATE_PRIVATE_ASSET_SECRET_CANDIDATE
        required: true
        type: string
        default: PREFLIGHT_ONLY
permissions:
  contents: read
concurrency:
  group: corporate-assets-staging-secret-candidate
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate staging guards without credentials
        run: |
          node --check scripts/corporate-assets-protected-secret-candidate.mjs
          node --test tests/corporate-assets-protected-secret-candidate.test.mjs
          npm run test:corporate-assets
  protected-candidate:
    needs: offline
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'create-version-only' &&
      inputs.authorization == 'CREATE_PRIVATE_ASSET_SECRET_CANDIDATE'
    environment: corporate-assets-staging-protected
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_DEPLOYED_SOURCE_SHA: ${{ inputs.expected_deployed_source_sha }}
      ASSETS_STAGING_ROTATION_MODE: CREATE_VERSION_ONLY
      ASSETS_STAGING_ROTATION_AUTHORIZATION: ${{ inputs.authorization }}
      ASSETS_STAGING_GITHUB_READ_TOKEN: ${{ secrets.ASSETS_STAGING_GITHUB_READ_TOKEN }}
      ASSETS_STAGING_CLOUDFLARE_TOKEN: ${{ secrets.ASSETS_STAGING_CLOUDFLARE_TOKEN }}
    steps:
      - name: Deny stale or wrong ref before using credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEPLOYED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          test -n "$ASSETS_STAGING_GITHUB_READ_TOKEN"
          test -n "$ASSETS_STAGING_CLOUDFLARE_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned Wrangler without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify checkout and offline regression gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          node --test tests/corporate-assets-protected-secret-candidate.test.mjs
          npm run test:corporate-assets
      - name: Create secret candidate VERSION ONLY (never deploy)
        run: node scripts/corporate-assets-protected-secret-candidate.mjs
