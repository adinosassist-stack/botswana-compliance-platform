name: Cloudflare credential segmentation offline guard
on:
  pull_request:
    paths:
      - scripts/assess-cloudflare-credential-segmentation-offline.mjs
      - tests/assess-cloudflare-credential-segmentation-offline.test.mjs
      - docs/ops-cloudflare-credential-segmentation-20261107.md
      - .github/workflows/cloudflare-credential-segmentation-offline.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate offline credential exposure gate
        run: |
          node --check scripts/assess-cloudflare-credential-segmentation-offline.mjs
          node --test tests/assess-cloudflare-credential-segmentation-offline.test.mjs
      - name: Preserve no-change security boundary
        run: echo 'Offline-only token-scope metadata tests. No token creation, secret reading, rotation, Cloudflare calls, deployment, database write, or restore authority.' >> "$GITHUB_STEP_SUMMARY"
