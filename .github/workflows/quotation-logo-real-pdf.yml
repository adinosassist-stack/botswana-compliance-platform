name: Quotation Real PDF Acceptance
on:
  pull_request:
    paths:
      - 'server/quotation-logo-pdf.mjs'
      - 'tests/quotation-logo-real-pdf.test.mjs'
      - 'tests/quotation-logo-real-private-e2e.test.mjs'
      - 'server/quotation-draft-lovely-pdf.mjs'
      - 'server/quotation-draft-model.mjs'
      - 'server/quotation-logo-d1-r2-store.mjs'
      - 'server/quotation-logo-template-provider.mjs'
      - 'server/quotation-private-r2-read.mjs'
      - 'tests/quotation-logo-web-crypto-portability.test.mjs'
      - 'server/quotation-logo-pdf-node-staging.mjs'
      - 'server/quotation-logo-web-png-sanitizer.mjs'
      - 'server/quotation-portable-private-staging.mjs'
      - 'server/quotation-private-host-session-gate.mjs'
      - 'server/quotation-synthetic-private-integration.mjs'
      - 'tests/quotation-synthetic-private-integration.test.mjs'
      - 'tests/quotation-private-host-session-gate.test.mjs'
      - 'server/quotation-private-d1-session-verifier.mjs'
      - 'tests/quotation-private-d1-session-verifier.test.mjs'
      - 'docs/sql/quotation-synthetic-auth-staging-candidate.sql'
      - 'tests/quotation-synthetic-auth-schema-workerd.test.mjs'
      - 'tests/quotation-private-auth-workerd-d1.test.mjs'
      - 'server/quotation-private-auth-rehearsal-worker.mjs'
      - 'tests/quotation-private-auth-rehearsal-worker.test.mjs'
      - 'server/quotation-private-bootstrap-deny-all.mjs'
      - 'tests/quotation-private-bootstrap-deny-all.test.mjs'
      - 'scripts/quotation-private-bootstrap-snapshot-guard.mjs'
      - 'scripts/quotation-empty-worker-resource-guard.mjs'
      - 'scripts/quotation-private-version-readiness-guard.mjs'
      - 'tests/quotation-private-version-readiness-guard.test.mjs'
      - 'tests/quotation-empty-worker-resource-guard.test.mjs'
      - 'docs/quotation-empty-worker-resource-bootstrap-20261117.md'
      - 'tests/quotation-private-bootstrap-snapshot-guard.test.mjs'
      - 'docs/quotation-no-subscription-staging-bootstrap-20261117.md'
      - 'tests/quotation-logo-web-png-sanitizer.test.mjs'
      - 'tests/quotation-logo-web-png-workerd.test.mjs'
      - '.github/workflows/quotation-logo-real-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quotation-real-pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-pdf-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PDF engine only in isolated job
        run: |
          mkdir -p "$RUNNER_TEMP/quotation-pdf-engine"
          npm install --prefix "$RUNNER_TEMP/quotation-pdf-engine" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pdf-lib@1.17.1
      - name: Render and reload synthetic two-page quotation with actual engine
        env:
          QUOTATION_PDF_ENGINE_ROOT: ${{ runner.temp }}/quotation-pdf-engine
        run: node --test tests/quotation-logo-real-pdf.test.mjs tests/quotation-logo-real-private-e2e.test.mjs tests/quotation-logo-web-crypto-portability.test.mjs tests/quotation-logo-web-png-sanitizer.test.mjs tests/quotation-private-host-session-gate.test.mjs tests/quotation-synthetic-private-integration.test.mjs tests/quotation-private-d1-session-verifier.test.mjs tests/quotation-private-auth-rehearsal-worker.test.mjs tests/quotation-private-bootstrap-deny-all.test.mjs tests/quotation-private-bootstrap-snapshot-guard.test.mjs tests/quotation-empty-worker-resource-guard.test.mjs tests/quotation-private-version-readiness-guard.test.mjs

  workerd-png-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked runtime emulation toolchain (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify sanitizer against actual local workerd engine
        run: node --test tests/quotation-logo-web-png-workerd.test.mjs tests/quotation-synthetic-auth-schema-workerd.test.mjs tests/quotation-private-auth-workerd-d1.test.mjs
