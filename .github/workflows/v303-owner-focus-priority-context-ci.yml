name: V303 Owner Focus priority context

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/js/owner-focus-strip-v296.js'
      - 'tests/v303-owner-focus-priority-context.mjs'
      - '.github/workflows/v303-owner-focus-priority-context-ci.yml'
  push:
    branches: [main]
    paths:
      - 'public/js/owner-focus-strip-v296.js'
      - 'tests/v303-owner-focus-priority-context.mjs'
      - '.github/workflows/v303-owner-focus-priority-context-ci.yml'

permissions:
  contents: read

jobs:
  priority-context:
    name: Prove Owner Focus priority context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - name: Syntax check Owner Focus asset
        run: node --check public/js/owner-focus-strip-v296.js
      - name: Run V303 priority-context regression
        run: node tests/v303-owner-focus-priority-context.mjs
