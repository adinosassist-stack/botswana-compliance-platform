<!doctype html>
<html lang="en-BW">
<head>

<title>Recover Thebe Desk</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8f7;color:#16191b;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.card{width:min(100%,480px);background:#fff;border:1px solid #e0e6e2;border-radius:20px;padding:24px;box-shadow:0 12px 36px rgba(0,0,0,.07)}h1{font-size:25px;margin:0 0 10px}p{color:#5e6963;line-height:1.55;margin:8px 0}.status{margin-top:18px;padding:12px 14px;border-radius:12px;background:#eef5ff;color:#174b86;font-weight:650}.btn{display:inline-block;margin-top:16px;padding:11px 15px;border-radius:10px;background:#0B66D6;color:#fff;text-decoration:none;font-weight:750}
</style>
<script src="/js/recover-runtime.js" defer></script>
</head>
<body>
<main class="card">
<h1>Recovering Thebe Desk</h1>
<p>This clears only old Thebe Desk service-worker/cache files from this browser. It does not delete your account or production data.</p>
<div id="recoveryStatus" class="status" role="status" aria-live="polite">Starting browser recovery…</div>
<a id="manualOpen" class="btn" href="/" hidden>Open live site</a>
</main>
</body>
