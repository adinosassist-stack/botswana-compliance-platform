<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="bw-runtime-mode" content="staging"><title>Activate Thebe Desk manager account</title><style>body{font:16px system-ui,sans-serif;background:#f7f9fb;color:#152634;margin:0}.shell{max-width:460px;margin:6vh auto;padding:24px;background:white;border:1px solid #dae2ea;border-radius:16px}label{display:block;margin:16px 0 6px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:8px}input{border:1px solid #8793a1}button{border:0;background:#1265c8;color:white;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}</style><script defer src="/js/api-client.js"></script><script defer src="/js/manager-invite-activate.js"></script></head><body><main class="shell"><h1>Activate manager account</h1><p>Set your own password for your Thebe Desk manager account. The invitation can be used only once.</p><form id="activate-form"><label for="password">Password (at least 12 characters)</label><input id="password" name="password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" maxlength="200" autocomplete="new-password" required><button id="activate-button" type="submit">Activate account</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/auth/?mode=login">Return to sign in</a></p></main></body></html>
