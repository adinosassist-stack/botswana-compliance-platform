<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="bw-runtime-mode" content="staging"><title>Request manager access — Thebe Desk</title><style>body{margin:0;background:#f5f7fa;color:#172737;font:16px system-ui,sans-serif}.shell{max-width:560px;margin:5vh auto;padding:26px;background:#fff;border:1px solid #dbe2ea;border-radius:16px}input,select,textarea,button{font:inherit;padding:12px;border-radius:9px;box-sizing:border-box;width:100%}input,select,textarea{border:1px solid #92a1b1;margin:6px 0 14px}button{border:0;background:#1256b6;color:#fff;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.55}small{color:#526171}</style><script defer src="/js/api-client.js"></script><script type="module" src="/js/manager-access-request-entry.js"></script></head><body><main class="shell"><h1>Request manager access</h1><p>Registered team members can request manager access to an assigned branch. Your business owner must review the request. Approval does not activate access until provisioning is complete.</p><form id="request-form"><label for="branch">Branch</label><select id="branch" required><option value="">Loading branches…</option></select><label for="reason">Reason (optional)</label><textarea id="reason" maxlength="500" rows="3" placeholder="Why do you need manager access?"></textarea><button id="send" type="submit">Send request</button></form><p id="status" role="status" aria-live="polite"></p><section id="previous" aria-label="Previous requests"></section><small>Secure private staging. No manager permissions are granted by requesting access.</small></main></body></html>
