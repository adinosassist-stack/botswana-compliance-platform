<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Accept Terms | Thebe Desk</title>
  <link rel="stylesheet" href="/legal-accept.css">
</head>
<body>
  <main class="legal-shell" aria-labelledby="legalTitle">
    <section class="legal-card">
      <a class="brand" href="/" aria-label="Thebe Desk home">Thebe Desk</a>
      <p class="eyebrow">Account protection</p>
      <h1 id="legalTitle">Review before you continue</h1>
      <p class="intro">Your account is ready. To open your workspace, agree to the current Terms of Service and acknowledge the Privacy Notice.</p>
      <div class="version" aria-label="Legal document version">Current version: 14 October 2026</div>
      <label class="consent-row" for="legalAccept">
        <input id="legalAccept" type="checkbox">
        <span>I agree to the <a href="/terms/" target="_blank" rel="noopener noreferrer">Terms of Service</a> and acknowledge the <a href="/privacy/" target="_blank" rel="noopener noreferrer">Privacy Notice</a>.</span>
      </label>
      <button id="legalContinue" type="button">Accept and open workspace</button>
      <p id="legalStatus" class="status" role="status" aria-live="polite"></p>
      <p class="foot"><a href="/trust/">Trust Center</a> · <a href="/security/">Security</a> · <button id="legalSignOut" class="link-button" type="button">Sign out</button></p>
    </section>
  </main>
  <script src="/js/legal-accept.js" defer></script>
</body>
</html>
