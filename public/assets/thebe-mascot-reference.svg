<svg xmlns="http://www.w3.org/2000/svg" class="thebe-market-mascot" viewBox="0 0 1000 1000" role="img" aria-labelledby="thebeMascotTitle thebeMascotDesc">
          <title id="thebeMascotTitle">Thebe</title>
          <desc id="thebeMascotDesc">Friendly floating white robot with a dark navy face and cyan smile.</desc>
