<!doctype html>
<html lang="en-BW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forgot password · Thebe Desk</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8f7;color:#16191b;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.card{width:min(100%,440px);background:#fff;border:1px solid #e0e6e2;border-radius:20px;padding:26px;box-shadow:0 12px 36px rgba(0,0,0,.07)}h1{font-size:26px;margin:0 0 8px}p{color:#5e6963;line-height:1.55}label{display:block;margin:20px 0 7px;font-weight:700}input{width:100%;min-height:48px;border:1px solid #cfd8d3;border-radius:11px;padding:10px 12px;font:inherit}button{width:100%;min-height:48px;margin-top:14px;border:0;border-radius:11px;background:#0B66D6;color:#fff;font:inherit;font-weight:750}.status{min-height:22px;margin-top:13px;color:#174b86}.back{display:inline-block;margin-top:18px;color:#0B66D6}</style>
<script src="/js/api-client.js" defer></script><script src="/js/password-reset.js" defer></script></head><body><main class="card"><h1>Reset your password</h1><p>Enter your account email. If an account exists, we’ll send a secure reset link.</p><form id="resetRequestForm"><label for="resetEmail">Email</label><input id="resetEmail" type="email" autocomplete="email" maxlength="254" required><button id="resetRequestButton" type="submit">Send reset link</button><div class="status" id="resetStatus" role="status" aria-live="polite"></div></form><a class="back" href="/auth.html">Back to sign in</a></main></body></html>
