# Review-only Dock staging candidate. Activation requires the protected workflow.
# Both services require the same staging-only SESSION_SECRET via secret bindings.
# Workspace origin remains unset until protected activation.
name = "bw-dock-research-workspace-staging"
main = "src/general-ai-dock-workspace-staging-worker.js"
compatibility_date = "2026-09-03"
workers_dev = false
preview_urls = false
keep_vars = false

[vars]
APP_ENV = "staging"
DOCK_STAGING_RESEARCH_ENABLED = "false"
THEBE_GENERAL_AI_ENABLED = "false"
THEBE_GENERAL_AI_RESEARCH_ENABLED = "false"
AI_FEATURES_DEFAULT = "off"
THEBE_INTERNAL_AUTONOMY_ENABLED = "false"
AGENT_BOUNDED_TASK_EXECUTION_ENABLED = "0"
THEBE_LIVE_VOICE_ENABLED = "false"
THEBE_MARKETING_VOICE_ENABLED = "false"
PAYMENT_PROVIDER = "none"
REGISTRATION_MODE = "hold"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bw-dock-hosted-synthetic-staging"
database_id = "c63255cf-c589-4f6b-99c7-2d2e437566b5"

[[services]]
binding = "STAGING_AI"
service = "bw-dock-private-ai-staging"
