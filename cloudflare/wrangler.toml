name = "bw-compliance-os"
main = "src/worker.js"
compatibility_date = "2026-09-03"
workers_dev = false
preview_urls = false
keep_vars = true

[[routes]]
pattern = "thebedesk.com"
custom_domain = true

[secrets]
required = ["SESSION_SECRET", "AUDIT_INTEGRITY_SECRET", "OPERATIONS_SECRET", "AUTOMATION_SECRET", "TURNSTILE_SECRET_KEY", "PAYMENT_WEBHOOK_SECRET", "BILLING_WEBHOOK_SECRET"]

[vars]
APP_ENV = "production"
DEPLOYMENT_PROFILE = "workers-free-first"
AI_FEATURES_DEFAULT = "on"
AI_REPORT_MODEL = "@cf/zai-org/glm-4.7-flash"
PAYMENT_PROVIDER = "none"
TRIAL_DAYS = "14"
MAX_UPLOAD_MB = "3.5"
EVIDENCE_UPLOADS_ENABLED = "false"
PENDING_UPLOAD_RETENTION_DAYS = "3"
FAILED_UPLOAD_RETENTION_DAYS = "7"
PUBLIC_APP_URL = "REPLACE_WITH_PUBLIC_APP_URL"
PUBLIC_ORIGIN = "REPLACE_WITH_PUBLIC_ORIGIN"
TURNSTILE_SITE_KEY = "REPLACE_WITH_TURNSTILE_SITE_KEY"
PLATFORM_ADMIN_EMAILS = "REPLACE_WITH_PLATFORM_ADMIN_EMAILS"
PLATFORM_REGULATORY_REVIEWERS = "REPLACE_WITH_PLATFORM_REGULATORY_REVIEWERS"
EVIDENCE_SCAN_API_URL = "REPLACE_WITH_EVIDENCE_SCAN_API_URL"

[[d1_databases]]
binding = "DB"
database_name = "bw-compliance-os"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "bw-compliance-evidence"

[ai]
binding = "AI"

[assets]
directory = "../public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/", "/index.html", "/robots.txt", "/sitemap.xml", "/cipa-compliance-botswana/*", "/burs-tax-compliance-botswana/*", "/business-licences-botswana/*", "/employment-compliance-botswana/*", "/tender-readiness-botswana/*", "/compliance-evidence-botswana/*", "/pricing/*", "/api/*", "/public/*"]

# Set with: npx wrangler secret put PAYMENT_WEBHOOK_SECRET
# Set with: npx wrangler secret put BILLING_WEBHOOK_SECRET
# Set with: npx wrangler secret put AUTOMATION_SECRET
# Set with: npx wrangler secret put TURNSTILE_SECRET_KEY
# Configure TURNSTILE_SITE_KEY as a public environment variable for the production hostname.

[triggers]
crons = ["15 6 * * *", "15 16 * * *"]

# v37 social OAuth secrets are set with `wrangler secret put`, not committed here:
# GOOGLE_OAUTH_CLIENT_SECRET
# FACEBOOK_APP_SECRET
# Also configure GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_REDIRECT_URI and
# FACEBOOK_APP_ID / FACEBOOK_OAUTH_REDIRECT_URI as environment variables or secrets.

# Transactional email / password reset:
# Set RESEND_API_KEY with `wrangler secret put RESEND_API_KEY` and configure EMAIL_FROM to a verified sender before enabling email.
# PUBLIC_APP_URL and PUBLIC_ORIGIN must resolve to the same final HTTPS app origin.
# PUBLIC_ORIGIN is required for fail-closed browser-origin enforcement.

# Payment provider configuration
# Safe launch default is PAYMENT_PROVIDER="none"; paid checkout stays disabled until an approved provider is explicitly enabled.
# For DPO enablement, render a temporary production config with PAYMENT_PROVIDER_OVERRIDE=dpo only after all DPO credentials/endpoints are verified.
# PUBLIC_APP_URL = "https://your-domain.example"
# PUBLIC_ORIGIN = "https://your-domain.example"
# DPO_SERVICE_TYPE = "provided-by-dpo"
# DPO_ALLOWED_HOSTS = "secure.3gdirectpay.com" # comma-separated exact HTTPS hosts only when DPO authorizes another endpoint
# Set DPO_COMPANY_TOKEN with wrangler secret put DPO_COMPANY_TOKEN
# Set PAYMENT_WEBHOOK_SECRET with wrangler secret put PAYMENT_WEBHOOK_SECRET
# Set BILLING_WEBHOOK_SECRET with wrangler secret put BILLING_WEBHOOK_SECRET

# Meta WhatsApp Cloud API utility notifications (optional, fail-closed):
# WHATSAPP_PHONE_NUMBER_ID and WHATSAPP_GRAPH_VERSION=v26.0 are environment variables.
# Set WHATSAPP_TEMPLATE_MAP_JSON only after all six utility templates are approved.
# wrangler secret put WHATSAPP_ACCESS_TOKEN
# wrangler secret put WHATSAPP_APP_SECRET
# wrangler secret put WHATSAPP_VERIFY_TOKEN
# Configure the Meta callback as https://your-domain/api/webhooks/whatsapp and subscribe to messages.

# Orange Money Web Payment Botswana is merchant-gated.
# Production renderer/preflight currently blocks orange_money until its readiness-key mismatch is separately fixed and reviewed.
# wrangler secret put ORANGE_MONEY_CLIENT_ID
# wrangler secret put ORANGE_MONEY_CLIENT_SECRET
# wrangler secret put ORANGE_MONEY_MERCHANT_KEY
# ORANGE_MONEY_API_BASE and ORANGE_MONEY_CREATE_PAYMENT_PATH must come from merchant-specific production documentation.

# Dedicated keyed audit-ledger integrity secret (required; no SESSION_SECRET fallback)
# Set with: npx wrangler secret put AUDIT_INTEGRITY_SECRET

# Platform regulatory governance lists (comma-separated verified user emails)
# PLATFORM_REGULATORY_EDITORS = "editor@example.com"
# PLATFORM_REGULATORY_REVIEWERS = "reviewer@example.com"
# PLATFORM_ADMIN_EMAILS = "admin@example.com"

# Required core production secrets / settings before /api/ready returns ready:
# wrangler secret put SESSION_SECRET
# wrangler secret put AUDIT_INTEGRITY_SECRET
# wrangler secret put OPERATIONS_SECRET
# Configure PLATFORM_ADMIN_EMAILS, PLATFORM_REGULATORY_REVIEWERS, PUBLIC_APP_URL and PUBLIC_ORIGIN.
# The EVIDENCE R2 and DB D1 bindings must also be valid.

# Evidence malware scanning:
# No third-party malware-scanning provider is configured for this launch.
# EVIDENCE_UPLOADS_ENABLED remains false and evidence mutations fail closed.
# EVIDENCE_SCAN_API_URL must render empty for this release; no scanner secret is required.

# Native edge throttling for public bearer-link endpoints. Counters are maintained by
# Cloudflare's Rate Limiting binding rather than consuming D1 rows.
[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "78212150"

  [ratelimits.simple]
  limit = 30
  period = 60
